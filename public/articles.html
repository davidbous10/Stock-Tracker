<!DOCTYPE html>
<html lang="en" style="background:#F3EEDF">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Articles | Trade Track</title>
    <meta name="description" content="Track stocks, get AI-powered analysis, and stay on top of the market with Trade Track." />
  <meta name="theme-color" content="#17442F" />
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/logo-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Archivo:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* paper */
      --paper: #F3EEDF;
      --paper-raise: #FBF7EB;
      --paper-bright: #FFFDF4;
      --paper-sunken: #ECE5D0;
      /* ink */
      --ink: #23281F;
      --ink-muted: #686C5B;
      --ink-faint: #9A9C8B;
      /* rules (the printed lines of ledger paper) */
      --rule: #DDD5BE;
      --rule-strong: #C6BEA2;
      --margin-red: #C05A50;
      /* the bank */
      --green: #17442F;
      --green-deep: #0F3323;
      --green-bright: #1E5C3D;
      --brass: #A97F2F;
      --brass-soft: #C9A75C;
      /* money */
      --up: #1D6A43;
      --up-bg: #E3EBDA;
      --down: #8C2F2B;
      --down-bg: #F1E0D8;
      /* type */
      --font-display: 'Marcellus', 'Georgia', serif;
      --font-ui: 'Archivo', system-ui, sans-serif;
      --font-data: 'Courier Prime', 'Courier New', monospace;
      --shadow-paper: 0 1px 0 rgba(35,40,31,0.05), 0 8px 22px rgba(35,40,31,0.08);
      /* legacy aliases so any straggler rule still resolves */
      --text: var(--ink);
      --text-muted: var(--ink-muted);
      --text-faint: var(--ink-faint);
      --border: var(--rule-strong);
      --border-soft: var(--rule);
      --surface: var(--paper-raise);
      --surface-hover: var(--paper-bright);
      --accent: var(--brass);
      --bg: var(--paper);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-ui);
      display: flex;
      justify-content: center;
      padding: 40px 24px;
    }

    a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid var(--brass);
      outline-offset: 2px;
    }

    .app {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      align-items: flex-start;
      gap: 34px;
    }

    /* ---- Sidebar: the ledger's cover ---- */
    .sidebar {
      width: 232px;
      flex-shrink: 0;
      position: sticky;
      top: 40px;
      display: flex;
      flex-direction: column;
      gap: 26px;
      background: var(--green);
      border: 1px solid var(--green-deep);
      border-radius: 4px;
      padding: 22px 16px;
      box-shadow: var(--shadow-paper);
      color: #EFE9D4;
    }
    .sidebar-brand { display: flex; align-items: center; gap: 11px; }
    .sidebar-title {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 400;
      letter-spacing: 0.02em;
      color: #F3EEDF;
    }
    .sidebar .eyebrow { color: var(--brass-soft); }

    .side-nav { display: flex; flex-direction: column; gap: 2px; }
    .side-nav-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 3px;
      color: #B9C1AC;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.01em;
    }
    .side-nav-link svg { flex-shrink: 0; }
    .side-nav-link:hover { background: rgba(243,238,223,0.08); color: #F3EEDF; }
    .side-nav-link.active {
      background: rgba(15,51,35,0.85);
      color: #F3EEDF;
      box-shadow: inset 2px 0 0 var(--brass-soft);
    }

    .account-block {
      margin-top: auto;
      padding-top: 18px;
      border-top: 1px solid rgba(243,238,223,0.16);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .account-row { display: flex; align-items: center; }
    .account-avatar-wrap { position: relative; display: inline-flex; }
    .account-avatar {
      width: 32px;
      height: 32px;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-data);
      font-weight: 700;
      font-size: 13px;
      color: #F3EEDF;
      border: 1px solid rgba(243,238,223,0.25);
      flex-shrink: 0;
      cursor: default;
    }
    .account-email {
      position: absolute;
      left: calc(100% + 10px);
      top: 50%;
      transform: translateY(-50%);
      background: var(--green-deep);
      border: 1px solid rgba(201,167,92,0.5);
      color: #F3EEDF;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 3px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
      z-index: 20;
    }
    .account-avatar-wrap:hover .account-email { opacity: 1; }
    .btn-logout-full {
      display: flex;
      align-items: center;
      gap: 8px;
      background: none;
      border: 1px solid rgba(243,238,223,0.25);
      color: #B9C1AC;
      border-radius: 3px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      font-family: var(--font-ui);
      cursor: pointer;
    }
    .btn-logout-full:hover { border-color: #D99C92; color: #F1D8D2; }

    .main-content { flex: 1; min-width: 0; }

    @media (max-width: 800px) {
      .app { flex-direction: column; }
      .sidebar {
        width: 100%;
        position: static;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px;
      }
      .side-nav { flex-direction: row; }
      .account-block {
        margin-top: 0;
        padding-top: 0;
        border-top: none;
        flex-direction: row;
      }
      .account-email { display: none; }
    }

    /* ---- Shared identity bits ---- */
    .brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    .brand-row > div:nth-child(2) { flex: 1; }
    .brand-mark { border-radius: 4px; flex-shrink: 0; }

    .eyebrow {
      font-family: var(--font-ui);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--brass);
      margin-bottom: 5px;
    }
    h1 {
      font-family: var(--font-display);
      font-weight: 400;
      letter-spacing: 0.01em;
    }

    /* ---- Auth screen: the certificate ---- */
    .auth-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card {
      width: 100%;
      max-width: 380px;
      background: var(--paper-raise);
      border: 1px solid var(--rule-strong);
      border-radius: 3px;
      padding: 38px 34px;
      box-shadow: var(--shadow-paper);
      position: relative;
    }
    .auth-card::before {
      content: '';
      position: absolute;
      inset: 8px;
      border: 1px solid var(--brass-soft);
      border-radius: 2px;
      pointer-events: none;
      opacity: 0.75;
    }
    .auth-card .brand-row { margin-bottom: 26px; }
    .auth-card h1 { font-size: 27px; }

    .auth-tabs {
      display: flex;
      gap: 4px;
      background: var(--paper-sunken);
      border: 1px solid var(--rule);
      border-radius: 3px;
      padding: 4px;
      margin-bottom: 20px;
      position: relative;
    }
    .auth-tab {
      flex: 1;
      background: none;
      border: none;
      color: var(--ink-muted);
      font-family: var(--font-ui);
      font-size: 13px;
      font-weight: 600;
      padding: 8px 0;
      border-radius: 2px;
      cursor: pointer;
    }
    .auth-tab.active { background: var(--green); color: #F3EEDF; }

    #authForm { display: flex; flex-direction: column; gap: 10px; position: relative; }
    #authForm input {
      width: 100%;
      background: var(--paper-bright);
      border: 1px solid var(--rule-strong);
      border-radius: 2px;
      padding: 11px 14px;
      color: var(--ink);
      font-size: 14px;
      font-family: var(--font-ui);
      outline: none;
    }
    #authForm input:focus { border-color: var(--green); }
    .auth-hint { font-size: 11px; color: var(--ink-faint); margin-top: -4px; }
    .auth-msg { font-size: 13px; color: var(--down); min-height: 16px; }
    .btn-auth-submit {
      background: var(--green);
      color: #F3EEDF;
      border: none;
      border-radius: 2px;
      padding: 12px 0;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-family: var(--font-ui);
      cursor: pointer;
      margin-top: 6px;
    }
    .btn-auth-submit:hover { background: var(--green-bright); }
    .btn-auth-submit:disabled { opacity: 0.6; cursor: default; }

    /* ---- Section headings: ledger column heads ---- */
    .section-label {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: var(--font-ui);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin: 30px 0 12px;
    }
    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--rule-strong);
    }
    .section-label:first-of-type { margin-top: 0; }

    /* ---- Skeleton loading on paper ---- */
    .skeleton {
      background: linear-gradient(90deg, #E9E1CB 25%, #DFD6BD 37%, #E9E1CB 63%);
      background-size: 400% 100%;
      animation: shimmer 1.6s ease infinite;
      border-radius: 2px;
    }
    @keyframes shimmer {
      0% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .skeleton { animation: none; }
    }

    /* ---- Articles ---- */
    .page-title { font-family: var(--font-display); font-size: 24px; }
    .page-subtitle {
      font-family: var(--font-data);
      font-size: 13px;
      color: var(--ink-muted);
      margin-top: 4px;
    }

    .featured-card {
      display: flex;
      gap: 0;
      background: var(--paper-raise) linear-gradient(var(--margin-red), var(--margin-red)) no-repeat 15px 0 / 1px 100%;
      border: 1px solid var(--rule-strong);
      border-radius: 3px;
      box-shadow: var(--shadow-paper);
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      margin-bottom: 12px;
    }
    .featured-card:hover { border-color: var(--brass-soft); }
    .featured-img {
      width: 260px;
      flex-shrink: 0;
      object-fit: cover;
      background: var(--paper-sunken);
      border-right: 1px solid var(--rule);
      display: block;
      filter: sepia(0.14) saturate(0.92);
    }
    .featured-body { padding: 18px 20px 18px 24px; min-width: 0; display: flex; flex-direction: column; }
    .featured-headline {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 400;
      line-height: 1.3;
      margin-bottom: 8px;
    }
    .featured-summary {
      font-size: 13px;
      color: var(--ink-muted);
      line-height: 1.55;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .news-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .news-card {
      display: flex;
      gap: 14px;
      background: var(--paper-raise) linear-gradient(var(--margin-red), var(--margin-red)) no-repeat 15px 0 / 1px 100%;
      border: 1px solid var(--rule-strong);
      border-radius: 3px;
      box-shadow: var(--shadow-paper);
      padding: 14px 14px 14px 24px;
      text-decoration: none;
      color: inherit;
      min-width: 0;
    }
    .news-card:hover { border-color: var(--brass-soft); }
    .news-thumb {
      width: 74px;
      height: 74px;
      border-radius: 2px;
      border: 1px solid var(--rule);
      object-fit: cover;
      flex-shrink: 0;
      background: var(--paper-sunken);
      display: block;
      filter: sepia(0.14) saturate(0.92);
    }
    .news-card-body { min-width: 0; }
    .news-headline {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .news-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      color: var(--ink-faint);
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .news-meta .src {
      color: var(--brass);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .news-meta .dot { flex-shrink: 0; }
    .news-meta .when { flex-shrink: 0; font-family: var(--font-data); font-size: 11px; }

    .ticker-group {
      background: var(--paper-raise) linear-gradient(var(--margin-red), var(--margin-red)) no-repeat 15px 0 / 1px 100%;
      border: 1px solid var(--rule-strong);
      border-radius: 3px;
      box-shadow: var(--shadow-paper);
      padding: 16px 18px 16px 26px;
      margin-bottom: 12px;
    }
    .ticker-group-head {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 4px;
    }
    .ticker-group-symbol {
      font-family: var(--font-data);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .ticker-group-name {
      font-size: 12px;
      color: var(--ink-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    .ticker-article {
      display: block;
      padding: 10px 0;
      border-top: 1px solid var(--rule);
      text-decoration: none;
      color: inherit;
    }
    .ticker-group .ticker-article:first-of-type { border-top: none; margin-top: 6px; }
    .ticker-article:hover .ticker-article-headline { color: var(--green-bright); }
    .ticker-article-headline {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.45;
    }
    .ticker-article .news-meta { margin-bottom: 3px; }
    .ticker-no-news {
      font-size: 12px;
      color: var(--ink-faint);
      font-style: italic;
      padding: 8px 0 2px;
    }

    .feed-empty {
      background: transparent;
      border: 1px dashed var(--rule-strong);
      border-radius: 3px;
      padding: 24px;
      text-align: center;
      color: var(--ink-muted);
      font-size: 14px;
    }
    .feed-empty a { color: var(--green); font-weight: 600; }

    .btn-save {
      background: none; border: none; color: var(--ink-faint);
      cursor: pointer; padding: 4px; flex-shrink: 0; border-radius: 2px;
    }
    .btn-save:hover { color: var(--brass); }
    .btn-save.saved { color: var(--brass); }

    .featured-card { position: relative; }
    .featured-card .btn-save { position: absolute; top: 10px; right: 10px; }
    .news-card { position: relative; }
    .news-card .btn-save { position: absolute; top: 8px; right: 8px; }
    .ticker-article { position: relative; }
    .ticker-article .btn-save { position: absolute; top: 10px; right: 0; }

    .saved-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 0; border-bottom: 1px solid var(--rule);
    }
    .saved-item:last-child { border-bottom: none; }
    .saved-item-body { flex: 1; min-width: 0; }
    .saved-item-link { text-decoration: none; color: inherit; }
    .saved-item-link:hover .saved-item-headline { color: var(--green-bright); }
    .saved-item-headline { font-size: 13px; font-weight: 600; line-height: 1.4; }

    .refresh-btn {
      background: none; border: 1px solid var(--rule-strong);
      color: var(--ink-muted); border-radius: 2px;
      padding: 8px 14px; font-size: 12px;
      font-family: var(--font-ui); font-weight: 600; cursor: pointer;
    }
    .refresh-btn:hover { border-color: var(--green); color: var(--ink); }

    .skel-featured {
      background: var(--paper-raise);
      border: 1px solid var(--rule);
      border-radius: 3px;
      height: 140px;
      margin-bottom: 12px;
      padding: 18px 20px;
    }
    .skel-news-card {
      background: var(--paper-raise);
      border: 1px solid var(--rule);
      border-radius: 3px;
      padding: 14px;
      height: 102px;
    }
    .skel-line { height: 12px; margin-bottom: 8px; }

    @media (max-width: 640px) {
      .news-grid { grid-template-columns: 1fr; }
      .featured-card { flex-direction: column; }
      .featured-img { width: 100%; height: 150px; border-right: none; border-bottom: 1px solid var(--rule); }
    }

    /* ---- Mobile bottom tab bar ---- */
    .bottom-tabs {
      display: none;
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--green); border-top: 1px solid var(--green-deep);
      z-index: 100; padding: 6px 0 env(safe-area-inset-bottom, 6px);
    }
    .bottom-tabs nav {
      display: flex; justify-content: space-around; align-items: center;
    }
    .tab-link {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      text-decoration: none; color: #B9C1AC; font-size: 10px; font-weight: 600;
      padding: 4px 8px; letter-spacing: 0.02em;
    }
    .tab-link:hover, .tab-link.active { color: #F3EEDF; }
    .tab-link.active svg { stroke: var(--brass-soft); }

    @media (max-width: 800px) {
      .sidebar { display: none !important; }
      .bottom-tabs { display: block; }
      .app { padding-bottom: 72px; }
      body { padding: 20px 16px 0; }
    }

  </style>
</head>
<body>
  <div class="auth-screen" id="authScreen" style="display:none">
    <div class="auth-card">
      <div class="brand-row">
        <img src="/logo.svg" alt="" class="brand-mark" width="36" height="36" />
        <div>
          <div class="eyebrow">Private ledger</div>
          <h1>Trade Track</h1>
        </div>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLogin">Log in</button>
        <button class="auth-tab" id="tabSignup">Sign up</button>
      </div>

      <form id="authForm">
        <input type="text" id="authName" placeholder="First name" autocomplete="given-name" style="display:none" />
        <input type="email" id="authEmail" placeholder="Email" autocomplete="email" required />
        <input type="password" id="authPassword" placeholder="Password" autocomplete="current-password" required />
        <div class="auth-hint" id="authHint"></div>
        <div class="auth-msg" id="authMsg"></div>
        <button type="submit" class="btn-auth-submit" id="authSubmit">Log in</button>
      </form>
    </div>
  </div>

  <div class="app" id="appRoot" style="display:none;" data-display="flex">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img src="/logo.svg" alt="" class="brand-mark" width="32" height="32" />
        <div>
          <div class="eyebrow">Private ledger</div>
          <div class="sidebar-title">Trade Track</div>
        </div>
      </div>

      <nav class="side-nav">

          Home
        </a>

          Watchlist
        </a>
        <a href="/articles.html" class="side-nav-link active">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          Articles
        </a>
        <a href="/sectors.html" class="side-nav-link">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          Sectors
        </a>
        <a href="/portfolio.html" class="side-nav-link">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          Portfolio

          <div class="skel-news-card"><div class="skeleton skel-line" style="width:40%"></div><div class="skeleton skel-line" style="width:90%"></div><div class="skeleton skel-line" style="width:70%"></div></div>

  <script src="/auth.js"></script>
  <script src="/chat.js"></script>
  <script>
    AuthGuard.init(initArticlesPage);

    function esc(str) {
      const div = document.createElement('div');
      div.textContent = str == null ? '' : String(str);
      return div.innerHTML;
    }

    function timeAgo(unixSeconds) {
      if (!unixSeconds) return '';
      const diffMs = Date.now() - unixSeconds * 1000;
      const mins = Math.floor(diffMs / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return `${mins}m ago`;
      const hours = Math.floor(mins / 60);
      if (hours < 24) return `${hours}h ago`;
      const days = Math.floor(hours / 24);
      if (days <= 7) return `${days}d ago`;
      return new Date(unixSeconds * 1000).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    const IMG_FALLBACK = `onerror="this.remove()"`;

    function metaHtml(article) {
      return `<div class="news-meta"><span class="src">${esc(article.source)}</span><span class="dot">·</span><span class="when">${esc(timeAgo(article.datetime))}</span></div>`;
    }

    let savedUrls = new Set();

    function saveBtn(a) {
      const saved = savedUrls.has(a.url);
      return `<button class="btn-save ${saved ? 'saved' : ''}" data-url="${esc(a.url)}" data-headline="${esc(a.headline)}" data-source="${esc(a.source)}" data-datetime="${a.datetime || ''}" onclick="toggleSave(event, this)" title="${saved ? 'Unsave' : 'Save'}"><svg width="14" height="14" viewBox="0 0 24 24" fill="${saved ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></button>`;
    }

    async function toggleSave(e, btn) {
      e.preventDefault();
      e.stopPropagation();
      const url = btn.dataset.url;
      try {
        if (savedUrls.has(url)) {
          await AuthGuard.fetch('/api/saved-articles', { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url }) });
          savedUrls.delete(url);
        } else {
          await AuthGuard.fetch('/api/saved-articles', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url, headline: btn.dataset.headline, source: btn.dataset.source, datetime: btn.dataset.datetime ? parseInt(btn.dataset.datetime) : null }) });
          savedUrls.add(url);
        }
        const saved = savedUrls.has(url);
        btn.className = 'btn-save ' + (saved ? 'saved' : '');
        btn.querySelector('svg').setAttribute('fill', saved ? 'currentColor' : 'none');
        btn.title = saved ? 'Unsave' : 'Save';
        loadSavedArticles();
      } catch (err) {}
    }

    async function initArticlesPage() {
      document.getElementById('pageDate').textContent =
        new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
      try {
        const res = await AuthGuard.fetch('/api/saved-articles');
        const data = await res.json();
        if (res.ok) savedUrls = new Set((data.articles || []).map(a => a.url));
      } catch (err) {}
      loadMarketNews();
      loadWatchlistNews();
      loadSavedArticles();
      document.getElementById('refreshBtn').addEventListener('click', () => { loadMarketNews(); loadWatchlistNews(); });
    }

    async function loadMarketNews() {
      const el = document.getElementById('marketNews');
      try {
        const res = await AuthGuard.fetch('/api/news/market');
        const data = await res.json();
        if (!res.ok) { el.innerHTML = `<div class="feed-empty">${esc(data.error || 'Could not load market news')}</div>`; return; }
        const articles = data.articles || [];
        if (articles.length === 0) { el.innerHTML = '<div class="feed-empty">No market news available right now</div>'; return; }
        const [featured, ...rest] = articles;
        const featuredHtml = `
          <a class="featured-card" href="${esc(featured.url)}" target="_blank" rel="noopener">
            ${featured.image ? `<img class="featured-img" src="${esc(featured.image)}" alt="" ${IMG_FALLBACK} />` : ''}
            <div class="featured-body">
              ${metaHtml(featured)}
              <div class="featured-headline">${esc(featured.headline)}</div>
              ${featured.summary ? `<div class="featured-summary">${esc(featured.summary)}</div>` : ''}
            </div>
            ${saveBtn(featured)}
          </a>`;
        const gridHtml = rest.map(a => `
          <a class="news-card" href="${esc(a.url)}" target="_blank" rel="noopener">
            ${a.image ? `<img class="news-thumb" src="${esc(a.image)}" alt="" ${IMG_FALLBACK} />` : ''}
            <div class="news-card-body">
              ${metaHtml(a)}
              <div class="news-headline">${esc(a.headline)}</div>
            </div>
            ${saveBtn(a)}
          </a>
        `).join('');
        el.innerHTML = featuredHtml + `<div class="news-grid">${gridHtml}</div>`;
      } catch (err) { el.innerHTML = '<div class="feed-empty">Could not reach the server</div>'; }
    }

    async function loadWatchlistNews() {
      const el = document.getElementById('watchlistNews');
      try {
        const [newsRes, wlRes] = await Promise.all([AuthGuard.fetch('/api/news/watchlist'), AuthGuard.fetch('/api/watchlist')]);
        const newsData = await newsRes.json();
        const wlData = await wlRes.json();
        if (!newsRes.ok) { el.innerHTML = `<div class="feed-empty">${esc(newsData.error || 'Could not load watchlist news')}</div>`; return; }
        const news = newsData.news || {};
        const tickers = Object.keys(news);
        if (tickers.length === 0) { el.innerHTML = '<div class="feed-empty">Add stocks on your <a href="/watchlist.html">Watchlist</a> to see news about them here</div>'; return; }
        const nameFor = (ticker) => { const item = ((wlRes.ok && wlData.items) || []).find(i => i.ticker === ticker); return item && item.name ? item.name : ''; };
        el.innerHTML = tickers.map(ticker => {
          const articles = news[ticker] || [];
          const rows = articles.length
            ? articles.map(a => `
                <a class="ticker-article" href="${esc(a.url)}" target="_blank" rel="noopener">
                  ${metaHtml(a)}
                  <div class="ticker-article-headline">${esc(a.headline)}</div>
                  ${saveBtn(a)}
                </a>`).join('')
            : '<div class="ticker-no-news">No news in the past week</div>';
          return `<div class="ticker-group"><div class="ticker-group-head"><div class="ticker-group-symbol">${esc(ticker)}</div><div class="ticker-group-name">${esc(nameFor(ticker))}</div></div>${rows}</div>`;
        }).join('');
      } catch (err) { el.innerHTML = '<div class="feed-empty">Could not reach the server</div>'; }
    }

    async function loadSavedArticles() {
      const el = document.getElementById('savedArticles');
      try {
        const res = await AuthGuard.fetch('/api/saved-articles');
        const data = await res.json();
        const articles = data.articles || [];
        if (articles.length === 0) { el.innerHTML = '<div class="feed-empty">Bookmark articles with the 🔖 icon to find them here later</div>'; return; }
        el.innerHTML = articles.map(a => `
          <div class="saved-item">
            <a class="saved-item-link" href="${esc(a.url)}" target="_blank" rel="noopener">
              <div class="saved-item-body">
                ${a.source ? `<div class="news-meta"><span class="src">${esc(a.source)}</span><span class="dot">·</span><span class="when">${esc(timeAgo(a.datetime))}</span></div>` : ''}
                <div class="saved-item-headline">${esc(a.headline)}</div>
              </div>
            </a>
            <button class="btn-save saved" data-url="${esc(a.url)}" data-headline="${esc(a.headline)}" data-source="${esc(a.source || '')}" data-datetime="${a.datetime || ''}" onclick="toggleSave(event, this)" title="Unsave"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></button>
          </div>
        `).join('');
      } catch (err) { el.innerHTML = '<div class="feed-empty">Could not load saved articles</div>'; }
    }
  </script>
