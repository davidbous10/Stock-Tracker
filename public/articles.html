<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Articles — Trade Track</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0B1220;
      --surface: #131B2E;
      --surface-hover: #182240;
      --border: #232E47;
      --border-soft: #1B2438;
      --text: #EDF1F7;
      --text-muted: #7C8AA5;
      --text-faint: #4E5A75;
      --accent: #6C8EEF;
      --up: #3DDC97;
      --up-bg: #12271F;
      --down: #FF6B6B;
      --down-bg: #2B1A1E;

      --font-ui: 'Inter', system-ui, sans-serif;
      --font-data: 'IBM Plex Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      display: flex;
      justify-content: center;
      padding: 40px 24px;
    }

    .app {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      align-items: flex-start;
      gap: 32px;
    }

    /* ---------- sidebar (same as every other page) ---------- */
    .sidebar {
      width: 220px;
      flex-shrink: 0;
      position: sticky;
      top: 40px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }
    .sidebar-brand { display: flex; align-items: center; gap: 10px; }
    .sidebar-title { font-size: 16px; font-weight: 700; }

    .side-nav { display: flex; flex-direction: column; gap: 2px; }
    .side-nav-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 8px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }
    .side-nav-link svg { flex-shrink: 0; }
    .side-nav-link:hover { background: var(--surface-hover); color: var(--text); }
    .side-nav-link.active { background: var(--surface); color: var(--text); }

    .account-block {
      margin-top: auto;
      padding-top: 20px;
      border-top: 1px solid var(--border-soft);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .account-row { display: flex; align-items: center; }
    .account-avatar-wrap { position: relative; display: inline-flex; }
    .account-avatar {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-data);
      font-weight: 700;
      font-size: 13px;
      color: #0B1220;
      flex-shrink: 0;
      cursor: default;
    }
    .account-email {
      position: absolute;
      left: calc(100% + 10px);
      top: 50%;
      transform: translateY(-50%);
      background: var(--surface-hover);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 7px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
      z-index: 20;
    }
    .account-avatar-wrap:hover .account-email { opacity: 1; }
    .btn-logout-full {
      display: flex;
      align-items: center;
      gap: 8px;
      background: none;
      border: 1px solid var(--border);
      color: var(--text-faint);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      font-family: var(--font-ui);
      cursor: pointer;
    }
    .btn-logout-full:hover { border-color: var(--down); color: var(--down); }

    .main-content { flex: 1; min-width: 0; }

    @media (max-width: 800px) {
      .app { flex-direction: column; }
      .sidebar {
        width: 100%;
        position: static;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .side-nav { flex-direction: row; }
      .account-block {
        margin-top: 0;
        padding-top: 0;
        border-top: none;
        flex-direction: row;
      }
      .account-email { display: none; }
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    .brand-row > div:nth-child(2) { flex: 1; }
    .brand-mark { border-radius: 8px; flex-shrink: 0; }

    .eyebrow {
      font-family: var(--font-data);
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 6px;
    }
    h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }

    /* ---------- auth screen (same as every other page) ---------- */
    .auth-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card {
      width: 100%;
      max-width: 360px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 28px;
    }
    .auth-card .brand-row { margin-bottom: 24px; }
    .auth-tabs {
      display: flex;
      gap: 4px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 20px;
    }
    .auth-tab {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-muted);
      font-family: var(--font-ui);
      font-size: 13px;
      font-weight: 600;
      padding: 8px 0;
      border-radius: 7px;
      cursor: pointer;
    }
    .auth-tab.active { background: var(--surface-hover); color: var(--text); }
    #authForm { display: flex; flex-direction: column; gap: 10px; }
    #authForm input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px 14px;
      color: var(--text);
      font-size: 14px;
      font-family: var(--font-ui);
      outline: none;
    }
    #authForm input:focus { border-color: var(--accent); }
    .auth-hint { font-size: 11px; color: var(--text-faint); margin-top: -4px; }
    .auth-msg { font-size: 13px; color: var(--down); min-height: 16px; }
    .btn-auth-submit {
      background: var(--accent);
      color: #0B1220;
      border: none;
      border-radius: 8px;
      padding: 12px 0;
      font-size: 14px;
      font-weight: 700;
      font-family: var(--font-ui);
      cursor: pointer;
      margin-top: 6px;
    }
    .btn-auth-submit:hover { opacity: 0.9; }
    .btn-auth-submit:disabled { opacity: 0.6; cursor: default; }

    /* ---------- page header + section labels ---------- */
    .page-title { font-size: 20px; font-weight: 700; }
    .page-subtitle { font-size: 13px; color: var(--text-muted); margin-top: 3px; }

    .section-label {
      font-family: var(--font-data);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-faint);
      margin: 28px 0 12px;
    }

    /* ---------- market news: featured card ---------- */
    .featured-card {
      display: flex;
      gap: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      margin-bottom: 10px;
    }
    .featured-card:hover { background: var(--surface-hover); }
    .featured-img {
      width: 260px;
      flex-shrink: 0;
      object-fit: cover;
      background: var(--border-soft);
      display: block;
    }
    .featured-body { padding: 18px 20px; min-width: 0; display: flex; flex-direction: column; }
    .featured-headline {
      font-size: 17px;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 8px;
    }
    .featured-summary {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* ---------- market news: card grid ---------- */
    .news-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .news-card {
      display: flex;
      gap: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      text-decoration: none;
      color: inherit;
      min-width: 0;
    }
    .news-card:hover { background: var(--surface-hover); }
    .news-thumb {
      width: 74px;
      height: 74px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
      background: var(--border-soft);
      display: block;
    }
    .news-card-body { min-width: 0; }
    .news-headline {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .news-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-faint);
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .news-meta .src {
      color: var(--text-muted);
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .news-meta .dot { flex-shrink: 0; }
    .news-meta .when { flex-shrink: 0; font-family: var(--font-data); }

    /* ---------- watchlist news ---------- */
    .ticker-group {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 18px;
      margin-bottom: 10px;
    }
    .ticker-group-head {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 4px;
    }
    .ticker-group-symbol {
      font-family: var(--font-data);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .ticker-group-name {
      font-size: 12px;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    .ticker-article {
      display: block;
      padding: 10px 0;
      border-top: 1px solid var(--border-soft);
      text-decoration: none;
      color: inherit;
    }
    .ticker-group .ticker-article:first-of-type { border-top: none; margin-top: 6px; }
    .ticker-article:hover .ticker-article-headline { color: var(--accent); }
    .ticker-article-headline {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.4;
    }
    .ticker-article .news-meta { margin-bottom: 3px; }
    .ticker-no-news {
      font-size: 12px;
      color: var(--text-faint);
      padding: 8px 0 2px;
    }

    .feed-empty {
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 14px;
      padding: 24px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
    }
    .feed-empty a { color: var(--accent); }

    /* ---------- skeletons (same shimmer as other pages) ---------- */
    .skeleton {
      background: linear-gradient(90deg, var(--border-soft) 25%, var(--border) 37%, var(--border-soft) 63%);
      background-size: 400% 100%;
      animation: shimmer 1.6s ease infinite;
      border-radius: 4px;
    }
    @keyframes shimmer {
      0% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .skel-featured {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      height: 140px;
      margin-bottom: 10px;
      padding: 18px 20px;
    }
    .skel-news-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      height: 102px;
    }
    .skel-line { height: 12px; margin-bottom: 8px; }
    @media (prefers-reduced-motion: reduce) {
      .skeleton { animation: none; }
    }

    @media (max-width: 640px) {
      .news-grid { grid-template-columns: 1fr; }
      .featured-card { flex-direction: column; }
      .featured-img { width: 100%; height: 150px; }
    }
  </style>
</head>
<body>
  <div class="auth-screen" id="authScreen">
    <div class="auth-card">
      <div class="brand-row">
        <img src="/logo.svg" alt="" class="brand-mark" width="36" height="36" />
        <div>
          <div class="eyebrow">Personal terminal</div>
          <h1>Trade Track</h1>
        </div>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLogin">Log in</button>
        <button class="auth-tab" id="tabSignup">Sign up</button>
      </div>

      <form id="authForm">
        <input type="email" id="authEmail" placeholder="Email" autocomplete="email" required />
        <input type="password" id="authPassword" placeholder="Password" autocomplete="current-password" required />

        <div class="auth-msg" id="authMsg"></div>
        <button type="submit" class="btn-auth-submit" id="authSubmit">Log in</button>
      </form>
    </div>
  </div>

  <div class="app" id="appRoot" style="display:none;" data-display="flex">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img src="/logo.svg" alt="" class="brand-mark" width="32" height="32" />
        <div>
          <div class="eyebrow">Personal terminal</div>
          <div class="sidebar-title">Trade Track</div>
        </div>
      </div>

      <nav class="side-nav">
        <a href="/" class="side-nav-link">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Home
        </a>
        <a href="/watchlist.html" class="side-nav-link">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="19" x2="4" y2="10"/><line x1="10" y1="19" x2="10" y2="4"/><line x1="16" y1="19" x2="16" y2="14"/></svg>
          Watchlist
        </a>
        <a href="/articles.html" class="side-nav-link active">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          Articles
        </a>
        <a href="/settings.html" class="side-nav-link">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Settings
        </a>
      </nav>

      <div class="account-block">
        <div class="account-row">
          <div class="account-avatar-wrap">
            <div class="account-avatar" id="accountAvatar">?</div>
            <div class="account-email" id="accountEmail">Loading…</div>
          </div>
        </div>
        <button class="btn-logout-full" id="logoutBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>

          Log out
        </button>

    </aside>

    <div class="main-content">
      <div class="page-title">Articles</div>
      <div class="page-subtitle" id="pageDate"></div>

      <div class="section-label">Market news</div>
      <div id="marketNews">
        <div class="skel-featured">
          <div class="skeleton skel-line" style="width:30%"></div>
          <div class="skeleton skel-line" style="width:80%;height:16px"></div>
          <div class="skeleton skel-line" style="width:65%"></div>
        </div>
        <div class="news-grid">
          <div class="skel-news-card"><div class="skeleton skel-line" style="width:40%"></div><div class="skeleton skel-line" style="width:90%"></div><div class="skeleton skel-line" style="width:70%"></div></div>
          <div class="skel-news-card"><div class="skeleton skel-line" style="width:40%"></div><div class="skeleton skel-line" style="width:90%"></div><div class="skeleton skel-line" style="width:70%"></div></div>
          <div class="skel-news-card"><div class="skeleton skel-line" style="width:40%"></div><div class="skeleton skel-line" style="width:90%"></div><div class="skeleton skel-line" style="width:70%"></div></div>
          <div class="skel-news-card"><div class="skeleton skel-line" style="width:40%"></div><div class="skeleton skel-line" style="width:90%"></div><div class="skeleton skel-line" style="width:70%"></div></div>
        </div>
      </div>

      <div class="section-label">From your watchlist</div>
      <div id="watchlistNews">
        <div class="skel-featured" style="height:110px">
          <div class="skeleton skel-line" style="width:20%"></div>
          <div class="skeleton skel-line" style="width:85%"></div>
          <div class="skeleton skel-line" style="width:60%"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="/auth.js"></script>
  <script>
    AuthGuard.init(initArticlesPage);

    function esc(str) {
      const div = document.createElement('div');
      div.textContent = str == null ? '' : String(str);
      return div.innerHTML;
    }

    // Turns a unix timestamp (in seconds — Finnhub's format) into a
    // short human phrase like "2h ago". Falls back to a plain date
    // once it's more than a week old.
    function timeAgo(unixSeconds) {
      if (!unixSeconds) return '';
      const diffMs = Date.now() - unixSeconds * 1000;
      const mins = Math.floor(diffMs / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return `${mins}m ago`;
      const hours = Math.floor(mins / 60);
      if (hours < 24) return `${hours}h ago`;
      const days = Math.floor(hours / 24);
      if (days <= 7) return `${days}d ago`;
      return new Date(unixSeconds * 1000).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    // Image URLs come from dozens of different news sites, and some
    // of them are broken or blocked. onerror removes the <img> so a
    // dead link degrades to a clean text-only card instead of a
    // browser's broken-image icon.
    const IMG_FALLBACK = `onerror="this.remove()"`;

    function metaHtml(article) {
      return `
        <div class="news-meta">
          <span class="src">${esc(article.source)}</span>
          <span class="dot">·</span>
          <span class="when">${esc(timeAgo(article.datetime))}</span>
        </div>
      `;
    }

    function initArticlesPage() {
      document.getElementById('pageDate').textContent =
        new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });

      loadMarketNews();
      loadWatchlistNews();
    }

    async function loadMarketNews() {
      const el = document.getElementById('marketNews');
      try {
        const res = await AuthGuard.fetch('/api/news/market');
        const data = await res.json();

        if (!res.ok) {
          el.innerHTML = `<div class="feed-empty">${esc(data.error || 'Could not load market news')}</div>`;
          return;
        }

        const articles = data.articles || [];
        if (articles.length === 0) {
          el.innerHTML = '<div class="feed-empty">No market news available right now</div>';
          return;
        }

        // First article gets the big featured treatment; the rest
        // flow into a two-column grid of compact cards.
        const [featured, ...rest] = articles;

        const featuredHtml = `
          <a class="featured-card" href="${esc(featured.url)}" target="_blank" rel="noopener">
            ${featured.image ? `<img class="featured-img" src="${esc(featured.image)}" alt="" ${IMG_FALLBACK} />` : ''}
            <div class="featured-body">
              ${metaHtml(featured)}
              <div class="featured-headline">${esc(featured.headline)}</div>
              ${featured.summary ? `<div class="featured-summary">${esc(featured.summary)}</div>` : ''}
            </div>
          </a>
        `;

        const gridHtml = rest.map(a => `
          <a class="news-card" href="${esc(a.url)}" target="_blank" rel="noopener">
            ${a.image ? `<img class="news-thumb" src="${esc(a.image)}" alt="" ${IMG_FALLBACK} />` : ''}
            <div class="news-card-body">
              ${metaHtml(a)}
              <div class="news-headline">${esc(a.headline)}</div>
            </div>
          </a>
        `).join('');

        el.innerHTML = featuredHtml + `<div class="news-grid">${gridHtml}</div>`;
      } catch (err) {
        el.innerHTML = '<div class="feed-empty">Could not reach the server</div>';
      }
    }

    async function loadWatchlistNews() {
      const el = document.getElementById('watchlistNews');
      try {
        // The news comes back keyed by ticker; the watchlist call
        // runs alongside it purely to show each company's full name
        // next to its symbol (the news route doesn't return names).
        const [newsRes, wlRes] = await Promise.all([
          AuthGuard.fetch('/api/news/watchlist'),
          AuthGuard.fetch('/api/watchlist'),
        ]);
        const newsData = await newsRes.json();
        const wlData = await wlRes.json();

        if (!newsRes.ok) {
          el.innerHTML = `<div class="feed-empty">${esc(newsData.error || 'Could not load watchlist news')}</div>`;
          return;
        }

        const news = newsData.news || {};
        const tickers = Object.keys(news);

        if (tickers.length === 0) {
          el.innerHTML = '<div class="feed-empty">Add stocks on your <a href="/watchlist.html">Watchlist</a> to see news about them here</div>';
          return;
        }

        const nameFor = (ticker) => {
          const item = ((wlRes.ok && wlData.items) || []).find(i => i.ticker === ticker);
          return item && item.name ? item.name : '';
        };

        el.innerHTML = tickers.map(ticker => {
          const articles = news[ticker] || [];
          const rows = articles.length
            ? articles.map(a => `
                <a class="ticker-article" href="${esc(a.url)}" target="_blank" rel="noopener">
                  ${metaHtml(a)}
                  <div class="ticker-article-headline">${esc(a.headline)}</div>
                </a>
              `).join('')
            : '<div class="ticker-no-news">No news in the past week</div>';

          return `
            <div class="ticker-group">
              <div class="ticker-group-head">
                <div class="ticker-group-symbol">${esc(ticker)}</div>
                <div class="ticker-group-name">${esc(nameFor(ticker))}</div>
              </div>
              ${rows}
            </div>
          `;
        }).join('');
      } catch (err) {
        el.innerHTML = '<div class="feed-empty">Could not reach the server</div>';
      }
    }
  </script>
</body>
</html>
