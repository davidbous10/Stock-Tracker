<!DOCTYPE html>
<html lang="en" style="background:#F3EEDF">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin | Trade Track</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/logo-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Archivo:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* paper */
      --paper: #F3EEDF;
      --paper-raise: #FBF7EB;
      --paper-bright: #FFFDF4;
      --paper-sunken: #ECE5D0;
      /* ink */
      --ink: #23281F;
      --ink-muted: #686C5B;
      --ink-faint: #9A9C8B;
      /* rules (the printed lines of ledger paper) */
      --rule: #DDD5BE;
      --rule-strong: #C6BEA2;
      --margin-red: #C05A50;
      /* the bank */
      --green: #17442F;
      --green-deep: #0F3323;
      --green-bright: #1E5C3D;
      --brass: #A97F2F;
      --brass-soft: #C9A75C;
      /* money */
      --up: #1D6A43;
      --up-bg: #E3EBDA;
      --down: #8C2F2B;
      --down-bg: #F1E0D8;
      /* type */
      --font-display: 'Marcellus', 'Georgia', serif;
      --font-ui: 'Archivo', system-ui, sans-serif;
      --font-data: 'Courier Prime', 'Courier New', monospace;
      --shadow-paper: 0 1px 0 rgba(35,40,31,0.05), 0 8px 22px rgba(35,40,31,0.08);
      /* legacy aliases so any straggler rule still resolves */
      --text: var(--ink);
      --text-muted: var(--ink-muted);
      --text-faint: var(--ink-faint);
      --border: var(--rule-strong);
      --border-soft: var(--rule);
      --surface: var(--paper-raise);
      --surface-hover: var(--paper-bright);
      --accent: var(--brass);
      --bg: var(--paper);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-ui);
      display: flex;
      justify-content: center;
      padding: 40px 24px;
    }

    a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid var(--brass);
      outline-offset: 2px;
    }

    .app {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      align-items: flex-start;
      gap: 34px;
    }

    /* ---- Sidebar: the ledger's cover ---- */
    .sidebar {
      width: 232px;
      flex-shrink: 0;
      position: sticky;
      top: 40px;
      display: flex;
      flex-direction: column;
      gap: 26px;
      background: var(--green);
      border: 1px solid var(--green-deep);
      border-radius: 4px;
      padding: 22px 16px;
      box-shadow: var(--shadow-paper);
      color: #EFE9D4;
    }
    .sidebar-brand { display: flex; align-items: center; gap: 11px; }
    .sidebar-title {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 400;
      letter-spacing: 0.02em;
      color: #F3EEDF;
    }
    .sidebar .eyebrow { color: var(--brass-soft); }

    .side-nav { display: flex; flex-direction: column; gap: 2px; }
    .side-nav-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 3px;
      color: #B9C1AC;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.01em;
    }
    .side-nav-link svg { flex-shrink: 0; }
    .side-nav-link:hover { background: rgba(243,238,223,0.08); color: #F3EEDF; }
    .side-nav-link.active {
      background: rgba(15,51,35,0.85);
      color: #F3EEDF;
      box-shadow: inset 2px 0 0 var(--brass-soft);
    }

    .account-block {
      margin-top: auto;
      padding-top: 18px;
      border-top: 1px solid rgba(243,238,223,0.16);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .account-row { display: flex; align-items: center; }
    .account-avatar-wrap { position: relative; display: inline-flex; }
    .account-avatar {
      width: 32px;
      height: 32px;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-data);
      font-weight: 700;
      font-size: 13px;
      color: #F3EEDF;
      border: 1px solid rgba(243,238,223,0.25);
      flex-shrink: 0;
      cursor: default;
    }
    .account-email {
      position: absolute;
      left: calc(100% + 10px);
      top: 50%;
      transform: translateY(-50%);
      background: var(--green-deep);
      border: 1px solid rgba(201,167,92,0.5);
      color: #F3EEDF;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 3px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
      z-index: 20;
    }
    .account-avatar-wrap:hover .account-email { opacity: 1; }
    .btn-logout-full {
      display: flex;
      align-items: center;
      gap: 8px;
      background: none;
      border: 1px solid rgba(243,238,223,0.25);
      color: #B9C1AC;
      border-radius: 3px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      font-family: var(--font-ui);
      cursor: pointer;
    }
    .btn-logout-full:hover { border-color: #D99C92; color: #F1D8D2; }

    .main-content { flex: 1; min-width: 0; }

    @media (max-width: 800px) {
      .app { flex-direction: column; }
      .sidebar {
        width: 100%;
        position: static;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px;
      }
      .side-nav { flex-direction: row; }
      .account-block {
        margin-top: 0;
        padding-top: 0;
        border-top: none;
        flex-direction: row;
      }
      .account-email { display: none; }
    }

    /* ---- Shared identity bits ---- */
    .brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    .brand-row > div:nth-child(2) { flex: 1; }
    .brand-mark { border-radius: 4px; flex-shrink: 0; }

    .eyebrow {
      font-family: var(--font-ui);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--brass);
      margin-bottom: 5px;
    }
    h1 {
      font-family: var(--font-display);
      font-weight: 400;
      letter-spacing: 0.01em;
    }

    /* ---- Auth screen: the certificate ---- */
    .auth-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card {
      width: 100%;
      max-width: 380px;
      background: var(--paper-raise);
      border: 1px solid var(--rule-strong);
      border-radius: 3px;
      padding: 38px 34px;
      box-shadow: var(--shadow-paper);
      position: relative;
    }
    .auth-card::before {
      content: '';
      position: absolute;
      inset: 8px;
      border: 1px solid var(--brass-soft);
      border-radius: 2px;
      pointer-events: none;
      opacity: 0.75;
    }
    .auth-card .brand-row { margin-bottom: 26px; }
    .auth-card h1 { font-size: 27px; }

    .auth-tabs {
      display: flex;
      gap: 4px;
      background: var(--paper-sunken);
      border: 1px solid var(--rule);
      border-radius: 3px;
      padding: 4px;
      margin-bottom: 20px;
      position: relative;
    }
    .auth-tab {
      flex: 1;
      background: none;
      border: none;
      color: var(--ink-muted);
      font-family: var(--font-ui);
      font-size: 13px;
      font-weight: 600;
      padding: 8px 0;
      border-radius: 2px;
      cursor: pointer;
    }
    .auth-tab.active { background: var(--green); color: #F3EEDF; }

    #authForm { display: flex; flex-direction: column; gap: 10px; position: relative; }
    #authForm input {
      width: 100%;
      background: var(--paper-bright);
      border: 1px solid var(--rule-strong);
      border-radius: 2px;
      padding: 11px 14px;
      color: var(--ink);
      font-size: 14px;
      font-family: var(--font-ui);
      outline: none;
    }
    #authForm input:focus { border-color: var(--green); }
    .auth-hint { font-size: 11px; color: var(--ink-faint); margin-top: -4px; }
    .auth-msg { font-size: 13px; color: var(--down); min-height: 16px; }
    .btn-auth-submit {
      background: var(--green);
      color: #F3EEDF;
      border: none;
      border-radius: 2px;
      padding: 12px 0;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-family: var(--font-ui);
      cursor: pointer;
      margin-top: 6px;
    }
    .btn-auth-submit:hover { background: var(--green-bright); }
    .btn-auth-submit:disabled { opacity: 0.6; cursor: default; }

    /* ---- Section headings: ledger column heads ---- */
    .section-label {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: var(--font-ui);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin: 30px 0 12px;
    }
    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--rule-strong);
    }
    .section-label:first-of-type { margin-top: 0; }

    /* ---- Skeleton loading on paper ---- */
    .skeleton {
      background: linear-gradient(90deg, #E9E1CB 25%, #DFD6BD 37%, #E9E1CB 63%);
      background-size: 400% 100%;
      animation: shimmer 1.6s ease infinite;
      border-radius: 2px;
    }
    @keyframes shimmer {
      0% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .skeleton { animation: none; }
    }

    /* ---- Articles ---- */
    .page-title { font-family: var(--font-display); font-size: 24px; }
    .page-subtitle {
      font-family: var(--font-data);
      font-size: 13px;
      color: var(--ink-muted);
      margin-top: 4px;
    }

    .featured-card {
      display: flex;
      gap: 0;
      background: var(--paper-raise) linear-gradient(var(--margin-red), var(--margin-red)) no-repeat 15px 0 / 1px 100%;
      border: 1px solid var(--rule-strong);
      border-radius: 3px;
      box-shadow: var(--shadow-paper);
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      margin-bottom: 12px;
    }
    .featured-card:hover { border-color: var(--brass-soft); }
    .featured-img {
      width: 260px;
      flex-shrink: 0;
      object-fit: cover;
      background: var(--paper-sunken);
      border-right: 1px solid var(--rule);
      display: block;
      filter: sepia(0.14) saturate(0.92);
    }
    .featured-body { padding: 18px 20px 18px 24px; min-width: 0; display: flex; flex-direction: column; }
    .featured-headline {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 400;
      line-height: 1.3;
      margin-bottom: 8px;
    }
    .featured-summary {
      font-size: 13px;
      color: var(--ink-muted);
      line-height: 1.55;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .news-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .news-card {
      display: flex;
      gap: 14px;
      background: var(--paper-raise) linear-gradient(var(--margin-red), var(--margin-red)) no-repeat 15px 0 / 1px 100%;
      border: 1px solid var(--rule-strong);
      border-radius: 3px;
      box-shadow: var(--shadow-paper);
      padding: 14px 14px 14px 24px;
      text-decoration: none;
      color: inherit;
      min-width: 0;
    }
    .news-card:hover { border-color: var(--brass-soft); }
    .news-thumb {
      width: 74px;
      height: 74px;
      border-radius: 2px;
      border: 1px solid var(--rule);
      object-fit: cover;
      flex-shrink: 0;
      background: var(--paper-sunken);
      display: block;
      filter: sepia(0.14) saturate(0.92);
    }
    .news-card-body { min-width: 0; }
    .news-headline {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .news-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      color: var(--ink-faint);
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .news-meta .src {
      color: var(--brass);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .news-meta .dot { flex-shrink: 0; }
    .news-meta .when { flex-shrink: 0; font-family: var(--font-data); font-size: 11px; }

    .ticker-group {
      background: var(--paper-raise) linear-gradient(var(--margin-red), var(--margin-red)) no-repeat 15px 0 / 1px 100%;
      border: 1px solid var(--rule-strong);
      border-radius: 3px;
      box-shadow: var(--shadow-paper);
      padding: 16px 18px 16px 26px;
      margin-bottom: 12px;
    }
    .ticker-group-head {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 4px;
    }
    .ticker-group-symbol {
      font-family: var(--font-data);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .ticker-group-name {
      font-size: 12px;
      color: var(--ink-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    .ticker-article {
      display: block;
      padding: 10px 0;
      border-top: 1px solid var(--rule);
      text-decoration: none;
      color: inherit;
    }
    .ticker-group .ticker-article:first-of-type { border-top: none; margin-top: 6px; }
    .ticker-article:hover .ticker-article-headline { color: var(--green-bright); }
    .ticker-article-headline {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.45;
    }
    .ticker-article .news-meta { margin-bottom: 3px; }
    .ticker-no-news {
      font-size: 12px;
      color: var(--ink-faint);
      font-style: italic;
      padding: 8px 0 2px;
    }

    .feed-empty {
      background: transparent;
      border: 1px dashed var(--rule-strong);
      border-radius: 3px;
      padding: 24px;
      text-align: center;
      color: var(--ink-muted);
      font-size: 14px;
    }
    .feed-empty a { color: var(--green); font-weight: 600; }

    .btn-save {
      background: none; border: none; color: var(--ink-faint);
      cursor: pointer; padding: 4px; flex-shrink: 0; border-radius: 2px;
    }
    .btn-save:hover { color: var(--brass); }
    .btn-save.saved { color: var(--brass); }

    .featured-card { position: relative; }
    .featured-card .btn-save { position: absolute; top: 10px; right: 10px; }
    .news-card { position: relative; }
    .news-card .btn-save { position: absolute; top: 8px; right: 8px; }
    .ticker-article { position: relative; }
    .ticker-article .btn-save { position: absolute; top: 10px; right: 0; }

    .saved-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 0; border-bottom: 1px solid var(--rule);
    }
    .saved-item:last-child { border-bottom: none; }
    .saved-item-body { flex: 1; min-width: 0; }
    .saved-item-link { text-decoration: none; color: inherit; }
    .saved-item-link:hover .saved-item-headline { color: var(--green-bright); }
    .saved-item-headline { font-size: 13px; font-weight: 600; line-height: 1.4; }

    .refresh-btn {
      background: none; border: 1px solid var(--rule-strong);
      color: var(--ink-muted); border-radius: 2px;
      padding: 8px 14px; font-size: 12px;
      font-family: var(--font-ui); font-weight: 600; cursor: pointer;
    }
    .refresh-btn:hover { border-color: var(--green); color: var(--ink); }

    .skel-featured {
      background: var(--paper-raise);
      border: 1px solid var(--rule);
      border-radius: 3px;
      height: 140px;
      margin-bottom: 12px;
      padding: 18px 20px;
    }
    .skel-news-card {
      background: var(--paper-raise);
      border: 1px solid var(--rule);
      border-radius: 3px;
      padding: 14px;
      height: 102px;
    }
    .skel-line { height: 12px; margin-bottom: 8px; }

    @media (max-width: 640px) {
      .news-grid { grid-template-columns: 1fr; }
      .featured-card { flex-direction: column; }
      .featured-img { width: 100%; height: 150px; border-right: none; border-bottom: 1px solid var(--rule); }
    }

    /* ---- Mobile bottom tab bar ---- */
    .bottom-tabs {
      display: none;
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--green); border-top: 1px solid var(--green-deep);
      z-index: 100; padding: 6px 0 env(safe-area-inset-bottom, 6px);
    }
    .bottom-tabs nav {
      display: flex; justify-content: space-around; align-items: center;
    }
    .tab-link {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      text-decoration: none; color: #B9C1AC; font-size: 10px; font-weight: 600;
      padding: 4px 8px; letter-spacing: 0.02em;
    }
    .tab-link:hover, .tab-link.active { color: #F3EEDF; }
    .tab-link.active svg { stroke: var(--brass-soft); }

    @media (max-width: 800px) {
      .sidebar { display: none !important; }
      .bottom-tabs { display: block; }
      .app { padding-bottom: 72px; }
      body { padding: 20px 16px 0; }
    }

  

    /* Admin page */
    .admin-title { font-family: var(--font-display); font-size: 24px; }
    .admin-sub { font-size: 13px; color: var(--ink-muted); margin-top: 4px; }
    .stat-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 24px; }
    .stat-box {
      background: var(--paper-raise) linear-gradient(var(--margin-red), var(--margin-red)) no-repeat 15px 0 / 1px 100%;
      border: 1px solid var(--rule-strong); border-radius: 3px; box-shadow: var(--shadow-paper);
      padding: 14px 16px 14px 26px;
    }
    .stat-box-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-faint); margin-bottom: 4px; }
    .stat-box-value { font-family: var(--font-data); font-size: 24px; font-weight: 700; }
    .admin-section { margin-bottom: 28px; }
    .admin-section-title {
      display: flex; align-items: center; gap: 12px;
      font-family: var(--font-ui); font-size: 11px; font-weight: 700;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 12px;
    }
    .admin-section-title::after { content: ''; flex: 1; height: 1px; background: var(--rule-strong); }
    .admin-table {
      width: 100%; background: var(--paper-raise); border: 1px solid var(--rule-strong);
      border-radius: 3px; box-shadow: var(--shadow-paper); border-collapse: collapse; font-size: 13px;
    }
    .admin-table th {
      text-align: left; padding: 10px 14px; font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-faint);
      border-bottom: 2px solid var(--rule-strong); background: var(--paper-sunken);
    }
    .admin-table td { padding: 10px 14px; border-bottom: 1px solid var(--rule); vertical-align: top; }
    .admin-table tr:last-child td { border-bottom: none; }
    .admin-table tr:hover td { background: var(--paper-bright); }
    .admin-table .mono { font-family: var(--font-data); font-size: 12px; }
    .admin-table .faint { color: var(--ink-faint); font-size: 11px; }
    .action-badge {
      display: inline-block; padding: 2px 8px; border-radius: 2px;
      font-family: var(--font-data); font-size: 10px; font-weight: 700;
      letter-spacing: 0.04em; text-transform: uppercase;
    }
    .action-badge.login { background: var(--up-bg); color: var(--up); }
    .action-badge.signup { background: #E0D6F0; color: #5B3E90; }
    .action-badge.chat { background: #D6E8F0; color: #2E5A6E; }
    .action-badge.add_stock { background: var(--up-bg); color: var(--up); }
    .action-badge.remove_stock { background: var(--down-bg); color: var(--down); }
    .action-badge.save_article { background: #F0E8D6; color: var(--brass); }
    .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .bar-label { font-size: 12px; width: 100px; text-align: right; color: var(--ink-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar-track { flex: 1; height: 20px; background: var(--paper-sunken); border-radius: 2px; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--green); border-radius: 2px; min-width: 2px; }
    .bar-value { font-family: var(--font-data); font-size: 12px; width: 60px; color: var(--ink-muted); }
    .log-filters { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
    .log-filter {
      background: var(--paper-bright); border: 1px solid var(--rule-strong);
      border-radius: 2px; padding: 5px 10px; font-size: 11px;
      font-family: var(--font-ui); color: var(--ink); cursor: pointer;
    }
    .log-filter:hover { border-color: var(--green); }
    .log-filter.active { background: var(--green); color: #F3EEDF; border-color: var(--green); }
    .log-more {
      background: none; border: 1px solid var(--rule-strong); border-radius: 2px;
      padding: 8px 20px; font-size: 12px; font-weight: 600;
      font-family: var(--font-ui); color: var(--ink-muted); cursor: pointer;
      display: block; width: 100%; margin-top: 10px;
    }
    .log-more:hover { border-color: var(--green); color: var(--ink); }
    .admin-empty { font-size: 13px; color: var(--ink-faint); font-style: italic; padding: 16px 0; }
    @media (max-width: 640px) { .stat-strip { grid-template-columns: 1fr 1fr; } }

  </style>
</head>
<body>
  <div class="auth-screen" id="authScreen" style="display:none">
    <div class="auth-card">
      <div class="brand-row">
        <img src="/logo.svg" alt="" class="brand-mark" width="36" height="36" />
        <div>
          <div class="eyebrow">Private ledger</div>
          <h1>Trade Track</h1>
        </div>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLogin">Log in</button>
        <button class="auth-tab" id="tabSignup">Sign up</button>
      </div>

      <form id="authForm">
        <input type="text" id="authName" placeholder="First name" autocomplete="given-name" style="display:none" />
        <input type="email" id="authEmail" placeholder="Email" autocomplete="email" required />
        <input type="password" id="authPassword" placeholder="Password" autocomplete="current-password" required />
        <div class="auth-hint" id="authHint"></div>
        <div class="auth-msg" id="authMsg"></div>
        <button type="submit" class="btn-auth-submit" id="authSubmit">Log in</button>
      </form>
    </div>
  </div>

  <div class="app" id="appRoot" style="display:none;" data-display="flex">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img src="/logo.svg" alt="" class="brand-mark" width="32" height="32" />
        <div>
          <div class="eyebrow">Private ledger</div>
          <div class="sidebar-title">Trade Track</div>
        </div>
      </div>

      <nav class="side-nav">
        <a href="/" class="side-nav-link">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Home
        </a>
        <a href="/watchlist.html" class="side-nav-link">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="19" x2="4" y2="10"/><line x1="10" y1="19" x2="10" y2="4"/><line x1="16" y1="19" x2="16" y2="14"/></svg>
          Watchlist
        </a>
        <a href="/articles.html" class="side-nav-link">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          Articles
        </a>
        <a href="/sectors.html" class="side-nav-link">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          Sectors
        </a>
        <a href="/portfolio.html" class="side-nav-link">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          Portfolio
        </a>
        <a href="/settings.html" class="side-nav-link">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Settings
        </a>
      </nav>

      <div class="account-block">
        <div class="account-row">
          <div class="account-avatar-wrap">
            <div class="account-avatar" id="accountAvatar">?</div>
            <div class="account-email" id="accountEmail">Loading…</div>
          </div>
        </div>
        <button class="btn-logout-full" id="logoutBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Log out
        </button>
      </div>
    </aside>

    <div class="main-content">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
        <div>
          <div class="admin-title">Admin Dashboard</div>
          <div class="admin-sub">Usage reports and activity logs</div>
        </div>
        <button class="refresh-btn" onclick="loadAll()">Refresh</button>
      </div>

      <div class="stat-strip" id="statStrip">
        <div class="stat-box"><div class="stat-box-label">Users</div><div class="stat-box-value" id="statUsers">-</div></div>
        <div class="stat-box"><div class="stat-box-label">Stocks tracked</div><div class="stat-box-value" id="statTickers">-</div></div>
        <div class="stat-box"><div class="stat-box-label">Alerts set</div><div class="stat-box-value" id="statAlerts">-</div></div>
        <div class="stat-box"><div class="stat-box-label">Saved articles</div><div class="stat-box-value" id="statSaved">-</div></div>
      </div>

      <div class="admin-section">
        <div class="admin-section-title">Usage (last 7 days)</div>
        <div id="usageBars"></div>
      </div>

      <div class="admin-section">
        <div class="admin-section-title">Popular stocks</div>
        <div id="popularStocks"></div>
      </div>

      <div class="admin-section">
        <div class="admin-section-title">Users</div>
        <div id="usersTable"></div>
      </div>

      <div class="admin-section">
        <div class="admin-section-title">Activity log</div>
        <div class="log-filters" id="logFilters">
          <button class="log-filter active" data-action="">All</button>
          <button class="log-filter" data-action="login">Login</button>
          <button class="log-filter" data-action="signup">Signup</button>
          <button class="log-filter" data-action="chat">Chat</button>
          <button class="log-filter" data-action="add_stock">Add stock</button>
          <button class="log-filter" data-action="remove_stock">Remove</button>
          <button class="log-filter" data-action="save_article">Save</button>
        </div>
        <div id="logTable"></div>
      </div>
    </div>

  <script src="/auth.js"></script>
  <script src="/chat.js"></script>
  <script>
    AuthGuard.init(function () { loadAll(); });

    function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
    function fmtDate(d) { return new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); }
    function fmtTime(d) { return new Date(d).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); }

    var currentFilter = '';
    var logOffset = 0;

    function loadAll() { loadStats(); loadUsage(); logOffset = 0; loadLogs(true); }

    async function loadStats() {
      try {
        var res = await AuthGuard.fetch('/api/admin/stats');
        if (res.status === 403) {
          document.querySelector('.main-content').innerHTML = '<div class="admin-empty" style="text-align:center;padding:60px 20px;font-size:16px">Admin access only.</div>';
          return;
        }
        var data = await res.json();
        document.getElementById('statUsers').textContent = data.totalUsers;
        document.getElementById('statTickers').textContent = data.totalTickers;
        document.getElementById('statAlerts').textContent = data.totalAlerts;
        document.getElementById('statSaved').textContent = data.totalSavedArticles;

        var html = '<table class="admin-table"><tr><th>User</th><th>Email</th><th>Stocks</th><th>Joined</th></tr>';
        var wl = data.userWatchlists || [];
        var users = data.users || [];
        wl.forEach(function(u) {
          var joined = users.find(function(x) { return x.id === u.id; });
          html += '<tr><td>' + esc(u.name || '-') + '</td><td class="mono">' + esc(u.email) + '</td><td class="mono">' + u.stockCount + '</td><td class="faint">' + (joined ? fmtDate(joined.joinedAt) : '-') + '</td></tr>';
        });
        html += '</table>';
        document.getElementById('usersTable').innerHTML = html;
      } catch (err) {}
    }

    async function loadUsage() {
      try {
        var res = await AuthGuard.fetch('/api/admin/usage');
        var data = await res.json();

        var actions = data.actionCounts || [];
        var maxCount = actions.length > 0 ? actions[0].count : 1;
        var barsHtml = actions.map(function(a) {
          var pct = (a.count / maxCount) * 100;
          return '<div class="bar-row"><div class="bar-label">' + esc(a.action) + '</div><div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div><div class="bar-value">' + a.count + '</div></div>';
        }).join('');
        document.getElementById('usageBars').innerHTML = barsHtml || '<div class="admin-empty">No activity recorded yet</div>';

        var stocks = data.popularStocks || [];
        var maxStock = stocks.length > 0 ? stocks[0].userCount : 1;
        var stockHtml = stocks.map(function(s) {
          var pct = (s.userCount / maxStock) * 100;
          return '<div class="bar-row"><div class="bar-label" style="font-family:var(--font-data);font-weight:700">' + esc(s.ticker) + '</div><div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;background:var(--brass)"></div></div><div class="bar-value">' + s.userCount + '</div></div>';
        }).join('');
        document.getElementById('popularStocks').innerHTML = stockHtml || '<div class="admin-empty">No stocks tracked yet</div>';
      } catch (err) {}
    }

    async function loadLogs(reset) {
      if (reset) logOffset = 0;
      try {
        var url = '/api/admin/logs?limit=30&offset=' + logOffset;
        if (currentFilter) url += '&action=' + encodeURIComponent(currentFilter);
        var res = await AuthGuard.fetch(url);
        var data = await res.json();
        var logs = data.logs || [];

        var html = '<table class="admin-table"><tr><th>Time</th><th>User</th><th>Action</th><th>Detail</th></tr>';
        logs.forEach(function(l) {
          var badge = '<span class="action-badge ' + esc(l.action) + '">' + esc(l.action) + '</span>';
          html += '<tr><td class="faint" style="white-space:nowrap">' + fmtTime(l.time) + '</td><td class="mono" style="font-size:11px">' + esc(l.email || 'unknown') + '</td><td>' + badge + '</td><td class="faint" style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(l.detail || '') + '</td></tr>';
        });
        html += '</table>';

        if (reset) {
          document.getElementById('logTable').innerHTML = html;
        } else {
          var existing = document.querySelector('#logTable .admin-table');
          var temp = document.createElement('div');
          temp.innerHTML = html;
          var newRows = temp.querySelectorAll('tr');
          for (var i = 1; i < newRows.length; i++) existing.appendChild(newRows[i]);
        }

        var moreBtn = document.getElementById('logMore');
        if (moreBtn) moreBtn.remove();
        if (logs.length >= 30) {
          var btn = document.createElement('button');
          btn.className = 'log-more'; btn.id = 'logMore';
          btn.textContent = 'Load more';
          btn.onclick = function() { logOffset += 30; loadLogs(false); };
          document.getElementById('logTable').appendChild(btn);
        }
      } catch (err) {}
    }

    document.getElementById('logFilters').addEventListener('click', function(e) {
      var btn = e.target.closest('.log-filter');
      if (!btn) return;
      document.querySelectorAll('.log-filter').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      currentFilter = btn.dataset.action;
      loadLogs(true);
    });
  </script>
</body>
