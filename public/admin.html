<!DOCTYPE html>
<html lang="en" style="background:#0C111B">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Portal | Trade Track</title>
  <meta name="theme-color" content="#0C111B" />
  <link rel="icon" href="/logo-192.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; background: #0C111B; color: #C8D0E0; font-family: 'Archivo', system-ui, sans-serif; }

    .admin-login { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .admin-login-card { width: 100%; max-width: 360px; background: #141B2D; border: 1px solid #2A3A5C; border-radius: 8px; padding: 36px; }
    .admin-login-card h1 { font-size: 22px; margin-bottom: 6px; color: #F3EEDF; }
    .admin-login-card p { font-size: 13px; color: #7A8599; margin-bottom: 20px; }
    .admin-login-card input { width: 100%; padding: 12px 14px; background: #0C111B; border: 1px solid #2A3A5C; border-radius: 4px; color: #C8D0E0; font-size: 14px; font-family: 'Archivo', sans-serif; outline: none; margin-bottom: 12px; }
    .admin-login-card input:focus { border-color: #5B9BD5; box-shadow: 0 0 0 3px rgba(91,155,213,0.15); }
    .admin-login-card button { width: 100%; padding: 12px; background: #1A3A6B; color: #C8D0E0; border: none; border-radius: 4px; font-size: 13px; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 0.06em; }
    .admin-login-card button:hover { background: #2A5AAB; }
    .admin-login-card .msg { font-size: 12px; color: #FF6B6B; min-height: 16px; margin-bottom: 8px; }

    .admin-dash { display: none; padding: 24px; max-width: 1100px; margin: 0 auto; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .admin-header h1 { font-size: 24px; color: #F3EEDF; }
    .admin-logout { background: none; border: 1px solid #2A3A5C; color: #7A8599; padding: 8px 16px; border-radius: 4px; font-size: 12px; cursor: pointer; font-family: 'Archivo', sans-serif; }
    .admin-logout:hover { border-color: #FF6B6B; color: #FF6B6B; }

    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .stat-card { background: #141B2D; border: 1px solid #2A3A5C; border-radius: 6px; padding: 18px; backdrop-filter: blur(12px); }
    .stat-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: #7A8599; margin-bottom: 6px; }
    .stat-value { font-family: 'Courier Prime', monospace; font-size: 28px; font-weight: 700; color: #F3EEDF; }
    .stat-sub { font-size: 11px; color: #5B9BD5; margin-top: 4px; }

    .section-title { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: #7A8599; margin-bottom: 12px; margin-top: 24px; }

    .data-table { width: 100%; background: #141B2D; border: 1px solid #2A3A5C; border-radius: 6px; border-collapse: collapse; font-size: 12px; }
    .data-table th { text-align: left; padding: 10px 14px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: #7A8599; border-bottom: 1px solid #2A3A5C; background: #0C111B; }
    .data-table td { padding: 10px 14px; border-bottom: 1px solid #1E2A42; color: #C8D0E0; }
    .data-table tr:last-child td { border-bottom: none; }
    .data-table .mono { font-family: 'Courier Prime', monospace; }
    .data-table .faint { color: #7A8599; }

    .log-entry { background: #141B2D; border: 1px solid #2A3A5C; border-radius: 4px; padding: 10px 14px; margin-bottom: 6px; font-size: 12px; display: flex; gap: 12px; }
    .log-time { color: #7A8599; font-family: 'Courier Prime', monospace; font-size: 11px; white-space: nowrap; }
    .log-action { color: #5B9BD5; font-weight: 600; min-width: 80px; }
    .log-detail { color: #C8D0E0; flex: 1; }

    @media (max-width: 640px) { .stat-grid { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <div class="admin-login" id="adminLogin">
    <div class="admin-login-card">
      <h1>Admin Portal</h1>
      <p>Trade Track administrative dashboard</p>
      <div class="msg" id="adminMsg"></div>
      <input type="password" id="adminPw" placeholder="Admin password" />
      <button onclick="adminLogin()">Access Dashboard</button>
    </div>
  </div>

  <div class="admin-dash" id="adminDash">
    <div class="admin-header">
      <h1>Trade Track Admin</h1>
      <button class="admin-logout" onclick="adminLogout()">Log out</button>
    </div>

    <div class="stat-grid" id="statGrid"></div>

    <div class="section-title">Users</div>
    <div id="usersTable"></div>

    <div class="section-title">Popular stocks</div>
    <div id="stocksTable"></div>

    <div class="section-title">Recent activity</div>
    <div id="activityLog"></div>
  </div>

  <script>
    async function adminLogin() {
      var pw = document.getElementById('adminPw').value;
      var msg = document.getElementById('adminMsg');
      try {
        var res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pw }),
        });
        var data = await res.json();
        if (res.ok) {
          document.getElementById('adminLogin').style.display = 'none';
          document.getElementById('adminDash').style.display = 'block';
          loadAdminData();
        } else {
          msg.textContent = data.error || 'Invalid password';
        }
      } catch (err) { msg.textContent = 'Could not reach server'; }
    }

    async function adminLogout() {
      await fetch('/api/admin/logout', { method: 'POST' });
      document.getElementById('adminDash').style.display = 'none';
      document.getElementById('adminLogin').style.display = 'flex';
      document.getElementById('adminPw').value = '';
    }

    document.getElementById('adminPw').addEventListener('keydown', function(e) { if (e.key === 'Enter') adminLogin(); });

    async function loadAdminData() {
      try {
        var [statsRes, usersRes, stocksRes, logRes] = await Promise.all([
          fetch('/api/admin/stats'),
          fetch('/api/admin/users'),
          fetch('/api/admin/popular-stocks'),
          fetch('/api/admin/activity?limit=30'),
        ]);
        var stats = await statsRes.json();
        var users = await usersRes.json();
        var stocks = await stocksRes.json();
        var log = await logRes.json();

        // Stats
        var grid = document.getElementById('statGrid');
        grid.innerHTML = [
          { label: 'Total users', value: stats.users || 0, sub: 'registered accounts' },
          { label: 'Unique tickers', value: stats.tickers || 0, sub: 'being tracked' },
          { label: 'Active alerts', value: stats.alerts || 0, sub: 'monitoring prices' },
          { label: 'Saved articles', value: stats.savedArticles || 0, sub: 'bookmarked' },
        ].map(function(s) {
          return '<div class="stat-card"><div class="stat-label">' + s.label + '</div><div class="stat-value">' + s.value + '</div><div class="stat-sub">' + s.sub + '</div></div>';
        }).join('');

        // Users table
        var uTable = document.getElementById('usersTable');
        var uRows = (users.users || []).map(function(u) {
          return '<tr><td class="mono">' + u.id + '</td><td>' + esc(u.email) + '</td><td>' + esc(u.name || '') + '</td><td class="faint">' + fmtDate(u.created_at) + '</td></tr>';
        }).join('');
        uTable.innerHTML = '<table class="data-table"><tr><th>ID</th><th>Email</th><th>Name</th><th>Joined</th></tr>' + uRows + '</table>';

        // Popular stocks
        var sTable = document.getElementById('stocksTable');
        var sRows = (stocks.stocks || []).map(function(s) {
          return '<tr><td class="mono">' + esc(s.ticker) + '</td><td>' + s.count + ' users</td></tr>';
        }).join('');
        sTable.innerHTML = '<table class="data-table"><tr><th>Ticker</th><th>Watchers</th></tr>' + sRows + '</table>';

        // Activity log
        var logEl = document.getElementById('activityLog');
        logEl.innerHTML = (log.entries || []).map(function(e) {
          return '<div class="log-entry"><span class="log-time">' + fmtDate(e.created_at) + '</span><span class="log-action">' + esc(e.action) + '</span><span class="log-detail">' + esc(e.detail || '') + '</span></div>';
        }).join('');

      } catch (err) {
        document.getElementById('statGrid').innerHTML = '<div style="color:#FF6B6B">Failed to load admin data</div>';
      }
    }

    function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
    function fmtDate(d) { return new Date(d).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); }

    // Auto-refresh every 30 seconds
    setInterval(function() {
      if (document.getElementById('adminDash').style.display !== 'none') loadAdminData();
    }, 30000);
  </script>
</body>
</html>
