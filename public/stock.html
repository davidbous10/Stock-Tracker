<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trade Track</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Archivo:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #F3EEDF;
      --paper-raise: #FBF7EB;
      --paper-bright: #FFFDF4;
      --paper-sunken: #ECE5D0;
      --ink: #23281F;
      --ink-muted: #686C5B;
      --ink-faint: #9A9C8B;
      --rule: #DDD5BE;
      --rule-strong: #C6BEA2;
      --margin-red: #C05A50;
      --green: #17442F;
      --green-deep: #0F3323;
      --green-bright: #1E5C3D;
      --brass: #A97F2F;
      --brass-soft: #C9A75C;
      --up: #1D6A43;
      --up-bg: #E3EBDA;
      --down: #8C2F2B;
      --down-bg: #F1E0D8;
      --font-display: 'Marcellus', 'Georgia', serif;
      --font-ui: 'Archivo', system-ui, sans-serif;
      --font-data: 'Courier Prime', 'Courier New', monospace;
      --shadow-paper: 0 1px 0 rgba(35,40,31,0.05), 0 8px 22px rgba(35,40,31,0.08);
      --text: var(--ink); --text-muted: var(--ink-muted); --text-faint: var(--ink-faint);
      --border: var(--rule-strong); --border-soft: var(--rule);
      --surface: var(--paper-raise); --surface-hover: var(--paper-bright);
      --accent: var(--brass); --bg: var(--paper);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-ui);
      display: flex;
      justify-content: center;
      padding: 40px 24px;
    }
    a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid var(--brass); outline-offset: 2px;
    }
    .app { width: 100%; max-width: 1080px; margin: 0 auto; display: flex; align-items: flex-start; gap: 34px; }

    /* ---- Sidebar ---- */
    .sidebar {
      width: 232px; flex-shrink: 0; position: sticky; top: 40px;
      display: flex; flex-direction: column; gap: 26px;
      background: var(--green); border: 1px solid var(--green-deep);
      border-radius: 4px; padding: 22px 16px;
      box-shadow: var(--shadow-paper); color: #EFE9D4;
    }
    .sidebar-brand { display: flex; align-items: center; gap: 11px; }
    .sidebar-title { font-family: var(--font-display); font-size: 18px; font-weight: 400; letter-spacing: 0.02em; color: #F3EEDF; }
    .sidebar .eyebrow { color: var(--brass-soft); }
    .side-nav { display: flex; flex-direction: column; gap: 2px; }
    .side-nav-link { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 3px; color: #B9C1AC; text-decoration: none; font-size: 13px; font-weight: 500; letter-spacing: 0.01em; }
    .side-nav-link svg { flex-shrink: 0; }
    .side-nav-link:hover { background: rgba(243,238,223,0.08); color: #F3EEDF; }
    .side-nav-link.active { background: rgba(15,51,35,0.85); color: #F3EEDF; box-shadow: inset 2px 0 0 var(--brass-soft); }
    .account-block { margin-top: auto; padding-top: 18px; border-top: 1px solid rgba(243,238,223,0.16); display: flex; flex-direction: column; gap: 10px; }
    .account-row { display: flex; align-items: center; }
    .account-avatar-wrap { position: relative; display: inline-flex; }
    .account-avatar { width: 32px; height: 32px; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-family: var(--font-data); font-weight: 700; font-size: 13px; color: #F3EEDF; border: 1px solid rgba(243,238,223,0.25); flex-shrink: 0; cursor: default; }
    .account-email { position: absolute; left: calc(100% + 10px); top: 50%; transform: translateY(-50%); background: var(--green-deep); border: 1px solid rgba(201,167,92,0.5); color: #F3EEDF; font-size: 12px; padding: 6px 10px; border-radius: 3px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 0.12s ease; z-index: 20; }
    .account-avatar-wrap:hover .account-email { opacity: 1; }
    .btn-logout-full { display: flex; align-items: center; gap: 8px; background: none; border: 1px solid rgba(243,238,223,0.25); color: #B9C1AC; border-radius: 3px; padding: 8px 12px; font-size: 12px; font-weight: 600; font-family: var(--font-ui); cursor: pointer; }
    .btn-logout-full:hover { border-color: #D99C92; color: #F1D8D2; }
    .main-content { flex: 1; min-width: 0; }
    @media (max-width: 800px) {
      .app { flex-direction: column; }
      .sidebar { width: 100%; position: static; flex-direction: row; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; }
      .side-nav { flex-direction: row; }
      .account-block { margin-top: 0; padding-top: 0; border-top: none; flex-direction: row; }
      .account-email { display: none; }
    }
    .brand-row { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
    .brand-row > div:nth-child(2) { flex: 1; }
    .brand-mark { border-radius: 4px; flex-shrink: 0; }
    .eyebrow { font-family: var(--font-ui); font-size: 10px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--brass); margin-bottom: 5px; }
    h1 { font-family: var(--font-display); font-weight: 400; letter-spacing: 0.01em; }

    /* ---- Auth screen ---- */
    .auth-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .auth-card { width: 100%; max-width: 380px; background: var(--paper-raise); border: 1px solid var(--rule-strong); border-radius: 3px; padding: 38px 34px; box-shadow: var(--shadow-paper); position: relative; }
    .auth-card::before { content: ''; position: absolute; inset: 8px; border: 1px solid var(--brass-soft); border-radius: 2px; pointer-events: none; opacity: 0.75; }
    .auth-card .brand-row { margin-bottom: 26px; }
    .auth-card h1 { font-size: 27px; }
    .auth-tabs { display: flex; gap: 4px; background: var(--paper-sunken); border: 1px solid var(--rule); border-radius: 3px; padding: 4px; margin-bottom: 20px; position: relative; }
    .auth-tab { flex: 1; background: none; border: none; color: var(--ink-muted); font-family: var(--font-ui); font-size: 13px; font-weight: 600; padding: 8px 0; border-radius: 2px; cursor: pointer; }
    .auth-tab.active { background: var(--green); color: #F3EEDF; }
    #authForm { display: flex; flex-direction: column; gap: 10px; position: relative; }
    #authForm input { width: 100%; background: var(--paper-bright); border: 1px solid var(--rule-strong); border-radius: 2px; padding: 11px 14px; color: var(--ink); font-size: 14px; font-family: var(--font-ui); outline: none; }
    #authForm input:focus { border-color: var(--green); }
    .auth-hint { font-size: 11px; color: var(--ink-faint); margin-top: -4px; }
    .auth-msg { font-size: 13px; color: var(--down); min-height: 16px; }
    .btn-auth-submit { background: var(--green); color: #F3EEDF; border: none; border-radius: 2px; padding: 12px 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; font-family: var(--font-ui); cursor: pointer; margin-top: 6px; }
    .btn-auth-submit:hover { background: var(--green-bright); }
    .btn-auth-submit:disabled { opacity: 0.6; cursor: default; }

    .skeleton { background: linear-gradient(90deg, #E9E1CB 25%, #DFD6BD 37%, #E9E1CB 63%); background-size: 400% 100%; animation: shimmer 1.6s ease infinite; border-radius: 2px; }
    @keyframes shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    @media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } }
    .skel-line { height: 12px; margin-bottom: 8px; }

    /* ---- Stock detail page ---- */
    .back-link { font-size: 12px; font-weight: 600; color: var(--ink-muted); text-decoration: none; display: inline-flex; align-items: center; gap: 5px; margin-bottom: 18px; }
    .back-link:hover { color: var(--ink); }

    .stock-header {
      background: var(--paper-raise) linear-gradient(var(--margin-red), var(--margin-red)) no-repeat 15px 0 / 1px 100%;
      border: 1px solid var(--rule-strong); border-radius: 3px;
      box-shadow: var(--shadow-paper);
      padding: 22px 24px 22px 30px;
      margin-bottom: 14px;
    }
    .stock-header-top { display: flex; align-items: flex-start; gap: 16px; }
    .stock-logo { width: 48px; height: 48px; border-radius: 3px; border: 1px solid var(--rule); object-fit: contain; background: #fff; padding: 4px; flex-shrink: 0; }
    .stock-logo-fallback { width: 48px; height: 48px; border-radius: 3px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-family: var(--font-data); font-weight: 700; font-size: 20px; color: #F3EEDF; }
    .stock-id { flex: 1; min-width: 0; }
    .stock-symbol { font-family: var(--font-data); font-size: 22px; font-weight: 700; letter-spacing: 0.02em; }
    .stock-name { font-family: var(--font-display); font-size: 16px; color: var(--ink-muted); margin-top: 2px; }
    .stock-industry { font-size: 11px; color: var(--ink-faint); margin-top: 4px; }
    .stock-price-block { text-align: right; flex-shrink: 0; }
    .stock-price { font-family: var(--font-data); font-size: 32px; font-weight: 700; line-height: 1; }
    .stock-change { display: inline-block; font-family: var(--font-data); font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 2px; margin-top: 6px; }
    .stock-change.up { color: var(--up); background: var(--up-bg); }
    .stock-change.down { color: var(--down); background: var(--down-bg); }
    .stock-change.flat { color: var(--ink-muted); background: var(--paper-sunken); }

    /* chart */
    .chart-card {
      background: var(--paper-raise) linear-gradient(var(--margin-red), var(--margin-red)) no-repeat 15px 0 / 1px 100%;
      border: 1px solid var(--rule-strong); border-radius: 3px;
      box-shadow: var(--shadow-paper);
      padding: 18px 24px 18px 30px;
      margin-bottom: 14px;
    }
    .chart-svg { width: 100%; height: 120px; display: block; }
    .chart-empty { font-size: 12px; color: var(--ink-faint); font-style: italic; padding: 20px 0; }
    .chart-label { font-size: 10px; font-weight: 700; color: var(--ink-faint); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 10px; }

    /* stats grid */
    .section-label {
      display: flex; align-items: center; gap: 12px;
      font-family: var(--font-ui); font-size: 11px; font-weight: 700;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-muted);
      margin: 22px 0 12px;
    }
    .section-label::after { content: ''; flex: 1; height: 1px; background: var(--rule-strong); }

    .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .stat-card {
      background: var(--paper-raise); border: 1px solid var(--rule-strong); border-radius: 3px;
      padding: 12px 14px; box-shadow: var(--shadow-paper);
    }
    .stat-label { font-size: 10px; font-weight: 700; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 4px; }
    .stat-value { font-family: var(--font-data); font-size: 15px; font-weight: 700; }

    /* day range */
    .range-row { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
    .range-label { font-family: var(--font-data); font-size: 10px; color: var(--ink-faint); width: 50px; }
    .range-label.left { text-align: left; }
    .range-label.right { text-align: right; }
    .range-track { position: relative; flex: 1; height: 5px; background: var(--paper-sunken); overflow: visible; }
    .range-fill { position: absolute; top: 0; left: 0; height: 100%; background: linear-gradient(90deg, var(--down), var(--up)); opacity: 0.3; }
    .range-dot { position: absolute; top: 50%; width: 11px; height: 11px; border-radius: 50%; transform: translate(-50%, -50%); border: 2px solid var(--paper-raise); box-shadow: 0 0 0 1px var(--rule-strong); }
    .range-dot.up { background: var(--up); }
    .range-dot.down { background: var(--down); }
    .range-dot.flat { background: var(--ink-muted); }

    /* news */
    .news-list { display: flex; flex-direction: column; gap: 0; }
    .news-item {
      display: block; padding: 12px 0; border-bottom: 1px solid var(--rule);
      text-decoration: none; color: inherit;
    }
    .news-item:last-child { border-bottom: none; }
    .news-item:hover .news-item-headline { color: var(--green-bright); }
    .news-item-headline { font-size: 14px; font-weight: 600; line-height: 1.45; }
    .news-meta { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--ink-faint); margin-bottom: 4px; }
    .news-meta .src { color: var(--brass); font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
    .news-meta .dot { flex-shrink: 0; }
    .news-meta .when { flex-shrink: 0; font-family: var(--font-data); font-size: 11px; }

    .empty-section { font-size: 12px; color: var(--ink-faint); font-style: italic; padding: 8px 0; }
    .stock-link { color: var(--green); font-weight: 600; text-decoration: none; font-size: 12px; }
    .stock-link:hover { text-decoration: underline; }

    .stock-actions { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
    .btn-watchlist {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--green); color: #F3EEDF;
      border: none; border-radius: 2px;
      padding: 9px 16px; font-size: 12px; font-weight: 700;
      letter-spacing: 0.04em; text-transform: uppercase;
      font-family: var(--font-ui); cursor: pointer;
    }
    .btn-watchlist:hover { background: var(--green-bright); }
    .btn-watchlist.on-list {
      background: transparent; color: var(--ink-muted);
      border: 1px solid var(--rule-strong);
    }
    .btn-watchlist.on-list:hover { border-color: var(--down); color: var(--down); }

    @media (max-width: 480px) {
      .stock-header-top { flex-direction: column; }
      .stock-price-block { text-align: left; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div class="auth-screen" id="authScreen">
    <div class="auth-card">
      <div class="brand-row">
        <img src="/logo.svg" alt="" class="brand-mark" width="36" height="36" />
        <div>
          <div class="eyebrow">Private ledger</div>
          <h1>Trade Track</h1>
        </div>
      </div>
      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLogin">Log in</button>
        <button class="auth-tab" id="tabSignup">Sign up</button>
      </div>
      <form id="authForm">
        <input type="text" id="authName" placeholder="First name" autocomplete="given-name" style="display:none" />
        <input type="email" id="authEmail" placeholder="Email" autocomplete="email" required />
        <input type="password" id="authPassword" placeholder="Password" autocomplete="current-password" required />
        <div class="auth-hint" id="authHint"></div>
        <div class="auth-msg" id="authMsg"></div>
        <button type="submit" class="btn-auth-submit" id="authSubmit">Log in</button>
      </form>
    </div>
  </div>

  <div class="app" id="appRoot" style="display:none;" data-display="flex">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img src="/logo.svg" alt="" class="brand-mark" width="32" height="32" />
        <div>
          <div class="eyebrow">Private ledger</div>
          <div class="sidebar-title">Trade Track</div>
        </div>
      </div>
      <nav class="side-nav">
        <a href="/" class="side-nav-link">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Home
        </a>
        <a href="/watchlist.html" class="side-nav-link active">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="19" x2="4" y2="10"/><line x1="10" y1="19" x2="10" y2="4"/><line x1="16" y1="19" x2="16" y2="14"/></svg>
          Watchlist
        </a>
        <a href="/articles.html" class="side-nav-link">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          Articles
        </a>
        <a href="/settings.html" class="side-nav-link">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Settings
        </a>
      </nav>
      <div class="account-block">
        <div class="account-row">
          <div class="account-avatar-wrap">
            <div class="account-avatar" id="accountAvatar">?</div>
            <div class="account-email" id="accountEmail">Loading…</div>
          </div>
        </div>
        <button class="btn-logout-full" id="logoutBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Log out
        </button>
      </div>
    </aside>

    <div class="main-content">
      <a href="/watchlist.html" class="back-link">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        Back to watchlist
      </a>

      <div id="headerArea">
        <div class="stock-header">
          <div class="stock-header-top">
            <div class="skeleton" style="width:48px;height:48px;border-radius:3px"></div>
            <div class="stock-id" style="padding-top:4px">
              <div class="skeleton skel-line" style="width:60px;height:18px"></div>
              <div class="skeleton skel-line" style="width:140px;height:14px;margin-top:6px"></div>
            </div>
            <div style="text-align:right">
              <div class="skeleton skel-line" style="width:100px;height:28px;margin-left:auto"></div>
              <div class="skeleton skel-line" style="width:70px;height:18px;margin:6px 0 0 auto"></div>
            </div>
          </div>
        </div>
      </div>

      <div id="watchlistAction"></div>

      <div id="chartArea">
        <div class="chart-card">
          <div class="chart-label">Price history</div>
          <div class="skeleton" style="width:100%;height:120px"></div>
        </div>
      </div>

      <div class="section-label">Key figures</div>
      <div id="statsArea">
        <div class="stats-grid">
          <div class="stat-card"><div class="skeleton skel-line" style="width:50%"></div><div class="skeleton skel-line" style="width:70%;height:16px"></div></div>
          <div class="stat-card"><div class="skeleton skel-line" style="width:50%"></div><div class="skeleton skel-line" style="width:70%;height:16px"></div></div>
          <div class="stat-card"><div class="skeleton skel-line" style="width:50%"></div><div class="skeleton skel-line" style="width:70%;height:16px"></div></div>
        </div>
      </div>

      <div class="section-label">Recent news</div>
      <div id="newsArea">
        <div class="skeleton skel-line" style="width:30%;margin-bottom:12px"></div>
        <div class="skeleton skel-line" style="width:90%;height:14px"></div>
        <div class="skeleton skel-line" style="width:75%;height:14px"></div>
      </div>
    </div>
  </div>

  <script src="/auth.js"></script>
  <script>
    const SYMBOL = new URLSearchParams(window.location.search).get('t');

    if (!SYMBOL) {
      window.location.href = '/watchlist.html';
    }

    AuthGuard.init(function () { initStockPage(); });

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s == null ? '' : String(s);
      return d.innerHTML;
    }

    function fmtPct(v) {
      const abs = Math.abs(v).toFixed(2);
      if (v < 0) return `(${abs}%)`;
      if (v > 0) return `+${abs}%`;
      return `${abs}%`;
    }

    function fmtNum(n) {
      if (n == null) return '—';
      // Finnhub returns marketCap in millions (e.g. 4631217 = $4.63T)
      if (n >= 1e6) return '$' + (n / 1e6).toFixed(2) + 'T';
      if (n >= 1e3) return '$' + (n / 1e3).toFixed(1) + 'B';
      return '$' + n.toFixed(0) + 'M';
    }

    function fmtVol(n) {
      if (n == null) return '—';
      return n.toFixed(1) + 'M';
    }

    function timeAgo(unixSeconds) {
      if (!unixSeconds) return '';
      const diffMs = Date.now() - unixSeconds * 1000;
      const mins = Math.floor(diffMs / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return `${mins}m ago`;
      const hours = Math.floor(mins / 60);
      if (hours < 24) return `${hours}h ago`;
      const days = Math.floor(hours / 24);
      if (days <= 7) return `${days}d ago`;
      return new Date(unixSeconds * 1000).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    const BADGE_COLORS = ['#17442F', '#A97F2F', '#8C2F2B', '#2E4056', '#5F6B3C', '#7A4E2D'];
    function badgeColor(text) {
      let hash = 0;
      for (let i = 0; i < text.length; i++) hash = text.charCodeAt(i) + ((hash << 5) - hash);
      return BADGE_COLORS[Math.abs(hash) % BADGE_COLORS.length];
    }

    function initStockPage() {
      document.title = `${SYMBOL} — Trade Track`;
      loadProfile();
      loadQuote();
      loadChart();
      loadNews();
      checkWatchlist();
    }

    // Is this ticker on the user's watchlist? Drives the add/remove button.
    let isOnWatchlist = null;

    async function checkWatchlist() {
      try {
        const res = await AuthGuard.fetch('/api/watchlist');
        const data = await res.json();
        if (res.ok) {
          const tickers = (data.items || []).map(i => i.ticker);
          isOnWatchlist = tickers.includes(SYMBOL);
          renderWatchlistButton();
        }
      } catch (err) {}
    }

    function renderWatchlistButton() {
      const el = document.getElementById('watchlistAction');
      if (!el || isOnWatchlist === null) return;

      if (isOnWatchlist) {
        el.innerHTML = `
          <div class="stock-actions">
            <button class="btn-watchlist on-list" onclick="toggleWatchlist()">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
              On your watchlist
            </button>
          </div>`;
      } else {
        el.innerHTML = `
          <div class="stock-actions">
            <button class="btn-watchlist" onclick="toggleWatchlist()">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Add to watchlist
            </button>
          </div>`;
      }
    }

    async function toggleWatchlist() {
      if (isOnWatchlist === null) return;
      try {
        if (isOnWatchlist) {
          await AuthGuard.fetch(`/api/watchlist/${encodeURIComponent(SYMBOL)}`, { method: 'DELETE' });
          isOnWatchlist = false;
        } else {
          const name = (window._profile && window._profile.name) || null;
          await AuthGuard.fetch('/api/watchlist', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ticker: SYMBOL, name }),
          });
          isOnWatchlist = true;
        }
        renderWatchlistButton();
      } catch (err) {}
    }

    async function loadProfile() {
      try {
        const res = await AuthGuard.fetch(`/api/stock/${encodeURIComponent(SYMBOL)}/profile`);
        const p = await res.json();
        if (!res.ok) return;

        // If Finnhub returned an empty profile (unknown ticker), the
        // name will just be the symbol itself with no industry/exchange.
        // That's fine — we still show what we can.
        window._profile = p;
        renderHeader(p, null);
        renderStats(null, p);
      } catch (err) {}
    }

    async function loadQuote() {
      try {
        const res = await AuthGuard.fetch(`/api/stock/${encodeURIComponent(SYMBOL)}/quote`);
        const q = await res.json();
        if (!res.ok || q.error) {
          // Unknown ticker or Finnhub can't find it
          const el = document.getElementById('headerArea');
          if (!window._profile) {
            el.innerHTML = `
              <div class="stock-header">
                <div class="stock-header-top">
                  <div class="stock-logo-fallback" style="background:${badgeColor(SYMBOL)}">${SYMBOL[0]}</div>
                  <div class="stock-id">
                    <div class="stock-symbol">${esc(SYMBOL)}</div>
                    <div class="stock-name" style="color:var(--down)">No data found for this ticker</div>
                  </div>
                </div>
              </div>`;
          }
          document.getElementById('statsArea').innerHTML = '<div class="empty-section">No stats available</div>';
          return;
        }

        window._quote = q;
        document.title = `${SYMBOL} $${q.price.toFixed(2)} — Trade Track`;
        renderHeader(window._profile || null, q);
        renderStats(q, window._profile || null);
      } catch (err) {}
    }

    function renderHeader(profile, quote) {
      const p = profile || {};
      const q = quote || {};
      const el = document.getElementById('headerArea');

      const logoHtml = p.logo
        ? `<img class="stock-logo" src="${esc(p.logo)}" alt="" onerror="this.outerHTML='<div class=\\'stock-logo-fallback\\' style=\\'background:${badgeColor(SYMBOL)}\\'>${SYMBOL[0]}</div>'" />`
        : `<div class="stock-logo-fallback" style="background:${badgeColor(SYMBOL)}">${SYMBOL[0]}</div>`;

      const priceHtml = q.price != null
        ? `<div class="stock-price">$${q.price.toFixed(2)}</div>`
        : '<div class="skeleton" style="width:100px;height:28px;margin-left:auto"></div>';

      const dir = q.changePercent > 0 ? 'up' : q.changePercent < 0 ? 'down' : 'flat';
      const changeHtml = q.changePercent != null
        ? `<div class="stock-change ${dir}">${fmtPct(q.changePercent)}</div>`
        : '';

      const rangeHtml = (q.dayLow != null && q.dayHigh != null && q.price != null) ? (() => {
        const pct = q.dayHigh === q.dayLow ? 50 : Math.max(0, Math.min(100, ((q.price - q.dayLow) / (q.dayHigh - q.dayLow)) * 100));
        return `
          <div class="range-row">
            <span class="range-label left">$${q.dayLow.toFixed(2)}</span>
            <div class="range-track">
              <div class="range-fill" style="width:${pct}%"></div>
              <div class="range-dot ${dir}" style="left:${pct}%"></div>
            </div>
            <span class="range-label right">$${q.dayHigh.toFixed(2)}</span>
          </div>`;
      })() : '';

      el.innerHTML = `
        <div class="stock-header">
          <div class="stock-header-top">
            ${logoHtml}
            <div class="stock-id">
              <div class="stock-symbol">${esc(SYMBOL)}</div>
              <div class="stock-name">${esc(p.name || SYMBOL)}</div>
              ${p.industry ? `<div class="stock-industry">${esc(p.industry)}${p.exchange ? ' · ' + esc(p.exchange) : ''}</div>` : ''}
            </div>
            <div class="stock-price-block">
              ${priceHtml}
              ${changeHtml}
            </div>
          </div>
          ${rangeHtml}
          ${p.weburl ? `<a href="${esc(p.weburl)}" target="_blank" rel="noopener" class="stock-link" style="display:inline-block;margin-top:12px">${esc(p.weburl.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, ''))}</a>` : ''}
        </div>`;
    }

    function renderStats(quote, profile) {
      const q = quote || {};
      const p = profile || {};
      const el = document.getElementById('statsArea');

      const stats = [];
      if (q.dayOpen != null) stats.push({ label: 'Open', value: '$' + q.dayOpen.toFixed(2) });
      if (q.dayHigh != null) stats.push({ label: 'Day high', value: '$' + q.dayHigh.toFixed(2) });
      if (q.dayLow != null) stats.push({ label: 'Day low', value: '$' + q.dayLow.toFixed(2) });
      if (p.weekHigh52 != null) stats.push({ label: '52w high', value: '$' + parseFloat(p.weekHigh52).toFixed(2) });
      if (p.weekLow52 != null) stats.push({ label: '52w low', value: '$' + parseFloat(p.weekLow52).toFixed(2) });
      if (p.marketCap != null) stats.push({ label: 'Mkt cap', value: fmtNum(p.marketCap) });
      if (p.avgVolume != null) stats.push({ label: 'Avg vol (10d)', value: fmtVol(p.avgVolume) });
      if (p.ipo) stats.push({ label: 'IPO date', value: p.ipo });

      if (stats.length === 0) {
        el.innerHTML = '<div class="empty-section">No stats available yet</div>';
        return;
      }

      el.innerHTML = `<div class="stats-grid">${stats.map(s => `
        <div class="stat-card">
          <div class="stat-label">${esc(s.label)}</div>
          <div class="stat-value">${esc(s.value)}</div>
        </div>
      `).join('')}</div>`;
    }

    async function loadChart() {
      const el = document.getElementById('chartArea');
      try {
        const res = await AuthGuard.fetch(`/api/stock/${encodeURIComponent(SYMBOL)}/history`);
        const data = await res.json();
        const points = data.points || [];

        if (points.length < 2) {
          el.innerHTML = `<div class="chart-card"><div class="chart-label">Price history</div><div class="chart-empty">Collecting data — the chart will appear once there are enough snapshots</div></div>`;
          return;
        }

        const prices = points.map(p => p.price);
        const min = Math.min(...prices);
        const max = Math.max(...prices);
        const range = max - min;
        const W = 600, H = 120, pad = 4;

        const coords = points.map((p, i) => {
          const x = pad + (i / (points.length - 1)) * (W - 2 * pad);
          const y = range === 0 ? H / 2 : pad + (1 - (p.price - min) / range) * (H - 2 * pad);
          return `${x.toFixed(1)},${y.toFixed(1)}`;
        });

        const trendUp = prices[prices.length - 1] >= prices[0];
        const stroke = trendUp ? 'var(--up)' : 'var(--down)';
        const fillId = 'cg' + Date.now();

        // Area fill underneath the line
        const areaCoords = coords.join(' ') + ` ${W - pad},${H} ${pad},${H}`;

        // Time labels
        const first = new Date(points[0].recordedAt);
        const last = new Date(points[points.length - 1].recordedAt);
        const fmtDate = d => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

        el.innerHTML = `
          <div class="chart-card">
            <div class="chart-label">Price history · $${min.toFixed(2)} – $${max.toFixed(2)}</div>
            <svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
              <defs>
                <linearGradient id="${fillId}" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="${stroke}" stop-opacity="0.18"/>
                  <stop offset="100%" stop-color="${stroke}" stop-opacity="0.02"/>
                </linearGradient>
              </defs>
              <polygon points="${areaCoords}" fill="url(#${fillId})" />
              <polyline points="${coords.join(' ')}" fill="none" stroke="${stroke}"
                stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
            </svg>
            <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--ink-faint);font-family:var(--font-data);margin-top:4px">
              <span>${fmtDate(first)}</span>
              <span>${fmtDate(last)}</span>
            </div>
          </div>`;
      } catch (err) {
        el.innerHTML = '<div class="chart-card"><div class="chart-empty">Could not load chart data</div></div>';
      }
    }

    async function loadNews() {
      const el = document.getElementById('newsArea');
      try {
        const res = await AuthGuard.fetch(`/api/stock/${encodeURIComponent(SYMBOL)}/news`);
        const data = await res.json();
        const articles = data.articles || [];

        if (articles.length === 0) {
          el.innerHTML = '<div class="empty-section">No recent news for this stock</div>';
          return;
        }

        el.innerHTML = `<div class="news-list">${articles.map(a => `
          <a class="news-item" href="${esc(a.url)}" target="_blank" rel="noopener">
            <div class="news-meta">
              <span class="src">${esc(a.source)}</span>
              <span class="dot">·</span>
              <span class="when">${esc(timeAgo(a.datetime))}</span>
            </div>
            <div class="news-item-headline">${esc(a.headline)}</div>
          </a>
        `).join('')}</div>`;
      } catch (err) {
        el.innerHTML = '<div class="empty-section">Could not load news</div>';
      }
    }
  </script>
</body>
</html>
