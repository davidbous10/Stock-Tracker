<!DOCTYPE html>
<html lang="en" style="background:#F3EEDF">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock Screener | Trade Track</title>
  <meta name="description" content="Screen stocks by PE, market cap, dividend yield, and more." />
  <meta name="theme-color" content="#17442F" />
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="/logo-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Archivo:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* paper */
      --paper: #F3EEDF;
      --paper-raise: #FBF7EB;
      --paper-bright: #FFFDF4;
      --paper-sunken: #ECE5D0;
      /* ink */
      --ink: #23281F;
      --ink-muted: #686C5B;
      --ink-faint: #9A9C8B;
      /* rules (the printed lines of ledger paper) */
      --rule: #DDD5BE;
      --rule-strong: #C6BEA2;
      --margin-red: #C05A50;
      /* the bank */
      --green: #17442F;
      --green-deep: #0F3323;
      --green-bright: #1E5C3D;
      --brass: #A97F2F;
      --brass-soft: #C9A75C;
      /* money */
      --up: #1D6A43;
      --up-bg: #E3EBDA;
      --down: #8C2F2B;
      --down-bg: #F1E0D8;
      /* type */
      --font-display: 'Marcellus', 'Georgia', serif;
      --font-ui: 'Archivo', system-ui, sans-serif;
      --font-data: 'Courier Prime', 'Courier New', monospace;
      --shadow-paper: 0 1px 0 rgba(35,40,31,0.05), 0 8px 22px rgba(35,40,31,0.08);
      /* legacy aliases so any straggler rule still resolves */
      --text: var(--ink);
      --text-muted: var(--ink-muted);
      --text-faint: var(--ink-faint);
      --border: var(--rule-strong);
      --border-soft: var(--rule);
      --surface: var(--paper-raise);
      --surface-hover: var(--paper-bright);
      --accent: var(--brass);
      --bg: var(--paper);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-ui);
      display: flex;
      justify-content: center;
      padding: 40px 24px;
    }

    a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid var(--brass);
      outline-offset: 2px;
    }

    .app {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      align-items: flex-start;
      gap: 34px;
    }

    /* ---- Sidebar: the ledger's cover ---- */
    .sidebar {
      width: 232px;
      flex-shrink: 0;
      position: sticky;
      top: 40px;
      display: flex;
      flex-direction: column;
      gap: 26px;
      background: var(--green);
      border: 1px solid var(--green-deep);
      border-radius: 4px;
      padding: 22px 16px;
      box-shadow: var(--shadow-paper);
      color: #EFE9D4;
    }
    .sidebar-brand { display: flex; align-items: center; gap: 11px; }
    .sidebar-title {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 400;
      letter-spacing: 0.02em;
      color: #F3EEDF;
    }
    .sidebar .eyebrow { color: var(--brass-soft); }

    .side-nav { display: flex; flex-direction: column; gap: 2px; }
    .side-nav-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 3px;
      color: #B9C1AC;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.01em;
    }
    .side-nav-link svg { flex-shrink: 0; }
    .side-nav-link:hover { background: rgba(243,238,223,0.08); color: #F3EEDF; }
    .side-nav-link.active {
      background: rgba(15,51,35,0.85);
      color: #F3EEDF;
      box-shadow: inset 2px 0 0 var(--brass-soft);
    }

    .account-block {
      margin-top: auto;
      padding-top: 18px;
      border-top: 1px solid rgba(243,238,223,0.16);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .account-row { display: flex; align-items: center; }
    .account-avatar-wrap { position: relative; display: inline-flex; }
    .account-avatar {
      width: 32px;
      height: 32px;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-data);
      font-weight: 700;
      font-size: 13px;
      color: #F3EEDF;
      border: 1px solid rgba(243,238,223,0.25);
      flex-shrink: 0;
      cursor: default;
    }
    .account-email {
      position: absolute;
      left: calc(100% + 10px);
      top: 50%;
      transform: translateY(-50%);
      background: var(--green-deep);
      border: 1px solid rgba(201,167,92,0.5);
      color: #F3EEDF;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 3px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
      z-index: 20;
    }
    .account-avatar-wrap:hover .account-email { opacity: 1; }
    .btn-logout-full {
      display: flex;
      align-items: center;
      gap: 8px;
      background: none;
      border: 1px solid rgba(243,238,223,0.25);
      color: #B9C1AC;
      border-radius: 3px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      font-family: var(--font-ui);
      cursor: pointer;
    }
    .btn-logout-full:hover { border-color: #D99C92; color: #F1D8D2; }

    .main-content { flex: 1; min-width: 0; }

    @media (max-width: 800px) {
      .app { flex-direction: column; }
      .sidebar {
        width: 100%;
        position: static;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px;
      }
      .side-nav { flex-direction: row; }
      .account-block {
        margin-top: 0;
        padding-top: 0;
        border-top: none;
        flex-direction: row;
      }
      .account-email { display: none; }
    }

    /* ---- Shared identity bits ---- */
    .brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    .brand-row > div:nth-child(2) { flex: 1; }
    .brand-mark { border-radius: 4px; flex-shrink: 0; }

    .eyebrow {
      font-family: var(--font-ui);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--brass);
      margin-bottom: 5px;
    }
    h1 {
      font-family: var(--font-display);
      font-weight: 400;
      letter-spacing: 0.01em;
    }

    /* ---- Auth screen: the certificate ---- */
    .auth-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card {
      width: 100%;
      max-width: 380px;
      background: var(--paper-raise);
      border: 1px solid var(--rule-strong);
      border-radius: 3px;
      padding: 38px 34px;
      box-shadow: var(--shadow-paper);
      position: relative;
    }
    .auth-card::before {
      content: '';
      position: absolute;
      inset: 8px;
      border: 1px solid var(--brass-soft);
      border-radius: 2px;
      pointer-events: none;
      opacity: 0.75;
    }
    .auth-card .brand-row { margin-bottom: 26px; }
    .auth-card h1 { font-size: 27px; }

    .auth-tabs {
      display: flex;
      gap: 4px;
      background: var(--paper-sunken);
      border: 1px solid var(--rule);
      border-radius: 3px;
      padding: 4px;
      margin-bottom: 20px;
      position: relative;
    }
    .auth-tab {
      flex: 1;
      background: none;
      border: none;
      color: var(--ink-muted);
      font-family: var(--font-ui);
      font-size: 13px;
      font-weight: 600;
      padding: 8px 0;
      border-radius: 2px;
      cursor: pointer;
    }
    .auth-tab.active { background: var(--green); color: #F3EEDF; }

    #authForm { display: flex; flex-direction: column; gap: 10px; position: relative; }
    #authForm input {
      width: 100%;
      background: var(--paper-bright);
      border: 1px solid var(--rule-strong);
      border-radius: 2px;
      padding: 11px 14px;
      color: var(--ink);
      font-size: 14px;
      font-family: var(--font-ui);
      outline: none;
    }
    #authForm input:focus { border-color: var(--green); }
    .auth-hint { font-size: 11px; color: var(--ink-faint); margin-top: -4px; }
    .auth-msg { font-size: 13px; color: var(--down); min-height: 16px; }
    .btn-auth-submit {
      background: var(--green);
      color: #F3EEDF;
      border: none;
      border-radius: 2px;
      padding: 12px 0;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-family: var(--font-ui);
      cursor: pointer;
      margin-top: 6px;
    }
    .btn-auth-submit:hover { background: var(--green-bright); }
    .btn-auth-submit:disabled { opacity: 0.6; cursor: default; }

    /* ---- Section headings: ledger column heads ---- */
    .section-label {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: var(--font-ui);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin: 30px 0 12px;
    }
    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--rule-strong);
    }
    .section-label:first-of-type { margin-top: 0; }

    /* ---- Skeleton loading on paper ---- */
    .skeleton {
      background: linear-gradient(90deg, #E9E1CB 25%, #DFD6BD 37%, #E9E1CB 63%);
      background-size: 400% 100%;
      animation: shimmer 1.6s ease infinite;
      border-radius: 2px;
    }
    @keyframes shimmer {
      0% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .skeleton { animation: none; }
    }

    /* ---- Articles ---- */
    .page-title { font-family: var(--font-display); font-size: 24px; }
    .page-subtitle {
      font-family: var(--font-data);
      font-size: 13px;
      color: var(--ink-muted);
      margin-top: 4px;
    }

    .featured-card {
      display: flex;
      gap: 0;
      background: var(--paper-raise) linear-gradient(var(--margin-red), var(--margin-red)) no-repeat 15px 0 / 1px 100%;
      border: 1px solid var(--rule-strong);
      border-radius: 3px;
      box-shadow: var(--shadow-paper);
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      margin-bottom: 12px;
    }
    .featured-card:hover { border-color: var(--brass-soft); }
    .featured-img {
      width: 260px;
      flex-shrink: 0;
      object-fit: cover;
      background: var(--paper-sunken);
      border-right: 1px solid var(--rule);
      display: block;
      filter: sepia(0.14) saturate(0.92);
    }
    .featured-body { padding: 18px 20px 18px 24px; min-width: 0; display: flex; flex-direction: column; }
    .featured-headline {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 400;
      line-height: 1.3;
      margin-bottom: 8px;
    }
    .featured-summary {
      font-size: 13px;
      color: var(--ink-muted);
      line-height: 1.55;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .news-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .news-card {
      display: flex;
      gap: 14px;
      background: var(--paper-raise) linear-gradient(var(--margin-red), var(--margin-red)) no-repeat 15px 0 / 1px 100%;
      border: 1px solid var(--rule-strong);
      border-radius: 3px;
      box-shadow: var(--shadow-paper);
      padding: 14px 14px 14px 24px;
      text-decoration: none;
      color: inherit;
      min-width: 0;
    }
    .news-card:hover { border-color: var(--brass-soft); }
    .news-thumb {
      width: 74px;
      height: 74px;
      border-radius: 2px;
      border: 1px solid var(--rule);
      object-fit: cover;
      flex-shrink: 0;
      background: var(--paper-sunken);
      display: block;
      filter: sepia(0.14) saturate(0.92);
    }
    .news-card-body { min-width: 0; }
    .news-headline {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .news-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      color: var(--ink-faint);
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .news-meta .src {
      color: var(--brass);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .news-meta .dot { flex-shrink: 0; }
    .news-meta .when { flex-shrink: 0; font-family: var(--font-data); font-size: 11px; }

    .ticker-group {
      background: var(--paper-raise) linear-gradient(var(--margin-red), var(--margin-red)) no-repeat 15px 0 / 1px 100%;
      border: 1px solid var(--rule-strong);
      border-radius: 3px;
      box-shadow: var(--shadow-paper);
      padding: 16px 18px 16px 26px;
      margin-bottom: 12px;
    }
    .ticker-group-head {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 4px;
    }
    .ticker-group-symbol {
      font-family: var(--font-data);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .ticker-group-name {
      font-size: 12px;
      color: var(--ink-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    .ticker-article {
      display: block;
      padding: 10px 0;
      border-top: 1px solid var(--rule);
      text-decoration: none;
      color: inherit;
    }
    .ticker-group .ticker-article:first-of-type { border-top: none; margin-top: 6px; }
    .ticker-article:hover .ticker-article-headline { color: var(--green-bright); }
    .ticker-article-headline {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.45;
    }
    .ticker-article .news-meta { margin-bottom: 3px; }
    .ticker-no-news {
      font-size: 12px;
      color: var(--ink-faint);
      font-style: italic;
      padding: 8px 0 2px;
    }

    .feed-empty {
      background: transparent;
      border: 1px dashed var(--rule-strong);
      border-radius: 3px;
      padding: 24px;
      text-align: center;
      color: var(--ink-muted);
      font-size: 14px;
    }
    .feed-empty a { color: var(--green); font-weight: 600; }

    .btn-save {
      background: none; border: none; color: var(--ink-faint);
      cursor: pointer; padding: 4px; flex-shrink: 0; border-radius: 2px;
    }
    .btn-save:hover { color: var(--brass); }
    .btn-save.saved { color: var(--brass); }

    .featured-card { position: relative; }
    .featured-card .btn-save { position: absolute; top: 10px; right: 10px; }
    .news-card { position: relative; }
    .news-card .btn-save { position: absolute; top: 8px; right: 8px; }
    .ticker-article { position: relative; }
    .ticker-article .btn-save { position: absolute; top: 10px; right: 0; }

    .saved-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 0; border-bottom: 1px solid var(--rule);
    }
    .saved-item:last-child { border-bottom: none; }
    .saved-item-body { flex: 1; min-width: 0; }
    .saved-item-link { text-decoration: none; color: inherit; }
    .saved-item-link:hover .saved-item-headline { color: var(--green-bright); }
    .saved-item-headline { font-size: 13px; font-weight: 600; line-height: 1.4; }

    .refresh-btn {
      background: none; border: 1px solid var(--rule-strong);
      color: var(--ink-muted); border-radius: 2px;
      padding: 8px 14px; font-size: 12px;
      font-family: var(--font-ui); font-weight: 600; cursor: pointer;
    }
    .refresh-btn:hover { border-color: var(--green); color: var(--ink); }

    .skel-featured {
      background: var(--paper-raise);
      border: 1px solid var(--rule);
      border-radius: 3px;
      height: 140px;
      margin-bottom: 12px;
      padding: 18px 20px;
    }
    .skel-news-card {
      background: var(--paper-raise);
      border: 1px solid var(--rule);
      border-radius: 3px;
      padding: 14px;
      height: 102px;
    }
    .skel-line { height: 12px; margin-bottom: 8px; }

    @media (max-width: 640px) {
      .news-grid { grid-template-columns: 1fr; }
      .featured-card { flex-direction: column; }
      .featured-img { width: 100%; height: 150px; border-right: none; border-bottom: 1px solid var(--rule); }
    }

    /* ---- Mobile bottom tab bar ---- */
    .bottom-tabs {
      display: none;
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--green); border-top: 1px solid var(--green-deep);
      z-index: 100; padding: 6px 0 env(safe-area-inset-bottom, 6px);
    }
    .bottom-tabs nav {
      display: flex; justify-content: space-around; align-items: center;
    }
    .tab-link {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      text-decoration: none; color: #B9C1AC; font-size: 10px; font-weight: 600;
      padding: 4px 8px; letter-spacing: 0.02em;
    }
    .tab-link:hover, .tab-link.active { color: #F3EEDF; }
    .tab-link.active svg { stroke: var(--brass-soft); }

    @media (max-width: 800px) {
      .sidebar { display: none !important; }
      .bottom-tabs { display: block; }
      .app { padding-bottom: 72px; }
      body { padding: 20px 16px 0; }
    }

  
    .page-title { font-family: var(--font-display); font-size: 24px; }
    .page-subtitle { font-family: var(--font-data); font-size: 13px; color: var(--ink-muted); margin-top: 4px; }
    .refresh-btn { background: none; border: 1px solid var(--rule-strong); color: var(--ink-muted); border-radius: 2px; padding: 8px 14px; font-size: 12px; font-family: var(--font-ui); font-weight: 600; cursor: pointer; }
    .refresh-btn:hover { border-color: var(--green); color: var(--ink); }
    .filter-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .filter-group { display: flex; flex-direction: column; gap: 3px; }
    .filter-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-faint); }
    .filter-input { width: 100px; padding: 7px 10px; background: var(--paper-bright); border: 1px solid var(--rule-strong); border-radius: 2px; font-family: var(--font-data); font-size: 12px; color: var(--ink); outline: none; }
    .filter-input:focus { border-color: var(--green); }
    .filter-btn { align-self: flex-end; background: var(--green); color: #F3EEDF; border: none; border-radius: 2px; padding: 8px 16px; font-size: 11px; font-weight: 700; font-family: var(--font-ui); cursor: pointer; text-transform: uppercase; }
    .filter-btn:hover { background: var(--green-bright); }
    .screener-table { width: 100%; background: var(--paper-raise); border: 1px solid var(--rule-strong); border-radius: 3px; box-shadow: var(--shadow-paper); border-collapse: collapse; font-size: 12px; }
    .screener-table th { text-align: left; padding: 10px 12px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-faint); border-bottom: 2px solid var(--rule-strong); background: var(--paper-sunken); cursor: pointer; white-space: nowrap; }
    .screener-table th:hover { color: var(--ink); }
    .screener-table td { padding: 9px 12px; border-bottom: 1px solid var(--rule); }
    .screener-table tr:last-child td { border-bottom: none; }
    .screener-table tr:hover td { background: var(--paper-bright); cursor: pointer; }
    .screener-table .mono { font-family: var(--font-data); font-weight: 700; }
    .screener-table .right { text-align: right; }
    .screener-table .up { color: var(--up); }
    .screener-table .down { color: var(--down); }
    .screener-table .faint { color: var(--ink-faint); }
    .screener-count { font-size: 12px; color: var(--ink-faint); margin-bottom: 10px; }
    .screener-empty { text-align: center; padding: 30px; color: var(--ink-muted); font-size: 14px; }

  </style>
</head>
<body>
  <div class="auth-screen" id="authScreen" style="display:none">
    <div class="auth-card">
      <div class="brand-row">
        <img src="/logo.png" alt="" class="brand-mark" style="border-radius:6px" width="36" height="36" />
        <div>
          <div class="eyebrow">Private ledger</div>
          <h1>Trade Track</h1>
        </div>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLogin">Log in</button>
        <button class="auth-tab" id="tabSignup">Sign up</button>
      </div>

      <form id="authForm">
        <input type="text" id="authName" placeholder="First name" autocomplete="given-name" style="display:none" />
        <input type="email" id="authEmail" placeholder="Email" autocomplete="email" required />
        <input type="password" id="authPassword" placeholder="Password" autocomplete="current-password" required />
        <div class="auth-hint" id="authHint"></div>
        <div class="auth-msg" id="authMsg"></div>
        <button type="submit" class="btn-auth-submit" id="authSubmit">Log in</button>

  <script>
    AuthGuard.init(function () { loadScreener(); });

    function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
    function fmtPct(v) { if (v == null) return '-'; var abs = Math.abs(v).toFixed(2); if (v < 0) return '(' + abs + '%)'; if (v > 0) return '+' + abs + '%'; return abs + '%'; }

    var allStocks = [];
    var sortCol = 'marketCap';
    var sortDir = 'desc';

    async function loadScreener() {
      var el = document.getElementById('screenerResults');
      el.innerHTML = '<div class="screener-empty">Loading screener data...</div>';
      try {
        var res = await AuthGuard.fetch('/api/screener');
        var data = await res.json();
        allStocks = data.stocks || [];
        applyFilters();
      } catch (err) {
        el.innerHTML = '<div class="screener-empty">Could not load screener data</div>';
      }
    }

    function applyFilters() {
      var peMax = parseFloat(document.getElementById('fPE').value) || null;
      var mcapMin = parseFloat(document.getElementById('fMcap').value) || null;
      var divMin = parseFloat(document.getElementById('fDiv').value) || null;
      var marginMin = parseFloat(document.getElementById('fMargin').value) || null;
      var growthMin = parseFloat(document.getElementById('fGrowth').value) || null;

      var filtered = allStocks.filter(function(s) {
        if (peMax && (s.pe == null || s.pe > peMax || s.pe <= 0)) return false;
        if (mcapMin && (s.marketCap == null || s.marketCap / 1000 < mcapMin)) return false;
        if (divMin && (s.dividendYield == null || s.dividendYield < divMin)) return false;
        if (marginMin && (s.profitMargin == null || s.profitMargin < marginMin)) return false;
        if (growthMin && (s.revenueGrowth == null || s.revenueGrowth < growthMin)) return false;
        return true;
      });

      filtered.sort(function(a, b) {
        var av = a[sortCol], bv = b[sortCol];
        if (av == null) return 1;
        if (bv == null) return -1;
        return sortDir === 'asc' ? av - bv : bv - av;
      });

      renderTable(filtered);
    }

    function sortBy(col) {
      if (sortCol === col) { sortDir = sortDir === 'asc' ? 'desc' : 'asc'; }
      else { sortCol = col; sortDir = 'desc'; }
      applyFilters();
    }

    function renderTable(stocks) {
      var el = document.getElementById('screenerResults');
      document.getElementById('screenerCount').textContent = stocks.length + ' of ' + allStocks.length + ' stocks';

      if (stocks.length === 0) {
        el.innerHTML = '<div class="screener-empty">No stocks match your filters.</div>';
        return;
      }

      function arrow(col) { return sortCol === col ? (sortDir === 'asc' ? ' \u2191' : ' \u2193') : ''; }

      function th(col, label, isRight) {
        return '<th' + (isRight ? ' class="right"' : '') + ' onclick="sortBy(\'' + col + '\')">' + label + arrow(col) + '</th>';
      }

      var html = '<table class="screener-table"><tr>';
      html += th('ticker', 'Ticker', false);
      html += th('price', 'Price', true);
      html += th('changePercent', 'Day %', true);
      html += th('marketCap', 'Mkt Cap', true);
      html += th('pe', 'PE', true);
      html += th('dividendYield', 'Div %', true);
      html += th('profitMargin', 'Margin', true);
      html += th('revenueGrowth', 'Growth', true);
      html += '</tr>';

      stocks.forEach(function(s) {
        var dir = s.changePercent > 0 ? 'up' : s.changePercent < 0 ? 'down' : '';
        var mcap = s.marketCap ? '$' + (s.marketCap / 1000).toFixed(1) + 'B' : '-';
        html += '<tr onclick="window.location.href=\'/stock.html?t=' + encodeURIComponent(s.ticker) + '\'">';
        html += '<td class="mono">' + esc(s.ticker) + '</td>';
        html += '<td class="right mono">$' + (s.price ? s.price.toFixed(2) : '-') + '</td>';
        html += '<td class="right mono ' + dir + '">' + fmtPct(s.changePercent) + '</td>';
        html += '<td class="right mono faint">' + mcap + '</td>';
        html += '<td class="right mono">' + (s.pe ? s.pe.toFixed(1) : '-') + '</td>';
        html += '<td class="right mono">' + (s.dividendYield ? s.dividendYield.toFixed(2) + '%' : '-') + '</td>';
        html += '<td class="right mono">' + (s.profitMargin ? s.profitMargin.toFixed(1) + '%' : '-') + '</td>';
        html += '<td class="right mono">' + (s.revenueGrowth ? s.revenueGrowth.toFixed(1) + '%' : '-') + '</td>';
        html += '</tr>';
      });

      html += '</table>';
      el.innerHTML = html;
    }

  </script>
