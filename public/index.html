<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trade Track</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Archivo:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* paper */
      --paper: #F3EEDF;
      --paper-raise: #FBF7EB;
      --paper-bright: #FFFDF4;
      --paper-sunken: #ECE5D0;
      /* ink */
      --ink: #23281F;
      --ink-muted: #686C5B;
      --ink-faint: #9A9C8B;
      /* rules (the printed lines of ledger paper) */
      --rule: #DDD5BE;
      --rule-strong: #C6BEA2;
      --margin-red: #C05A50;
      /* the bank */
      --green: #17442F;
      --green-deep: #0F3323;
      --green-bright: #1E5C3D;
      --brass: #A97F2F;
      --brass-soft: #C9A75C;
      /* money */
      --up: #1D6A43;
      --up-bg: #E3EBDA;
      --down: #8C2F2B;
      --down-bg: #F1E0D8;
      /* type */
      --font-display: 'Marcellus', 'Georgia', serif;
      --font-ui: 'Archivo', system-ui, sans-serif;
      --font-data: 'Courier Prime', 'Courier New', monospace;
      --shadow-paper: 0 1px 0 rgba(35,40,31,0.05), 0 8px 22px rgba(35,40,31,0.08);
      /* legacy aliases so any straggler rule still resolves */
      --text: var(--ink);
      --text-muted: var(--ink-muted);
      --text-faint: var(--ink-faint);
      --border: var(--rule-strong);
      --border-soft: var(--rule);
      --surface: var(--paper-raise);
      --surface-hover: var(--paper-bright);
      --accent: var(--brass);
      --bg: var(--paper);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-ui);
      display: flex;
      justify-content: center;
      padding: 40px 24px;
    }

    a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid var(--brass);
      outline-offset: 2px;
    }

    .app {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      align-items: flex-start;
      gap: 34px;
    }

    /* ---- Sidebar: the ledger's cover ---- */
    .sidebar {
      width: 232px;
      flex-shrink: 0;
      position: sticky;
      top: 40px;
      display: flex;
      flex-direction: column;
      gap: 26px;
      background: var(--green);
      border: 1px solid var(--green-deep);
      border-radius: 4px;
      padding: 22px 16px;
      box-shadow: var(--shadow-paper);
      color: #EFE9D4;
    }
    .sidebar-brand { display: flex; align-items: center; gap: 11px; }
    .sidebar-title {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 400;
      letter-spacing: 0.02em;
      color: #F3EEDF;
    }
    .sidebar .eyebrow { color: var(--brass-soft); }

    .side-nav { display: flex; flex-direction: column; gap: 2px; }
    .side-nav-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 3px;
      color: #B9C1AC;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.01em;
    }
    .side-nav-link svg { flex-shrink: 0; }
    .side-nav-link:hover { background: rgba(243,238,223,0.08); color: #F3EEDF; }
    .side-nav-link.active {
      background: rgba(15,51,35,0.85);
      color: #F3EEDF;
      box-shadow: inset 2px 0 0 var(--brass-soft);
    }

    .account-block {
      margin-top: auto;
      padding-top: 18px;
      border-top: 1px solid rgba(243,238,223,0.16);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .account-row { display: flex; align-items: center; }
    .account-avatar-wrap { position: relative; display: inline-flex; }
    .account-avatar {
      width: 32px;
      height: 32px;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-data);
      font-weight: 700;
      font-size: 13px;
      color: #F3EEDF;
      border: 1px solid rgba(243,238,223,0.25);
      flex-shrink: 0;
      cursor: default;
    }
    .account-email {
      position: absolute;
      left: calc(100% + 10px);
      top: 50%;
      transform: translateY(-50%);
      background: var(--green-deep);
      border: 1px solid rgba(201,167,92,0.5);
      color: #F3EEDF;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 3px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
      z-index: 20;
    }
    .account-avatar-wrap:hover .account-email { opacity: 1; }
    .btn-logout-full {
      display: flex;
      align-items: center;
      gap: 8px;
      background: none;
      border: 1px solid rgba(243,238,223,0.25);
      color: #B9C1AC;
      border-radius: 3px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      font-family: var(--font-ui);
      cursor: pointer;
    }
    .btn-logout-full:hover { border-color: #D99C92; color: #F1D8D2; }

    .main-content { flex: 1; min-width: 0; }

    @media (max-width: 800px) {
      .app { flex-direction: column; }
      .sidebar {
        width: 100%;
        position: static;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px;
      }
      .side-nav { flex-direction: row; }
      .account-block {
        margin-top: 0;
        padding-top: 0;
        border-top: none;
        flex-direction: row;
      }
      .account-email { display: none; }
    }

    /* ---- Shared identity bits ---- */
    .brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    .brand-row > div:nth-child(2) { flex: 1; }
    .brand-mark { border-radius: 4px; flex-shrink: 0; }

    .eyebrow {
      font-family: var(--font-ui);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--brass);
      margin-bottom: 5px;
    }
    h1 {
      font-family: var(--font-display);
      font-weight: 400;
      letter-spacing: 0.01em;
    }

    /* ---- Auth screen: the certificate ---- */
    .auth-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card {
      width: 100%;
      max-width: 380px;
      background: var(--paper-raise);
      border: 1px solid var(--rule-strong);
      border-radius: 3px;
      padding: 38px 34px;
      box-shadow: var(--shadow-paper);
      position: relative;
    }
    .auth-card::before {
      content: '';
      position: absolute;
      inset: 8px;
      border: 1px solid var(--brass-soft);
      border-radius: 2px;
      pointer-events: none;
      opacity: 0.75;
    }
    .auth-card .brand-row { margin-bottom: 26px; }
    .auth-card h1 { font-size: 27px; }

    .auth-tabs {
      display: flex;
      gap: 4px;
      background: var(--paper-sunken);
      border: 1px solid var(--rule);
      border-radius: 3px;
      padding: 4px;
      margin-bottom: 20px;
      position: relative;
    }
    .auth-tab {
      flex: 1;
      background: none;
      border: none;
      color: var(--ink-muted);
      font-family: var(--font-ui);
      font-size: 13px;
      font-weight: 600;
      padding: 8px 0;
      border-radius: 2px;
      cursor: pointer;
    }
    .auth-tab.active { background: var(--green); color: #F3EEDF; }

    #authForm { display: flex; flex-direction: column; gap: 10px; position: relative; }
    #authForm input {
      width: 100%;
      background: var(--paper-bright);
      border: 1px solid var(--rule-strong);
      border-radius: 2px;
      padding: 11px 14px;
      color: var(--ink);
      font-size: 14px;
      font-family: var(--font-ui);
      outline: none;
    }
    #authForm input:focus { border-color: var(--green); }
    .auth-hint { font-size: 11px; color: var(--ink-faint); margin-top: -4px; }
    .auth-msg { font-size: 13px; color: var(--down); min-height: 16px; }
    .btn-auth-submit {
      background: var(--green);
      color: #F3EEDF;
      border: none;
      border-radius: 2px;
      padding: 12px 0;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-family: var(--font-ui);
      cursor: pointer;
      margin-top: 6px;
    }
    .btn-auth-submit:hover { background: var(--green-bright); }
    .btn-auth-submit:disabled { opacity: 0.6; cursor: default; }

    /* ---- Section headings: ledger column heads ---- */
    .section-label {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: var(--font-ui);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin: 30px 0 12px;
    }
    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--rule-strong);
    }
    .section-label:first-of-type { margin-top: 0; }

    /* ---- Skeleton loading on paper ---- */
    .skeleton {
      background: linear-gradient(90deg, #E9E1CB 25%, #DFD6BD 37%, #E9E1CB 63%);
      background-size: 400% 100%;
      animation: shimmer 1.6s ease infinite;
      border-radius: 2px;
    }
    @keyframes shimmer {
      0% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .skeleton { animation: none; }
    }

    /* ---- Home ---- */
    .greeting { margin-bottom: 26px; }
    .greeting-text { font-family: var(--font-display); font-size: 24px; }
    .greeting-date {
      font-family: var(--font-data);
      font-size: 13px;
      color: var(--ink-muted);
      margin-top: 4px;
    }

    .pulse-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .pulse-card {
      background: var(--paper-raise) linear-gradient(var(--margin-red), var(--margin-red)) no-repeat 15px 0 / 1px 100%;
      border: 1px solid var(--rule-strong);
      border-radius: 3px;
      box-shadow: var(--shadow-paper);
      border-top: 3px solid var(--idx-color, var(--brass));
      padding: 14px 16px 14px 26px;
      text-decoration: none;
      color: inherit;
      display: block;
    }
    .pulse-card:hover { border-color: var(--brass-soft); }
    .pulse-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-bottom: 8px;
      white-space: nowrap;
    }
    .pulse-price {
      font-family: var(--font-data);
      font-size: 17px;
      font-weight: 700;
    }
    .pulse-change {
      font-family: var(--font-data);
      font-size: 12px;
      font-weight: 700;
      margin-top: 4px;
    }
    .pulse-change.up { color: var(--up); }
    .pulse-change.down { color: var(--down); }
    .pulse-change.flat { color: var(--ink-muted); }
    .pulse-error, .pulse-error-text {
      font-size: 12px;
      color: var(--ink-faint);
      grid-column: 1 / -1;
    }

    .mover-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .mover-card {
      background: var(--paper-raise) linear-gradient(var(--margin-red), var(--margin-red)) no-repeat 15px 0 / 1px 100%;
      border: 1px solid var(--rule-strong);
      border-radius: 3px;
      box-shadow: var(--shadow-paper);
      padding: 18px 18px 18px 28px;
      min-width: 0;
    }
    .mover-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-bottom: 10px;
    }
    .mover-ticker {
      font-family: var(--font-data);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .ticker-link { color: inherit; text-decoration: none; }
    .ticker-link:hover { color: var(--green-bright); }
    .mover-name {
      font-size: 12px;
      color: var(--ink-muted);
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .mover-price {
      font-family: var(--font-data);
      font-size: 24px;
      font-weight: 700;
      margin-top: 10px;
    }
    .mover-change {
      font-family: var(--font-data);
      font-size: 13px;
      font-weight: 700;
      margin-top: 4px;
    }
    .mover-change.up { color: var(--up); }
    .mover-change.down { color: var(--down); }
    .mover-empty-inline {
      font-size: 12px;
      color: var(--ink-faint);
      font-style: italic;
      padding-top: 4px;
    }
    .mover-empty {
      background: transparent;
      border: 1px dashed var(--rule-strong);
      border-radius: 3px;
      padding: 24px;
      text-align: center;
      color: var(--ink-muted);
      font-size: 14px;
    }

    @media (max-width: 480px) {
      .mover-grid { grid-template-columns: 1fr; }
      .pulse-grid { grid-template-columns: 1fr; }
    }

    .cta-watchlist {
      display: block;
      text-align: center;
      background: var(--green);
      color: #F3EEDF;
      text-decoration: none;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border-radius: 2px;
      padding: 15px 0;
      margin-top: 30px;
    }
    .cta-watchlist:hover { background: var(--green-bright); }

    .skel-pulse-card {
      background: var(--paper-raise);
      border: 1px solid var(--rule);
      border-radius: 3px;
      padding: 14px 16px;
      height: 66px;
    }
    .skel-line { height: 12px; margin-bottom: 8px; }
    .skel-mover-card {
      background: var(--paper-raise);
      border: 1px solid var(--rule);
      border-radius: 3px;
      padding: 18px;
      height: 96px;
    }
  </style>
</head>
<body>
  <div class="auth-screen" id="authScreen">
    <div class="auth-card">
      <div class="brand-row">
        <img src="/logo.svg" alt="" class="brand-mark" width="36" height="36" />
        <div>
          <div class="eyebrow">Private ledger</div>
          <h1>Trade Track</h1>
        </div>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLogin">Log in</button>
        <button class="auth-tab" id="tabSignup">Sign up</button>
      </div>

      <form id="authForm">
        <input type="text" id="authName" placeholder="First name" autocomplete="given-name" style="display:none" />
        <input type="email" id="authEmail" placeholder="Email" autocomplete="email" required />
        <input type="password" id="authPassword" placeholder="Password" autocomplete="current-password" required />
        <div class="auth-hint" id="authHint"></div>
        <div class="auth-msg" id="authMsg"></div>
        <button type="submit" class="btn-auth-submit" id="authSubmit">Log in</button>
      </form>
    </div>
  </div>

  <div class="app" id="appRoot" style="display:none;" data-display="flex">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img src="/logo.svg" alt="" class="brand-mark" width="32" height="32" />
        <div>
          <div class="eyebrow">Private ledger</div>
          <div class="sidebar-title">Trade Track</div>
        </div>
      </div>

      <nav class="side-nav">
        <a href="/" class="side-nav-link active">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Home
        </a>
        <a href="/watchlist.html" class="side-nav-link">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="19" x2="4" y2="10"/><line x1="10" y1="19" x2="10" y2="4"/><line x1="16" y1="19" x2="16" y2="14"/></svg>
          Watchlist
        </a>
        <a href="/articles.html" class="side-nav-link">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          Articles
        </a>
        <a href="/settings.html" class="side-nav-link">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Settings
        </a>
      </nav>

      <div class="account-block">
        <div class="account-row">
          <div class="account-avatar-wrap">
            <div class="account-avatar" id="accountAvatar">?</div>
            <div class="account-email" id="accountEmail">Loading…</div>
          </div>
        </div>
        <button class="btn-logout-full" id="logoutBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Log out
        </button>
      </div>
    </aside>

    <div class="main-content">
    <div class="greeting">
      <div class="greeting-text" id="greetingText">Welcome back</div>
      <div class="greeting-date" id="greetingDate"></div>
    </div>

    <div class="section-label">Market pulse</div>
    <div class="pulse-grid" id="pulseGrid">
      <div class="skel-pulse-card"><div class="skeleton skel-line" style="width:50%"></div><div class="skeleton skel-line" style="width:70%;height:18px"></div></div>
      <div class="skel-pulse-card"><div class="skeleton skel-line" style="width:50%"></div><div class="skeleton skel-line" style="width:70%;height:18px"></div></div>
      <div class="skel-pulse-card"><div class="skeleton skel-line" style="width:50%"></div><div class="skeleton skel-line" style="width:70%;height:18px"></div></div>
    </div>

    <div class="section-label">Today's movers</div>
    <div id="moverSpotlight">
      <div class="mover-grid">
        <div class="skel-mover-card"><div class="skeleton skel-line" style="width:40%"></div><div class="skeleton skel-line" style="width:60%;height:20px"></div></div>
        <div class="skel-mover-card"><div class="skeleton skel-line" style="width:40%"></div><div class="skeleton skel-line" style="width:60%;height:20px"></div></div>
      </div>
    </div>

    <a href="/watchlist.html" class="cta-watchlist">Go to your Watchlist →</a>
    </div>
  </div>

  <script src="/auth.js"></script>
  <script>
    AuthGuard.init(initHomePage);

    function esc(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // Accountant's convention: gains carry a plus sign, losses are
    // set in parentheses the way a ledger writes negatives — so the
    // direction is legible even before you register the ink color.
    function fmtPct(v) {
      const abs = Math.abs(v).toFixed(2);
      if (v < 0) return `(${abs}%)`;
      if (v > 0) return `+${abs}%`;
      return `${abs}%`;
    }

    function greetingByHour() {
      const h = new Date().getHours();
      if (h < 12) return 'Good morning';
      if (h < 18) return 'Good afternoon';
      return 'Good evening';
    }

    function initHomePage(email, name) {
      document.getElementById('greetingDate').textContent =
        new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });

      // Use the person's first name if they gave one at signup;
      // fall back to email if they didn't (e.g. existing accounts
      // created before the name field existed).
      const displayName = name || email;
      document.getElementById('greetingText').textContent = `${greetingByHour()}, ${displayName}`;

      loadPulse();
      loadMover();
    }

    async function loadPulse() {
      const grid = document.getElementById('pulseGrid');
      try {
        const res = await AuthGuard.fetch('/api/indexes');
        const data = await res.json();

        if (!res.ok) {
          grid.innerHTML = `<div class="pulse-error">${esc(data.error || 'Could not load market data')}</div>`;
          return;
        }

        const colorVar = { SPY: 'var(--brass)', DIA: 'var(--green)', QQQ: 'var(--ink)' };

        grid.innerHTML = data.indexes.map(idx => {
          if (idx.error) {
            return `
              <a href="/stock.html?t=${encodeURIComponent(idx.ticker)}" class="pulse-card" style="--idx-color:${colorVar[idx.ticker] || 'var(--brass)'}">
                <div class="pulse-label">${esc(idx.label)}</div>
                <div class="pulse-error-text">${esc(idx.error)}</div>
              </a>
            `;
          }
          const dir = idx.changePercent > 0 ? 'up' : idx.changePercent < 0 ? 'down' : 'flat';
          return `
            <a href="/stock.html?t=${encodeURIComponent(idx.ticker)}" class="pulse-card" style="--idx-color:${colorVar[idx.ticker] || 'var(--brass)'}">
              <div class="pulse-label">${esc(idx.label)}</div>
              <div class="pulse-price">$${idx.price.toFixed(2)}</div>
              <div class="pulse-change ${dir}">${fmtPct(idx.changePercent)}</div>
            </a>
          `;
        }).join('');
      } catch (err) {
        grid.innerHTML = '<div class="pulse-error">Could not reach the server</div>';
      }
    }

    async function loadMover() {
      const el = document.getElementById('moverSpotlight');
      try {
        const [wlRes, pxRes] = await Promise.all([
          AuthGuard.fetch('/api/watchlist'),
          AuthGuard.fetch('/api/prices'),
        ]);
        const wlData = await wlRes.json();
        const pxData = await pxRes.json();

        if (!wlRes.ok || !pxRes.ok) {
          el.innerHTML = '<div class="mover-empty">Could not load your watchlist</div>';
          return;
        }

        const validQuotes = (pxData.quotes || []).filter(q => !q.error && typeof q.changePercent === 'number');
        if (validQuotes.length === 0) {
          el.innerHTML = '<div class="mover-empty">Add stocks to your watchlist to see today\u2019s movers here</div>';
          return;
        }

        const nameFor = (ticker) => {
          const item = (wlData.items || []).find(i => i.ticker === ticker);
          return item && item.name ? item.name : '';
        };

        // Top gainer and top loser are two SEPARATE questions, not
        // opposite ends of one "biggest mover" — a watchlist that's
        // all green has no loser to show, and vice versa, so each
        // card handles its own empty case independently.
        const gainers = validQuotes.filter(q => q.changePercent > 0);
        const losers = validQuotes.filter(q => q.changePercent < 0);

        const topGainer = gainers.length
          ? gainers.reduce((max, q) => q.changePercent > max.changePercent ? q : max)
          : null;
        const topLoser = losers.length
          ? losers.reduce((min, q) => q.changePercent < min.changePercent ? q : min)
          : null;

        function moverCardHtml(q, dir, label) {
          if (!q) {
            return `
              <div class="mover-card">
                <div class="mover-label">${esc(label)}</div>
                <div class="mover-empty-inline">No ${label === 'Top gainer' ? 'gainers' : 'losers'} today</div>
              </div>
            `;
          }
          return `
            <div class="mover-card ${dir}">
              <div class="mover-label">${esc(label)}</div>
              <div class="mover-ticker"><a href="/stock.html?t=${encodeURIComponent(q.ticker)}" class="ticker-link">${esc(q.ticker)}</a></div>
              <div class="mover-name">${esc(nameFor(q.ticker))}</div>
              <div class="mover-price">$${q.price.toFixed(2)}</div>
              <div class="mover-change ${dir}">${fmtPct(q.changePercent)} today</div>
            </div>
          `;
        }

        el.innerHTML = `
          <div class="mover-grid">
            ${moverCardHtml(topGainer, 'up', 'Top gainer')}
            ${moverCardHtml(topLoser, 'down', 'Top loser')}
          </div>
        `;
      } catch (err) {
        el.innerHTML = '<div class="mover-empty">Could not reach the server</div>';
      }
    }
  </script>
</body>
