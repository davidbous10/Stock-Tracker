<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock Tracker</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0B1220;
      --surface: #131B2E;
      --surface-hover: #182240;
      --border: #232E47;
      --border-soft: #1B2438;
      --text: #EDF1F7;
      --text-muted: #7C8AA5;
      --text-faint: #4E5A75;
      --accent: #6C8EEF;
      --up: #3DDC97;
      --up-bg: #12271F;
      --down: #FF6B6B;
      --down-bg: #2B1A1E;

      --idx-dia: #B892FF;
      --idx-qqq: #4FD1E8;

      --font-ui: 'Inter', system-ui, sans-serif;
      --font-data: 'IBM Plex Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      display: flex;
      justify-content: center;
      padding: 48px 20px;
    }

    body { padding: 40px 24px; }

    .app {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      align-items: flex-start;
      gap: 32px;
    }

    .sidebar {
      width: 220px;
      flex-shrink: 0;
      position: sticky;
      top: 40px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }
    .sidebar-brand { display: flex; align-items: center; gap: 10px; }
    .sidebar-title { font-size: 16px; font-weight: 700; }

    .side-nav { display: flex; flex-direction: column; gap: 2px; }
    .side-nav-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 8px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }
    .side-nav-link svg { flex-shrink: 0; }
    .side-nav-link:hover { background: var(--surface-hover); color: var(--text); }
    .side-nav-link.active { background: var(--surface); color: var(--text); }

    .account-block {
      margin-top: auto;
      padding-top: 20px;
      border-top: 1px solid var(--border-soft);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .account-row { display: flex; align-items: center; }
    .account-avatar-wrap { position: relative; display: inline-flex; }
    .account-avatar {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-data);
      font-weight: 700;
      font-size: 13px;
      color: #0B1220;
      flex-shrink: 0;
      cursor: default;
    }
    .account-email {
      position: absolute;
      left: calc(100% + 10px);
      top: 50%;
      transform: translateY(-50%);
      background: var(--surface-hover);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 7px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
      z-index: 20;
    }
    .account-avatar-wrap:hover .account-email { opacity: 1; }
    .btn-logout-full {
      display: flex;
      align-items: center;
      gap: 8px;
      background: none;
      border: 1px solid var(--border);
      color: var(--text-faint);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      font-family: var(--font-ui);
      cursor: pointer;
    }
    .btn-logout-full:hover { border-color: var(--down); color: var(--down); }

    .main-content { flex: 1; min-width: 0; }

    @media (max-width: 800px) {
      .app { flex-direction: column; }
      .sidebar {
        width: 100%;
        position: static;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .side-nav { flex-direction: row; }
      .account-block {
        margin-top: 0;
        padding-top: 0;
        border-top: none;
        flex-direction: row;
      }
      .account-email { display: none; }
    }

    .site-nav {
      display: flex;
      gap: 4px;
      margin-bottom: 20px;
    }
    .site-nav a {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-faint);
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 7px;
    }
    .site-nav a:hover { color: var(--text-muted); }
    .site-nav a.active { background: var(--surface); color: var(--text); }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    .brand-row > div:nth-child(2) { flex: 1; }
    .brand-mark { border-radius: 8px; flex-shrink: 0; }

    .eyebrow {
      font-family: var(--font-data);
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 6px;
    }
    h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }

    .btn-logout {
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: 1px solid var(--border);
      color: var(--text-faint);
      border-radius: 8px;
      width: 32px;
      height: 32px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .btn-logout:hover { border-color: var(--down); color: var(--down); }

    .auth-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card {
      width: 100%;
      max-width: 360px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 28px;
    }
    .auth-card .brand-row { margin-bottom: 24px; }
    .auth-tabs {
      display: flex;
      gap: 4px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 20px;
    }
    .auth-tab {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-muted);
      font-family: var(--font-ui);
      font-size: 13px;
      font-weight: 600;
      padding: 8px 0;
      border-radius: 7px;
      cursor: pointer;
    }
    .auth-tab.active { background: var(--surface-hover); color: var(--text); }
    #authForm { display: flex; flex-direction: column; gap: 10px; }
    #authForm input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px 14px;
      color: var(--text);
      font-size: 14px;
      font-family: var(--font-ui);
      outline: none;
    }
    #authForm input:focus { border-color: var(--accent); }
    .auth-hint { font-size: 11px; color: var(--text-faint); margin-top: -4px; }
    .auth-msg { font-size: 13px; color: var(--down); min-height: 16px; }
    .btn-auth-submit {
      background: var(--accent);
      color: #0B1220;
      border: none;
      border-radius: 8px;
      padding: 12px 0;
      font-size: 14px;
      font-weight: 700;
      font-family: var(--font-ui);
      cursor: pointer;
      margin-top: 6px;
    }
    .btn-auth-submit:hover { opacity: 0.9; }
    .btn-auth-submit:disabled { opacity: 0.6; cursor: default; }

    .section-label {
      font-family: var(--font-data);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-faint);
      margin: 28px 0 12px;
    }
    .section-label:first-of-type { margin-top: 0; }

    .greeting-text { font-size: 20px; font-weight: 700; }
    .greeting-date { font-size: 13px; color: var(--text-muted); margin-top: 3px; }

    .pulse-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .pulse-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 3px solid var(--idx-color, var(--accent));
      border-radius: 12px;
      padding: 14px 16px;
    }
    .pulse-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 8px;
      white-space: nowrap;
    }
    .pulse-price {
      font-family: var(--font-data);
      font-size: 17px;
      font-weight: 700;
    }
    .pulse-change {
      font-family: var(--font-data);
      font-size: 12px;
      font-weight: 600;
      margin-top: 4px;
    }
    .pulse-change.up { color: var(--up); }
    .pulse-change.down { color: var(--down); }
    .pulse-change.flat { color: var(--text-muted); }
    .pulse-error, .pulse-error-text {
      font-size: 12px;
      color: var(--text-faint);
      grid-column: 1 / -1;
    }

    .mover-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--border);
      border-radius: 14px;
      padding: 20px;
    }
    .mover-card.up { border-left-color: var(--up); }
    .mover-card.down { border-left-color: var(--down); }
    .mover-ticker {
      font-family: var(--font-data);
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .mover-name { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
    .mover-price {
      font-family: var(--font-data);
      font-size: 30px;
      font-weight: 700;
      margin-top: 12px;
    }
    .mover-change {
      font-family: var(--font-data);
      font-size: 14px;
      font-weight: 600;
      margin-top: 4px;
    }
    .mover-change.up { color: var(--up); }
    .mover-change.down { color: var(--down); }
    .mover-empty {
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 14px;
      padding: 24px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
    }

    .cta-watchlist {
      display: block;
      text-align: center;
      background: var(--accent);
      color: #0B1220;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      border-radius: 10px;
      padding: 14px 0;
      margin-top: 28px;
    }
    .cta-watchlist:hover { opacity: 0.9; }

    @media (max-width: 480px) {
      .pulse-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="auth-screen" id="authScreen">
    <div class="auth-card">
      <div class="brand-row">
        <img src="/logo.svg" alt="" class="brand-mark" width="36" height="36" />
        <div>
          <div class="eyebrow">Personal terminal</div>
          <h1>Stock Tracker</h1>
        </div>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLogin">Log in</button>
        <button class="auth-tab" id="tabSignup">Sign up</button>
      </div>

      <form id="authForm">
        <input type="email" id="authEmail" placeholder="Email" autocomplete="email" required />
        <input type="password" id="authPassword" placeholder="Password" autocomplete="current-password" required />
        <div class="auth-hint" id="authHint"></div>
        <div class="auth-msg" id="authMsg"></div>
        <button type="submit" class="btn-auth-submit" id="authSubmit">Log in</button>
      </form>
    </div>
  </div>

  <div class="app" id="appRoot" style="display:none;" data-display="flex">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img src="/logo.svg" alt="" class="brand-mark" width="32" height="32" />
        <div>
          <div class="eyebrow">Personal terminal</div>
          <div class="sidebar-title">Stock Tracker</div>
        </div>
      </div>

      <nav class="side-nav">
        <a href="/" class="side-nav-link active">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Home
        </a>
        <a href="/watchlist.html" class="side-nav-link">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="19" x2="4" y2="10"/><line x1="10" y1="19" x2="10" y2="4"/><line x1="16" y1="19" x2="16" y2="14"/></svg>
          Watchlist
        </a>
        <a href="/settings.html" class="side-nav-link">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Settings
        </a>
      </nav>

      <div class="account-block">
        <div class="account-row">
          <div class="account-avatar-wrap">
            <div class="account-avatar" id="accountAvatar">?</div>
            <div class="account-email" id="accountEmail">Loading…</div>
          </div>
        </div>
        <button class="btn-logout-full" id="logoutBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Log out
        </button>
      </div>
    </aside>

    <div class="main-content">
    <div class="greeting">
      <div class="greeting-text" id="greetingText">Welcome back</div>
      <div class="greeting-date" id="greetingDate"></div>
    </div>

    <div class="section-label">Market pulse</div>
    <div class="pulse-grid" id="pulseGrid">
      <div class="pulse-error">Loading…</div>
    </div>

    <div class="section-label">Today's biggest mover</div>
    <div id="moverSpotlight">
      <div class="mover-empty">Loading…</div>
    </div>

    <a href="/watchlist.html" class="cta-watchlist">Go to your Watchlist →</a>
    </div>
  </div>

  <script src="/auth.js"></script>
  <script>
    AuthGuard.init(initHomePage);

    function esc(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function greetingByHour() {
      const h = new Date().getHours();
      if (h < 12) return 'Good morning';
      if (h < 18) return 'Good afternoon';
      return 'Good evening';
    }

    function initHomePage(email) {
      document.getElementById('greetingDate').textContent =
        new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });

      // AuthGuard already confirmed we're logged in and knows the
      // email (it just used it to fill in the sidebar) — reusing it
      // here means one less network round trip just for a greeting.
      document.getElementById('greetingText').textContent = `${greetingByHour()}, ${email}`;

      loadPulse();
      loadMover();
    }

    async function loadPulse() {
      const grid = document.getElementById('pulseGrid');
      try {
        const res = await fetch('/api/indexes');
        const data = await res.json();

        if (!res.ok) {
          grid.innerHTML = `<div class="pulse-error">${esc(data.error || 'Could not load market data')}</div>`;
          return;
        }

        const colorVar = { SPY: 'var(--accent)', DIA: 'var(--idx-dia)', QQQ: 'var(--idx-qqq)' };

        grid.innerHTML = data.indexes.map(idx => {
          if (idx.error) {
            return `
              <div class="pulse-card" style="--idx-color:${colorVar[idx.ticker] || 'var(--accent)'}">
                <div class="pulse-label">${esc(idx.label)}</div>
                <div class="pulse-error-text">${esc(idx.error)}</div>
              </div>
            `;
          }
          const dir = idx.changePercent > 0 ? 'up' : idx.changePercent < 0 ? 'down' : 'flat';
          const sign = idx.changePercent > 0 ? '+' : '';
          return `
            <div class="pulse-card" style="--idx-color:${colorVar[idx.ticker] || 'var(--accent)'}">
              <div class="pulse-label">${esc(idx.label)}</div>
              <div class="pulse-price">$${idx.price.toFixed(2)}</div>
              <div class="pulse-change ${dir}">${sign}${idx.changePercent.toFixed(2)}%</div>
            </div>
          `;
        }).join('');
      } catch (err) {
        grid.innerHTML = '<div class="pulse-error">Could not reach the server</div>';
      }
    }

    async function loadMover() {
      const el = document.getElementById('moverSpotlight');
      try {
        const [wlRes, pxRes] = await Promise.all([fetch('/api/watchlist'), fetch('/api/prices')]);
        const wlData = await wlRes.json();
        const pxData = await pxRes.json();

        if (!wlRes.ok || !pxRes.ok) {
          el.innerHTML = '<div class="mover-empty">Could not load your watchlist</div>';
          return;
        }

        const validQuotes = (pxData.quotes || []).filter(q => !q.error && typeof q.changePercent === 'number');
        if (validQuotes.length === 0) {
          el.innerHTML = '<div class="mover-empty">Add stocks to your watchlist to see today\u2019s biggest mover here</div>';
          return;
        }

        const biggest = validQuotes.reduce((max, q) =>
          Math.abs(q.changePercent) > Math.abs(max.changePercent) ? q : max
        );

        const item = (wlData.items || []).find(i => i.ticker === biggest.ticker);
        const dir = biggest.changePercent >= 0 ? 'up' : 'down';
        const sign = biggest.changePercent > 0 ? '+' : '';

        el.innerHTML = `
          <div class="mover-card ${dir}">
            <div class="mover-ticker">${esc(biggest.ticker)}</div>
            <div class="mover-name">${item && item.name ? esc(item.name) : ''}</div>
            <div class="mover-price">$${biggest.price.toFixed(2)}</div>
            <div class="mover-change ${dir}">${sign}${biggest.changePercent.toFixed(2)}% today</div>
          </div>
        `;
      } catch (err) {
        el.innerHTML = '<div class="mover-empty">Could not reach the server</div>';
      }
    }
  </script>
</body>
</html>
