<!DOCTYPE html>
<html lang="en" style="background:#F3EEDF">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Compare Stocks | Trade Track</title>
  <meta name="description" content="Compare stocks side by side with Trade Track." />
  <meta name="theme-color" content="#17442F" />
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="/logo-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Archivo:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* paper */
      --paper: #F3EEDF;
      --paper-raise: #FBF7EB;
      --paper-bright: #FFFDF4;
      --paper-sunken: #ECE5D0;
      /* ink */
      --ink: #23281F;
      --ink-muted: #686C5B;
      --ink-faint: #9A9C8B;
      /* rules (the printed lines of ledger paper) */
      --rule: #DDD5BE;
      --rule-strong: #C6BEA2;
      --margin-red: #C05A50;
      /* the bank */
      --green: #17442F;
      --green-deep: #0F3323;
      --green-bright: #1E5C3D;
      --brass: #A97F2F;
      --brass-soft: #C9A75C;
      /* money */
      --up: #1D6A43;
      --up-bg: #E3EBDA;
      --down: #8C2F2B;
      --down-bg: #F1E0D8;
      /* type */
      --font-display: 'Marcellus', 'Georgia', serif;
      --font-ui: 'Archivo', system-ui, sans-serif;
      --font-data: 'Courier Prime', 'Courier New', monospace;
      --shadow-paper: 0 1px 0 rgba(35,40,31,0.05), 0 8px 22px rgba(35,40,31,0.08);
      /* legacy aliases so any straggler rule still resolves */
      --text: var(--ink);
      --text-muted: var(--ink-muted);
      --text-faint: var(--ink-faint);
      --border: var(--rule-strong);
      --border-soft: var(--rule);
      --surface: var(--paper-raise);
      --surface-hover: var(--paper-bright);
      --accent: var(--brass);
      --bg: var(--paper);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-ui);
      display: flex;
      justify-content: center;
      padding: 40px 24px;
    }

    a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid var(--brass);
      outline-offset: 2px;
    }

    .app {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      align-items: flex-start;
      gap: 34px;
    }

    /* ---- Sidebar: the ledger's cover ---- */
    .sidebar {
      width: 232px;
      flex-shrink: 0;
      position: sticky;
      top: 40px;
      display: flex;
      flex-direction: column;
      gap: 26px;
      background: var(--green);
      border: 1px solid var(--green-deep);
      border-radius: 4px;
      padding: 22px 16px;
      box-shadow: var(--shadow-paper);
      color: #EFE9D4;
    }
    .sidebar-brand { display: flex; align-items: center; gap: 11px; }
    .sidebar-title {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 400;
      letter-spacing: 0.02em;
      color: #F3EEDF;
    }
    .sidebar .eyebrow { color: var(--brass-soft); }

    .side-nav { display: flex; flex-direction: column; gap: 2px; }
    .side-nav-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 3px;
      color: #B9C1AC;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.01em;
    }
    .side-nav-link svg { flex-shrink: 0; }
    .side-nav-link:hover { background: rgba(243,238,223,0.08); color: #F3EEDF; }
    .side-nav-link.active {
      background: rgba(15,51,35,0.85);
      color: #F3EEDF;
      box-shadow: inset 2px 0 0 var(--brass-soft);
    }

    .account-block {
      margin-top: auto;
      padding-top: 18px;
      border-top: 1px solid rgba(243,238,223,0.16);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .account-row { display: flex; align-items: center; }
    .account-avatar-wrap { position: relative; display: inline-flex; }
    .account-avatar {
      width: 32px;
      height: 32px;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-data);
      font-weight: 700;
      font-size: 13px;
      color: #F3EEDF;
      border: 1px solid rgba(243,238,223,0.25);
      flex-shrink: 0;
      cursor: default;
    }
    .account-email {
      position: absolute;
      left: calc(100% + 10px);
      top: 50%;
      transform: translateY(-50%);
      background: var(--green-deep);
      border: 1px solid rgba(201,167,92,0.5);
      color: #F3EEDF;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 3px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
      z-index: 20;
    }
    .account-avatar-wrap:hover .account-email { opacity: 1; }
    .btn-logout-full {
      display: flex;
      align-items: center;
      gap: 8px;
      background: none;
      border: 1px solid rgba(243,238,223,0.25);
      color: #B9C1AC;
      border-radius: 3px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      font-family: var(--font-ui);
      cursor: pointer;
    }
    .btn-logout-full:hover { border-color: #D99C92; color: #F1D8D2; }

    .main-content { flex: 1; min-width: 0; }

    @media (max-width: 800px) {
      .app { flex-direction: column; }
      .sidebar {
        width: 100%;
        position: static;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px;
      }
      .side-nav { flex-direction: row; }
      .account-block {
        margin-top: 0;
        padding-top: 0;
        border-top: none;
        flex-direction: row;
      }
      .account-email { display: none; }
    }

    /* ---- Shared identity bits ---- */
    .brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    .brand-row > div:nth-child(2) { flex: 1; }
    .brand-mark { border-radius: 4px; flex-shrink: 0; }

    .eyebrow {
      font-family: var(--font-ui);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--brass);
      margin-bottom: 5px;
    }
    h1 {
      font-family: var(--font-display);
      font-weight: 400;
      letter-spacing: 0.01em;
    }

    /* ---- Auth screen: the certificate ---- */
    .auth-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card {
      width: 100%;
      max-width: 380px;
      background: var(--paper-raise);
      border: 1px solid var(--rule-strong);
      border-radius: 3px;
      padding: 38px 34px;
      box-shadow: var(--shadow-paper);
      position: relative;
    }
    .auth-card::before {
      content: '';
      position: absolute;
      inset: 8px;
      border: 1px solid var(--brass-soft);
      border-radius: 2px;
      pointer-events: none;
      opacity: 0.75;
    }
    .auth-card .brand-row { margin-bottom: 26px; }
    .auth-card h1 { font-size: 27px; }

    .auth-tabs {
      display: flex;
      gap: 4px;
      background: var(--paper-sunken);
      border: 1px solid var(--rule);
      border-radius: 3px;
      padding: 4px;
      margin-bottom: 20px;
      position: relative;
    }
    .auth-tab {
      flex: 1;
      background: none;
      border: none;
      color: var(--ink-muted);
      font-family: var(--font-ui);
      font-size: 13px;
      font-weight: 600;
      padding: 8px 0;
      border-radius: 2px;
      cursor: pointer;
    }
    .auth-tab.active { background: var(--green); color: #F3EEDF; }

    #authForm { display: flex; flex-direction: column; gap: 10px; position: relative; }
    #authForm input {
      width: 100%;
      background: var(--paper-bright);
      border: 1px solid var(--rule-strong);
      border-radius: 2px;
      padding: 11px 14px;
      color: var(--ink);
      font-size: 14px;
      font-family: var(--font-ui);
      outline: none;
    }
    #authForm input:focus { border-color: var(--green); }
    .auth-hint { font-size: 11px; color: var(--ink-faint); margin-top: -4px; }
    .auth-msg { font-size: 13px; color: var(--down); min-height: 16px; }
    .btn-auth-submit {
      background: var(--green);
      color: #F3EEDF;
      border: none;
      border-radius: 2px;
      padding: 12px 0;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-family: var(--font-ui);
      cursor: pointer;
      margin-top: 6px;
    }
    .btn-auth-submit:hover { background: var(--green-bright); }
    .btn-auth-submit:disabled { opacity: 0.6; cursor: default; }

    /* ---- Section headings: ledger column heads ---- */
    .section-label {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: var(--font-ui);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin: 30px 0 12px;
    }
    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--rule-strong);
    }
    .section-label:first-of-type { margin-top: 0; }

    /* ---- Skeleton loading on paper ---- */
    .skeleton {
      background: linear-gradient(90deg, #E9E1CB 25%, #DFD6BD 37%, #E9E1CB 63%);
      background-size: 400% 100%;
      animation: shimmer 1.6s ease infinite;
      border-radius: 2px;
    }
    @keyframes shimmer {
      0% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .skeleton { animation: none; }
    }

    /* ---- Articles ---- */
    .page-title { font-family: var(--font-display); font-size: 24px; }
    .page-subtitle {
      font-family: var(--font-data);
      font-size: 13px;
      color: var(--ink-muted);
      margin-top: 4px;
    }

    .featured-card {
      display: flex;
      gap: 0;
      background: var(--paper-raise) linear-gradient(var(--margin-red), var(--margin-red)) no-repeat 15px 0 / 1px 100%;
      border: 1px solid var(--rule-strong);
      border-radius: 3px;
      box-shadow: var(--shadow-paper);
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      margin-bottom: 12px;
    }
    .featured-card:hover { border-color: var(--brass-soft); }
    .featured-img {
      width: 260px;
      flex-shrink: 0;
      object-fit: cover;
      background: var(--paper-sunken);
      border-right: 1px solid var(--rule);
      display: block;
      filter: sepia(0.14) saturate(0.92);
    }
    .featured-body { padding: 18px 20px 18px 24px; min-width: 0; display: flex; flex-direction: column; }
    .featured-headline {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 400;
      line-height: 1.3;
      margin-bottom: 8px;
    }
    .featured-summary {
      font-size: 13px;
      color: var(--ink-muted);
      line-height: 1.55;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .news-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .news-card {
      display: flex;
      gap: 14px;
      background: var(--paper-raise) linear-gradient(var(--margin-red), var(--margin-red)) no-repeat 15px 0 / 1px 100%;
      border: 1px solid var(--rule-strong);
      border-radius: 3px;
      box-shadow: var(--shadow-paper);
      padding: 14px 14px 14px 24px;
      text-decoration: none;
      color: inherit;
      min-width: 0;
    }
    .news-card:hover { border-color: var(--brass-soft); }
    .news-thumb {
      width: 74px;
      height: 74px;
      border-radius: 2px;
      border: 1px solid var(--rule);
      object-fit: cover;
      flex-shrink: 0;
      background: var(--paper-sunken);
      display: block;
      filter: sepia(0.14) saturate(0.92);
    }
    .news-card-body { min-width: 0; }
    .news-headline {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .news-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      color: var(--ink-faint);
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .news-meta .src {
      color: var(--brass);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .news-meta .dot { flex-shrink: 0; }
    .news-meta .when { flex-shrink: 0; font-family: var(--font-data); font-size: 11px; }

    .ticker-group {
      background: var(--paper-raise) linear-gradient(var(--margin-red), var(--margin-red)) no-repeat 15px 0 / 1px 100%;
      border: 1px solid var(--rule-strong);
      border-radius: 3px;
      box-shadow: var(--shadow-paper);
      padding: 16px 18px 16px 26px;
      margin-bottom: 12px;
    }
    .ticker-group-head {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 4px;
    }
    .ticker-group-symbol {
      font-family: var(--font-data);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .ticker-group-name {
      font-size: 12px;
      color: var(--ink-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    .ticker-article {
      display: block;
      padding: 10px 0;
      border-top: 1px solid var(--rule);
      text-decoration: none;
      color: inherit;
    }
    .ticker-group .ticker-article:first-of-type { border-top: none; margin-top: 6px; }
    .ticker-article:hover .ticker-article-headline { color: var(--green-bright); }
    .ticker-article-headline {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.45;
    }
    .ticker-article .news-meta { margin-bottom: 3px; }
    .ticker-no-news {
      font-size: 12px;
      color: var(--ink-faint);
      font-style: italic;
      padding: 8px 0 2px;
    }

    .feed-empty {
      background: transparent;
      border: 1px dashed var(--rule-strong);
      border-radius: 3px;
      padding: 24px;
      text-align: center;
      color: var(--ink-muted);
      font-size: 14px;
    }
    .feed-empty a { color: var(--green); font-weight: 600; }

    .btn-save {
      background: none; border: none; color: var(--ink-faint);
      cursor: pointer; padding: 4px; flex-shrink: 0; border-radius: 2px;
    }
    .btn-save:hover { color: var(--brass); }
    .btn-save.saved { color: var(--brass); }

    .featured-card { position: relative; }
    .featured-card .btn-save { position: absolute; top: 10px; right: 10px; }
    .news-card { position: relative; }
    .news-card .btn-save { position: absolute; top: 8px; right: 8px; }
    .ticker-article { position: relative; }
    .ticker-article .btn-save { position: absolute; top: 10px; right: 0; }

    .saved-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 0; border-bottom: 1px solid var(--rule);
    }
    .saved-item:last-child { border-bottom: none; }
    .saved-item-body { flex: 1; min-width: 0; }
    .saved-item-link { text-decoration: none; color: inherit; }
    .saved-item-link:hover .saved-item-headline { color: var(--green-bright); }
    .saved-item-headline { font-size: 13px; font-weight: 600; line-height: 1.4; }

    .refresh-btn {
      background: none; border: 1px solid var(--rule-strong);
      color: var(--ink-muted); border-radius: 2px;
      padding: 8px 14px; font-size: 12px;
      font-family: var(--font-ui); font-weight: 600; cursor: pointer;
    }
    .refresh-btn:hover { border-color: var(--green); color: var(--ink); }

    .skel-featured {
      background: var(--paper-raise);
      border: 1px solid var(--rule);
      border-radius: 3px;
      height: 140px;
      margin-bottom: 12px;
      padding: 18px 20px;
    }
    .skel-news-card {
      background: var(--paper-raise);
      border: 1px solid var(--rule);
      border-radius: 3px;
      padding: 14px;
      height: 102px;
    }
    .skel-line { height: 12px; margin-bottom: 8px; }

    @media (max-width: 640px) {
      .news-grid { grid-template-columns: 1fr; }
      .featured-card { flex-direction: column; }
      .featured-img { width: 100%; height: 150px; border-right: none; border-bottom: 1px solid var(--rule); }
    }

    /* ---- Mobile bottom tab bar ---- */
    .bottom-tabs {
      display: none;
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--green); border-top: 1px solid var(--green-deep);
      z-index: 100; padding: 6px 0 env(safe-area-inset-bottom, 6px);
    }
    .bottom-tabs nav {
      display: flex; justify-content: space-around; align-items: center;
    }
    .tab-link {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      text-decoration: none; color: #B9C1AC; font-size: 10px; font-weight: 600;
      padding: 4px 8px; letter-spacing: 0.02em;
    }
    .tab-link:hover, .tab-link.active { color: #F3EEDF; }
    .tab-link.active svg { stroke: var(--brass-soft); }

    @media (max-width: 800px) {
      .sidebar { display: none !important; }
      .bottom-tabs { display: block; }
      .app { padding-bottom: 72px; }
      body { padding: 20px 16px 0; }
    }

  

    .page-title { font-family: var(--font-display); font-size: 24px; }
    .page-subtitle { font-family: var(--font-data); font-size: 13px; color: var(--ink-muted); margin-top: 4px; }
    .compare-input-row { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; flex-wrap: wrap; }
    .compare-input {
      flex: 1; min-width: 120px; padding: 10px 14px;
      background: var(--paper-bright); border: 1px solid var(--rule-strong);
      border-radius: 2px; font-family: var(--font-data); font-size: 14px;
      color: var(--ink); outline: none; text-transform: uppercase;
    }
    .compare-input:focus { border-color: var(--green); }
    .compare-vs { font-family: var(--font-display); font-size: 16px; color: var(--ink-faint); }
    .compare-btn {
      background: var(--green); color: #F3EEDF; border: none; border-radius: 2px;
      padding: 10px 20px; font-size: 12px; font-weight: 700;
      letter-spacing: 0.04em; text-transform: uppercase;
      font-family: var(--font-ui); cursor: pointer;
    }
    .compare-btn:hover { background: var(--green-bright); }
    .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .compare-card {
      background: var(--paper-raise) linear-gradient(var(--margin-red), var(--margin-red)) no-repeat 15px 0 / 1px 100%;
      border: 1px solid var(--rule-strong); border-radius: 3px; box-shadow: var(--shadow-paper);
      padding: 18px 20px 18px 28px;
    }
    .compare-card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .compare-ticker { font-family: var(--font-data); font-size: 20px; font-weight: 700; }
    .compare-name { font-size: 13px; color: var(--ink-muted); }
    .compare-price { font-family: var(--font-data); font-size: 26px; font-weight: 700; }
    .compare-change { font-family: var(--font-data); font-size: 13px; font-weight: 700; display: inline-block; padding: 2px 8px; border-radius: 2px; margin-top: 4px; }
    .compare-change.up { color: var(--up); background: var(--up-bg); }
    .compare-change.down { color: var(--down); background: var(--down-bg); }
    .compare-chart { width: 100%; height: 80px; margin: 14px 0; }
    .compare-metrics { margin-top: 12px; }
    .cm-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--rule); font-size: 12px; }
    .cm-row:last-child { border-bottom: none; }
    .cm-label { color: var(--ink-muted); }
    .cm-value { font-family: var(--font-data); font-weight: 700; }
    .cm-value.winner { color: var(--up); }
    .verdict-card {
      grid-column: 1 / -1;
      background: var(--paper-raise); border: 1px solid var(--rule-strong);
      border-radius: 3px; box-shadow: var(--shadow-paper);
      padding: 18px 20px; margin-top: 4px; text-align: center;
    }
    .verdict-title { font-family: var(--font-display); font-size: 18px; margin-bottom: 8px; }
    .verdict-text { font-size: 13px; color: var(--ink-muted); line-height: 1.6; }
    .compare-empty { text-align: center; padding: 40px; color: var(--ink-muted); font-size: 14px; }
    @media (max-width: 640px) { .compare-grid { grid-template-columns: 1fr; } }

  </style>
</head>
<body>
  <div class="auth-screen" id="authScreen" style="display:none">
    <div class="auth-card">
      <div class="brand-row">
        <img src="/logo.svg" alt="" class="brand-mark" width="36" height="36" />
        <div>
          <div class="eyebrow">Private ledger</div>
          <h1>Trade Track</h1>
        </div>
      </div>

        <input type="text" class="compare-input" id="stockA" placeholder="AAPL" maxlength="10" />
        <span class="compare-vs">vs</span>
        <input type="text" class="compare-input" id="stockB" placeholder="MSFT" maxlength="10" />
        <button class="compare-btn" onclick="runCompare()">Compare</button>

  <script src="/auth.js"></script>
  <script src="/chat.js"></script>
  <script>
    AuthGuard.init(function () {
      var params = new URLSearchParams(window.location.search);
      var stocks = params.get('stocks');
      if (stocks) {
        var parts = stocks.split(',');
        if (parts.length >= 2) {
          document.getElementById('stockA').value = parts[0].trim();
          document.getElementById('stockB').value = parts[1].trim();
          runCompare();
        }
      }
    });

    function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
    function fmtPct(v) { var abs = Math.abs(v).toFixed(2); if (v < 0) return '(' + abs + '%)'; if (v > 0) return '+' + abs + '%'; return abs + '%'; }

    async function fetchData(ticker) {
      var [quoteRes, profileRes, recRes] = await Promise.all([
        AuthGuard.fetch('/api/stock/' + encodeURIComponent(ticker) + '/quote'),
        AuthGuard.fetch('/api/stock/' + encodeURIComponent(ticker) + '/profile'),
        AuthGuard.fetch('/api/stock/' + encodeURIComponent(ticker) + '/recommendation'),
      ]);
      return {
        quote: await quoteRes.json(),
        profile: await profileRes.json(),
        rec: await recRes.json(),
      };
    }

    async function runCompare() {
      var a = document.getElementById('stockA').value.trim().toUpperCase();
      var b = document.getElementById('stockB').value.trim().toUpperCase();
      if (!a || !b) return;

      var el = document.getElementById('compareResults');
      el.innerHTML = '<div class="compare-empty">Loading...</div>';

      // Update URL
      history.replaceState(null, '', '/compare.html?stocks=' + a + ',' + b);
      document.title = a + ' vs ' + b + ' | Trade Track';

      try {
        var [dataA, dataB] = await Promise.all([fetchData(a), fetchData(b)]);
        renderComparison(a, dataA, b, dataB);
      } catch (err) {
        el.innerHTML = '<div class="compare-empty">Could not load data. Check the tickers and try again.</div>';
      }
    }

    function metricRow(label, valA, valB, higherIsWinner) {
      var numA = parseFloat(valA);
      var numB = parseFloat(valB);
      var winA = '', winB = '';
      if (!isNaN(numA) && !isNaN(numB) && numA !== numB) {
        if (higherIsWinner) { if (numA > numB) winA = ' winner'; else winB = ' winner'; }
        else { if (numA < numB) winA = ' winner'; else winB = ' winner'; }
      }
      return '<div class="cm-row"><span class="cm-label">' + label + '</span></div>' +
        '<div class="cm-row" style="border-bottom:1px solid var(--rule)"><span class="cm-value' + winA + '">' + valA + '</span><span class="cm-value' + winB + '">' + valB + '</span></div>';
    }

    function renderComparison(tickerA, dataA, tickerB, dataB) {
      var el = document.getElementById('compareResults');
      var qA = dataA.quote, pA = dataA.profile, rA = dataA.rec;
      var qB = dataB.quote, pB = dataB.profile, rB = dataB.rec;

      var dirA = qA.changePercent > 0 ? 'up' : qA.changePercent < 0 ? 'down' : 'flat';
      var dirB = qB.changePercent > 0 ? 'up' : qB.changePercent < 0 ? 'down' : 'flat';

      // Analyst score (higher = more bullish)
      function analystScore(r) {
        if (!r || !r.available) return null;
        var total = r.strongBuy + r.buy + r.hold + r.sell + r.strongSell;
        if (total === 0) return null;
        return ((r.strongBuy * 5 + r.buy * 4 + r.hold * 3 + r.sell * 2 + r.strongSell * 1) / total).toFixed(2);
      }

      var scoreA = analystScore(rA);
      var scoreB = analystScore(rB);
      var scoreLabel = function(s) { if (!s) return 'N/A'; if (s >= 4) return 'Strong Buy (' + s + ')'; if (s >= 3.5) return 'Buy (' + s + ')'; if (s >= 2.5) return 'Hold (' + s + ')'; return 'Sell (' + s + ')'; };

      // Verdict
      var wins = { a: 0, b: 0 };
      function track(a, b, higherWins) {
        var na = parseFloat(a), nb = parseFloat(b);
        if (isNaN(na) || isNaN(nb)) return;
        if (higherWins ? na > nb : na < nb) wins.a++; else if (higherWins ? nb > na : nb < na) wins.b++;
      }
      track(qA.changePercent, qB.changePercent, true);
      track(pA.marketCap, pB.marketCap, true);
      if (scoreA && scoreB) track(scoreA, scoreB, true);

      var verdictText = '';
      if (wins.a > wins.b) verdictText = tickerA + ' shows stronger signals across more metrics. But always do your own research before making a decision.';
      else if (wins.b > wins.a) verdictText = tickerB + ' shows stronger signals across more metrics. But always do your own research before making a decision.';
      else verdictText = 'Both stocks show comparable signals. It depends on your investment thesis and risk tolerance.';

      el.innerHTML = '<div class="compare-grid">' +
        '<div class="compare-card">' +
          '<div class="compare-card-head"><div><div class="compare-ticker"><a href="/stock.html?t=' + tickerA + '" style="color:inherit;text-decoration:none">' + esc(tickerA) + '</a></div><div class="compare-name">' + esc(pA.name || tickerA) + '</div></div></div>' +
          '<div class="compare-price">$' + (qA.price ? qA.price.toFixed(2) : '-') + '</div>' +
          '<div class="compare-change ' + dirA + '">' + fmtPct(qA.changePercent || 0) + '</div>' +
          '<div class="compare-metrics">' +
            '<div class="cm-row"><span class="cm-label">Industry</span><span class="cm-value">' + esc(pA.industry || 'N/A') + '</span></div>' +
            '<div class="cm-row"><span class="cm-label">Market cap</span><span class="cm-value">' + (pA.marketCap ? '$' + (pA.marketCap / 1e6).toFixed(2) + 'T' : 'N/A') + '</span></div>' +
            '<div class="cm-row"><span class="cm-label">52w high</span><span class="cm-value">' + (pA.weekHigh52 ? '$' + parseFloat(pA.weekHigh52).toFixed(2) : 'N/A') + '</span></div>' +
            '<div class="cm-row"><span class="cm-label">52w low</span><span class="cm-value">' + (pA.weekLow52 ? '$' + parseFloat(pA.weekLow52).toFixed(2) : 'N/A') + '</span></div>' +
            '<div class="cm-row"><span class="cm-label">Analyst rating</span><span class="cm-value">' + scoreLabel(scoreA) + '</span></div>' +
          '</div>' +
        '</div>' +
        '<div class="compare-card">' +
          '<div class="compare-card-head"><div><div class="compare-ticker"><a href="/stock.html?t=' + tickerB + '" style="color:inherit;text-decoration:none">' + esc(tickerB) + '</a></div><div class="compare-name">' + esc(pB.name || tickerB) + '</div></div></div>' +
          '<div class="compare-price">$' + (qB.price ? qB.price.toFixed(2) : '-') + '</div>' +
          '<div class="compare-change ' + dirB + '">' + fmtPct(qB.changePercent || 0) + '</div>' +
          '<div class="compare-metrics">' +
            '<div class="cm-row"><span class="cm-label">Industry</span><span class="cm-value">' + esc(pB.industry || 'N/A') + '</span></div>' +
            '<div class="cm-row"><span class="cm-label">Market cap</span><span class="cm-value">' + (pB.marketCap ? '$' + (pB.marketCap / 1e6).toFixed(2) + 'T' : 'N/A') + '</span></div>' +
            '<div class="cm-row"><span class="cm-label">52w high</span><span class="cm-value">' + (pB.weekHigh52 ? '$' + parseFloat(pB.weekHigh52).toFixed(2) : 'N/A') + '</span></div>' +
            '<div class="cm-row"><span class="cm-label">52w low</span><span class="cm-value">' + (pB.weekLow52 ? '$' + parseFloat(pB.weekLow52).toFixed(2) : 'N/A') + '</span></div>' +
            '<div class="cm-row"><span class="cm-label">Analyst rating</span><span class="cm-value">' + scoreLabel(scoreB) + '</span></div>' +
          '</div>' +
        '</div>' +
        '<div class="verdict-card"><div class="verdict-title">' + esc(tickerA) + ' vs ' + esc(tickerB) + '</div><div class="verdict-text">' + verdictText + '</div></div>' +
      '</div>';
    }

    // Allow Enter key to trigger compare
    document.getElementById('stockA').addEventListener('keydown', function(e) { if (e.key === 'Enter') runCompare(); });
    document.getElementById('stockB').addEventListener('keydown', function(e) { if (e.key === 'Enter') runCompare(); });
  </script>
