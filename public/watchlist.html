<!DOCTYPE html>
<html lang="en" style="background:#F3EEDF">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trade Track</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Archivo:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* paper */
      --paper: #F3EEDF;
      --paper-raise: #FBF7EB;
      --paper-bright: #FFFDF4;
      --paper-sunken: #ECE5D0;
      /* ink */
      --ink: #23281F;
      --ink-muted: #686C5B;
      --ink-faint: #9A9C8B;
      /* rules (the printed lines of ledger paper) */
      --rule: #DDD5BE;
      --rule-strong: #C6BEA2;
      --margin-red: #C05A50;
      /* the bank */
      --green: #17442F;
      --green-deep: #0F3323;
      --green-bright: #1E5C3D;
      --brass: #A97F2F;
      --brass-soft: #C9A75C;
      /* money */
      --up: #1D6A43;
      --up-bg: #E3EBDA;
      --down: #8C2F2B;
      --down-bg: #F1E0D8;
      /* type */
      --font-display: 'Marcellus', 'Georgia', serif;
      --font-ui: 'Archivo', system-ui, sans-serif;
      --font-data: 'Courier Prime', 'Courier New', monospace;
      --shadow-paper: 0 1px 0 rgba(35,40,31,0.05), 0 8px 22px rgba(35,40,31,0.08);
      /* legacy aliases so any straggler rule still resolves */
      --text: var(--ink);
      --text-muted: var(--ink-muted);
      --text-faint: var(--ink-faint);
      --border: var(--rule-strong);
      --border-soft: var(--rule);
      --surface: var(--paper-raise);
      --surface-hover: var(--paper-bright);
      --accent: var(--brass);
      --bg: var(--paper);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-ui);
      display: flex;
      justify-content: center;
      padding: 40px 24px;
    }

    a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid var(--brass);
      outline-offset: 2px;
    }

    .app {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      align-items: flex-start;
      gap: 34px;
    }

    /* ---- Sidebar: the ledger's cover ---- */
    .sidebar {
      width: 232px;
      flex-shrink: 0;
      position: sticky;
      top: 40px;
      display: flex;
      flex-direction: column;
      gap: 26px;
      background: var(--green);
      border: 1px solid var(--green-deep);
      border-radius: 4px;
      padding: 22px 16px;
      box-shadow: var(--shadow-paper);
      color: #EFE9D4;
    }
    .sidebar-brand { display: flex; align-items: center; gap: 11px; }
    .sidebar-title {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 400;
      letter-spacing: 0.02em;
      color: #F3EEDF;
    }
    .sidebar .eyebrow { color: var(--brass-soft); }

    .side-nav { display: flex; flex-direction: column; gap: 2px; }
    .side-nav-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 3px;
      color: #B9C1AC;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.01em;
    }
    .side-nav-link svg { flex-shrink: 0; }
    .side-nav-link:hover { background: rgba(243,238,223,0.08); color: #F3EEDF; }
    .side-nav-link.active {
      background: rgba(15,51,35,0.85);
      color: #F3EEDF;
      box-shadow: inset 2px 0 0 var(--brass-soft);
    }

    .account-block {
      margin-top: auto;
      padding-top: 18px;
      border-top: 1px solid rgba(243,238,223,0.16);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .account-row { display: flex; align-items: center; }
    .account-avatar-wrap { position: relative; display: inline-flex; }
    .account-avatar {
      width: 32px;
      height: 32px;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-data);
      font-weight: 700;
      font-size: 13px;
      color: #F3EEDF;
      border: 1px solid rgba(243,238,223,0.25);
      flex-shrink: 0;
      cursor: default;
    }
    .account-email {
      position: absolute;
      left: calc(100% + 10px);
      top: 50%;
      transform: translateY(-50%);
      background: var(--green-deep);
      border: 1px solid rgba(201,167,92,0.5);
      color: #F3EEDF;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 3px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
      z-index: 20;
    }
    .account-avatar-wrap:hover .account-email { opacity: 1; }
    .btn-logout-full {
      display: flex;
      align-items: center;
      gap: 8px;
      background: none;
      border: 1px solid rgba(243,238,223,0.25);
      color: #B9C1AC;
      border-radius: 3px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      font-family: var(--font-ui);
      cursor: pointer;
    }
    .btn-logout-full:hover { border-color: #D99C92; color: #F1D8D2; }

    .main-content { flex: 1; min-width: 0; }

    @media (max-width: 800px) {
      .app { flex-direction: column; }
      .sidebar {
        width: 100%;
        position: static;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px;
      }
      .side-nav { flex-direction: row; }
      .account-block {
        margin-top: 0;
        padding-top: 0;
        border-top: none;
        flex-direction: row;
      }
      .account-email { display: none; }
    }

    /* ---- Shared identity bits ---- */
    .brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    .brand-row > div:nth-child(2) { flex: 1; }
    .brand-mark { border-radius: 4px; flex-shrink: 0; }

    .eyebrow {
      font-family: var(--font-ui);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--brass);
      margin-bottom: 5px;
    }
    h1 {
      font-family: var(--font-display);
      font-weight: 400;
      letter-spacing: 0.01em;
    }

    /* ---- Auth screen: the certificate ---- */
    .auth-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card {
      width: 100%;
      max-width: 380px;
      background: var(--paper-raise);
      border: 1px solid var(--rule-strong);
      border-radius: 3px;
      padding: 38px 34px;
      box-shadow: var(--shadow-paper);
      position: relative;
    }
    .auth-card::before {
      content: '';
      position: absolute;
      inset: 8px;
      border: 1px solid var(--brass-soft);
      border-radius: 2px;
      pointer-events: none;
      opacity: 0.75;
    }
    .auth-card .brand-row { margin-bottom: 26px; }
    .auth-card h1 { font-size: 27px; }

    .auth-tabs {
      display: flex;
      gap: 4px;
      background: var(--paper-sunken);
      border: 1px solid var(--rule);
      border-radius: 3px;
      padding: 4px;
      margin-bottom: 20px;
      position: relative;
    }
    .auth-tab {
      flex: 1;
      background: none;
      border: none;
      color: var(--ink-muted);
      font-family: var(--font-ui);
      font-size: 13px;
      font-weight: 600;
      padding: 8px 0;
      border-radius: 2px;
      cursor: pointer;
    }
    .auth-tab.active { background: var(--green); color: #F3EEDF; }

    #authForm { display: flex; flex-direction: column; gap: 10px; position: relative; }
    #authForm input {
      width: 100%;
      background: var(--paper-bright);
      border: 1px solid var(--rule-strong);
      border-radius: 2px;
      padding: 11px 14px;
      color: var(--ink);
      font-size: 14px;
      font-family: var(--font-ui);
      outline: none;
    }
    #authForm input:focus { border-color: var(--green); }
    .auth-hint { font-size: 11px; color: var(--ink-faint); margin-top: -4px; }
    .auth-msg { font-size: 13px; color: var(--down); min-height: 16px; }
    .btn-auth-submit {
      background: var(--green);
      color: #F3EEDF;
      border: none;
      border-radius: 2px;
      padding: 12px 0;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-family: var(--font-ui);
      cursor: pointer;
      margin-top: 6px;
    }
    .btn-auth-submit:hover { background: var(--green-bright); }
    .btn-auth-submit:disabled { opacity: 0.6; cursor: default; }

    /* ---- Section headings: ledger column heads ---- */
    .section-label {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: var(--font-ui);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin: 30px 0 12px;
    }
    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--rule-strong);
    }
    .section-label:first-of-type { margin-top: 0; }

    /* ---- Skeleton loading on paper ---- */
    .skeleton {
      background: linear-gradient(90deg, #E9E1CB 25%, #DFD6BD 37%, #E9E1CB 63%);
      background-size: 400% 100%;
      animation: shimmer 1.6s ease infinite;
      border-radius: 2px;
    }
    @keyframes shimmer {
      0% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .skeleton { animation: none; }
    }

    /* ---- Watchlist header ---- */
    h1 { font-size: 34px; }
    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 0 0 20px;
    }
    .meta { font-family: var(--font-data); font-size: 12px; color: var(--ink-muted); }
    .refresh-btn {
      background: none;
      border: 1px solid var(--rule-strong);
      color: var(--ink-muted);
      border-radius: 2px;
      padding: 8px 14px;
      font-size: 12px;
      font-family: var(--font-ui);
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .refresh-btn:hover { border-color: var(--green); color: var(--ink); }

    /* ---- Summary strip ---- */
    .summary {
      display: flex;
      gap: 12px;
      margin-bottom: 22px;
    }
    .summary-pill {
      flex: 1;
      background: var(--paper-raise) linear-gradient(var(--margin-red), var(--margin-red)) no-repeat 15px 0 / 1px 100%;
      border: 1px solid var(--rule-strong);
      border-radius: 3px;
      box-shadow: var(--shadow-paper);
      padding: 13px 16px 13px 26px;
    }
    .summary-pill .label {
      font-size: 10px;
      font-weight: 700;
      color: var(--ink-faint);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 4px;
    }
    .summary-pill .value {
      font-family: var(--font-data);
      font-size: 22px;
      font-weight: 700;
    }
    .summary-pill.up .value { color: var(--up); }
    .summary-pill.down .value { color: var(--down); }

    /* ---- Search ---- */
    .add-wrap { position: relative; margin-bottom: 22px; }
    .add-row {
      display: flex;
      gap: 8px;
      background: var(--paper-bright);
      border: 1px solid var(--rule-strong);
      border-radius: 2px;
      padding: 5px;
      transition: border-color 0.15s;
    }
    .add-row:focus-within { border-color: var(--green); }
    .search-icon { display: flex; align-items: center; padding-left: 12px; color: var(--ink-faint); }
    input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 11px 8px;
      color: var(--ink);
      font-size: 14px;
      font-family: var(--font-ui);
      outline: none;
    }
    input::placeholder { color: var(--ink-faint); }
    .btn-add {
      background: var(--green);
      color: #F3EEDF;
      border: none;
      border-radius: 2px;
      padding: 0 20px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-family: var(--font-ui);
      cursor: pointer;
    }
    .btn-add:hover { background: var(--green-bright); }

    .suggestions {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: var(--paper-raise);
      border: 1px solid var(--rule-strong);
      border-radius: 3px;
      overflow: hidden;
      z-index: 10;
      box-shadow: 0 16px 40px rgba(35,40,31,0.18);
    }
    .suggestion {
      display: flex;
      align-items: center;
      gap: 0;
      padding: 0;
      cursor: pointer;
      border-bottom: 1px solid var(--rule);
    }
    .suggestion:last-child { border-bottom: none; }
    .suggestion:hover { background: var(--paper-bright); }
    .s-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      flex: 1;
      min-width: 0;
      text-decoration: none;
      color: inherit;
    }
    .s-symbol {
      font-family: var(--font-data);
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.02em;
      white-space: nowrap;
      min-width: 52px;
    }
    .s-name {
      color: var(--ink-muted);
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .s-add {
      background: none;
      border: none;
      border-left: 1px solid var(--rule);
      color: var(--ink-faint);
      font-size: 18px;
      font-weight: 700;
      font-family: var(--font-data);
      padding: 11px 14px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .s-add:hover { color: var(--green); background: var(--up-bg); }

    .msg { min-height: 18px; font-size: 13px; margin: -12px 0 14px 4px; color: var(--ink-muted); }
    .msg.error { color: var(--down); }
    .server-error {
      color: var(--down);
      font-size: 13px;
      background: var(--down-bg);
      border: 1px solid #D3AC9F;
      border-radius: 2px;
      padding: 10px 14px;
      margin-bottom: 16px;
    }
    .server-error:empty { display: none; }

    /* ---- Watchlist entries ---- */
    .list { display: flex; flex-direction: column; gap: 10px; }
    .empty {
      padding: 56px 24px;
      text-align: center;
      color: var(--ink-muted);
      font-size: 14px;
      border: 1px dashed var(--rule-strong);
      border-radius: 3px;
    }
    .btn-onboard {
      background: var(--green); color: #F3EEDF; border: none;
      border-radius: 2px; padding: 8px 16px;
      font-family: var(--font-data); font-size: 13px; font-weight: 700;
      cursor: pointer; letter-spacing: 0.02em;
    }
    .btn-onboard:hover { background: var(--green-bright); }

    .card {
      display: flex;
      background: var(--paper-raise) linear-gradient(var(--margin-red), var(--margin-red)) no-repeat 15px 0 / 1px 100%;
      border: 1px solid var(--rule-strong);
      border-radius: 3px;
      box-shadow: var(--shadow-paper);
      padding: 16px 18px 16px 26px;
      transition: border-color 0.15s;
      gap: 14px;
    }
    .card:hover { border-color: var(--brass-soft); }

    .card.dragging { opacity: 0.35; }
    .card.drag-over-top { box-shadow: inset 0 2px 0 var(--brass); }
    .card.drag-over-bottom { box-shadow: inset 0 -2px 0 var(--brass); }

    .drag-handle {
      display: flex;
      align-items: center;
      color: var(--rule-strong);
      cursor: grab;
      flex-shrink: 0;
      touch-action: none;
    }
    .drag-handle:active { cursor: grabbing; }
    .card:hover .drag-handle { color: var(--ink-faint); }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 3px;
      border: 1px solid var(--rule);
      flex-shrink: 0;
      object-fit: contain;
      background: #fff;
      padding: 4px;
    }
    .avatar-fallback {
      width: 40px;
      height: 40px;
      border-radius: 3px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-data);
      font-weight: 700;
      font-size: 15px;
      color: #F3EEDF;
    }

    .card-body { flex: 1; min-width: 0; }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .card-id { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .ticker-row { display: flex; align-items: baseline; gap: 8px; }
    .ticker {
      font-family: var(--font-data);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .ticker-link { color: inherit; text-decoration: none; }
    .ticker-link:hover { color: var(--green-bright); }
    .company-name {
      font-size: 12px;
      color: var(--ink-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 200px;
    }

    .card-price { text-align: right; flex-shrink: 0; }
    .price {
      font-family: var(--font-data);
      font-size: 24px;
      font-weight: 700;
      line-height: 1;
    }
    .change {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      margin-top: 6px;
      font-family: var(--font-data);
      font-size: 12px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 2px;
    }
    .change.up { color: var(--up); background: var(--up-bg); }
    .change.down { color: var(--down); background: var(--down-bg); }
    .change.flat { color: var(--ink-muted); background: var(--paper-sunken); }

    /* ---- Sparkline ---- */
    .sparkline-wrap {
      height: 32px;
      margin-bottom: 10px;
    }
    .sparkline { width: 100%; height: 100%; display: block; }
    .sparkline-empty {
      height: 32px;
      display: flex;
      align-items: center;
      font-size: 11px;
      color: var(--ink-faint);
      font-style: italic;
    }
    .sparkline-label {
      font-family: var(--font-data);
      font-size: 9px;
      color: var(--ink-faint);
      margin-top: 2px;
    }

    /* ---- Day range ---- */
    .range-row { display: flex; align-items: center; gap: 10px; }
    .range-label {
      font-family: var(--font-data);
      font-size: 10px;
      color: var(--ink-faint);
      width: 50px;
      text-align: right;
    }
    .range-label.left { text-align: left; }
    .range-track {
      position: relative;
      flex: 1;
      height: 5px;
      background: var(--paper-sunken);
      border-radius: 0;
      overflow: visible;
    }
    .range-fill {
      position: absolute;
      top: 0; left: 0;
      height: 100%;
      background: linear-gradient(90deg, var(--down), var(--up));
      opacity: 0.3;
    }
    .range-dot {
      position: absolute;
      top: 50%;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      border: 2px solid var(--paper-raise);
      box-shadow: 0 0 0 1px var(--rule-strong);
    }
    .range-dot.up { background: var(--up); }
    .range-dot.down { background: var(--down); }
    .range-dot.flat { background: var(--ink-muted); }

    .card-footer-msg { font-size: 12px; color: var(--ink-faint); }

    /* ---- Alerts ---- */
    .btn-bell {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: none;
      border: none;
      color: var(--ink-faint);
      cursor: pointer;
      padding: 0;
    }
    .btn-bell:hover { color: var(--brass); }
    .btn-bell.has-alerts { color: var(--brass); }
    .bell-count {
      font-family: var(--font-data);
      font-size: 10px;
      font-weight: 700;
    }

    .alerts-panel {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed var(--rule-strong);
    }
    .alert-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      font-size: 12px;
    }
    .alert-label { color: var(--ink); flex: 1; }
    .alert-fired {
      font-size: 10px;
      color: var(--ink-faint);
      font-style: italic;
    }
    .btn-alert-remove {
      background: none;
      border: none;
      color: var(--ink-faint);
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      padding: 0 2px;
    }
    .btn-alert-remove:hover { color: var(--down); }
    .alert-empty {
      font-size: 12px;
      color: var(--ink-faint);
      padding: 4px 0 8px;
    }
    .alert-form {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    .alert-type-select, .alert-threshold-input {
      background: var(--paper-bright);
      border: 1px solid var(--rule-strong);
      border-radius: 2px;
      color: var(--ink);
      font-size: 12px;
      font-family: var(--font-ui);
      padding: 6px 8px;
    }
    .alert-type-select { flex: 1.4; }
    .alert-threshold-input { flex: 1; min-width: 0; }
    .btn-alert-add {
      background: var(--green);
      color: #F3EEDF;
      border: none;
      border-radius: 2px;
      padding: 0 12px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-family: var(--font-ui);
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-alert-add:hover { background: var(--green-bright); }

    .btn-remove {
      background: none;
      border: none;
      color: var(--ink-faint);
      font-size: 11px;
      font-family: var(--font-ui);
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
      white-space: nowrap;
    }
    .btn-remove:hover { color: var(--down); }

    .skel-price { width: 70px; height: 24px; margin-left: auto; }
    .skel-change { width: 48px; height: 18px; margin: 6px 0 0 auto; }
    .skel-range { width: 100%; height: 5px; }

    @media (prefers-reduced-motion: reduce) {
      .card { transition: none; }
    }

    @media (max-width: 480px) {
      .company-name { max-width: 120px; }
      h1 { font-size: 28px; }
    }

    /* ---- Mobile bottom tab bar ---- */
    .bottom-tabs {
      display: none;
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--green); border-top: 1px solid var(--green-deep);
      z-index: 100; padding: 6px 0 env(safe-area-inset-bottom, 6px);
    }
    .bottom-tabs nav {
      display: flex; justify-content: space-around; align-items: center;

    .tab-link {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      text-decoration: none; color: #B9C1AC; font-size: 10px; font-weight: 600;
      padding: 4px 8px; letter-spacing: 0.02em;
    }
    .tab-link:hover, .tab-link.active { color: #F3EEDF; }
    .tab-link.active svg { stroke: var(--brass-soft); }

    @media (max-width: 800px) {
      .sidebar { display: none !important; }
      .bottom-tabs { display: block; }
      .app { padding-bottom: 72px; }
      body { padding: 20px 16px 0; }
    }

  </style>
</head>
<body>

        <a href="/watchlist.html" class="side-nav-link active">

        </a>
        <a href="/articles.html" class="side-nav-link">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>

          Settings
        </a>

      <div class="account-block">
        <div class="account-row">
          <div class="account-avatar-wrap">
            <div class="account-avatar" id="accountAvatar">?</div>
            <div class="account-email" id="accountEmail">Loading…</div>

        <button class="btn-logout-full" id="logoutBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>

    <div class="main-content">
    <div class="meta-row">
      <div class="meta" id="lastUpdated">not yet loaded</div>
      <button class="refresh-btn" id="refreshBtn">↻ Refresh</button>
    </div>

    <div class="summary" id="summary" style="display:none;">
      <div class="summary-pill up">
        <div class="label">Up today</div>
        <div class="value" id="upCount">0</div>
      </div>
      <div class="summary-pill down">
        <div class="label">Down today</div>
        <div class="value" id="downCount">0</div>
      </div>
      <div class="summary-pill">
        <div class="label">Watching</div>
        <div class="value" id="watchCount">0</div>
      </div>
    </div>

    <div class="add-wrap">
      <div class="add-row">
        <span class="search-icon">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </span>
        <input id="tickerInput" placeholder="Search, or add several: amazon, microsoft, tesla" autocomplete="off" />
        <button class="btn-add" id="addBtn">Add</button>
      </div>
      <div class="suggestions" id="suggestions"></div>
    </div>
    <div class="msg" id="msg"></div>
    <div class="server-error" id="serverError"></div>

    <div class="list" id="list"></div>
    </div>
  </div>

  <script src="/auth.js"></script>
  <script src="/chat.js"></script>
  <script>
    // Auth (login/signup/logout/session check) now lives in
    // auth.js, shared across every page. AuthGuard.init() wires up
    // the login form and checks for an existing session; initApp()
    // (defined further down) only runs once we're confirmed logged in.
    AuthGuard.init(initApp);

    const input = document.getElementById('tickerInput');
    const addBtn = document.getElementById('addBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const msgEl = document.getElementById('msg');
    const serverErrorEl = document.getElementById('serverError');
    const listEl = document.getElementById('list');
    const suggestionsEl = document.getElementById('suggestions');
    const summaryEl = document.getElementById('summary');
    const watchCountEl = document.getElementById('watchCount');
    const upCountEl = document.getElementById('upCount');
    const downCountEl = document.getElementById('downCount');
    const lastUpdatedEl = document.getElementById('lastUpdated');

    let items = [];
    let quotesByTicker = {};
    let historyByTicker = {};
    let alertsByTicker = {};
    let openAlertTicker = null;   // which card's alert panel is currently expanded
    let lastUpdatedAt = null;

    function esc(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // Accountant's convention: gains carry a plus sign, losses are
    // set in parentheses the way a ledger writes negatives — so the
    // direction is legible even before you register the ink color.
    function fmtPct(v) {
      const abs = Math.abs(v).toFixed(2);
      if (v < 0) return `(${abs}%)`;
      if (v > 0) return `+${abs}%`;
      return `${abs}%`;
    }

    // A handful of accent colors for the fallback avatar badge, picked
    // deterministically per ticker (same ticker always gets the same
    // color) so the UI feels designed, not random on every reload.
    const BADGE_COLORS = ['#17442F', '#A97F2F', '#8C2F2B', '#2E4056', '#5F6B3C', '#7A4E2D'];
    function badgeColor(ticker) {
      let hash = 0;
      for (let i = 0; i < ticker.length; i++) hash = ticker.charCodeAt(i) + ((hash << 5) - hash);
      return BADGE_COLORS[Math.abs(hash) % BADGE_COLORS.length];
    }

    function avatarHtml(item) {
      if (item.logo) {
        return `<img class="avatar" src="${esc(item.logo)}" alt=""
                 onerror="this.outerHTML='<div class=&quot;avatar-fallback&quot; style=&quot;background:${badgeColor(item.ticker)}&quot;>${item.ticker[0]}</div>'" />`;
      }
      return `<div class="avatar-fallback" style="background:${badgeColor(item.ticker)}">${esc(item.ticker[0])}</div>`;
    }

    // ---- Sparkline: a small trend line built from our own stored
    // history (Finnhub's free tier doesn't give us historical data,
    // so we're drawing from the snapshots our own server has been
    // quietly collecting every 15 minutes). ----
    function sparklineHtml(ticker) {
      const points = historyByTicker[ticker];

      if (!points || points.length < 2) {
        return `<div class="sparkline-empty">Collecting history — check back soon</div>`;
      }

      const width = 100, height = 32;
      const prices = points.map(p => p.price);
      const min = Math.min(...prices);
      const max = Math.max(...prices);
      const range = max - min;

      const stepX = width / (points.length - 1);
      const coords = points.map((p, i) => {
        const x = i * stepX;
        const y = range === 0 ? height / 2 : height - ((p.price - min) / range) * height;
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(' ');

      const trendUp = prices[prices.length - 1] >= prices[0];
      const stroke = trendUp ? 'var(--up)' : 'var(--down)';

      // Time range label
      const first = new Date(points[0].recordedAt);
      const last = new Date(points[points.length - 1].recordedAt);
      const fmtShort = d => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      const spanLabel = fmtShort(first) === fmtShort(last)
        ? fmtShort(first)
        : `${fmtShort(first)} – ${fmtShort(last)}`;

      return `
        <svg class="sparkline" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">
          <polyline points="${coords}" fill="none" style="stroke:${stroke}"
            stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" />
        </svg>
        <div class="sparkline-label">${spanLabel} · ${points.length} snapshots</div>
      `;
    }

    function rangeBarHtml(q) {
      const { dayLow: lo, dayHigh: hi, price } = q;
      if (lo == null || hi == null || price == null) {
        return `<div class="range-row">
          <span class="range-label left"></span>
          <div class="range-track"><div class="skeleton skel-range"></div></div>
          <span class="range-label"></span>
        </div>`;
      }
      const pct = hi === lo ? 50 : Math.max(0, Math.min(100, ((price - lo) / (hi - lo)) * 100));
      const dir = q.changePercent > 0 ? 'up' : q.changePercent < 0 ? 'down' : 'flat';

      return `
        <div class="range-row">
          <span class="range-label left">$${lo.toFixed(2)}</span>
          <div class="range-track">
            <div class="range-fill" style="width:${pct}%"></div>
            <div class="range-dot ${dir}" style="left:${pct}%"></div>
          </div>
          <span class="range-label">$${hi.toFixed(2)}</span>
        </div>
      `;
    }

    // A small grip icon so people notice cards are draggable, without
    // needing to explain it in words.
    const DRAG_HANDLE = `
      <span class="drag-handle" title="Drag to reorder">
        <svg width="10" height="16" viewBox="0 0 10 16" fill="currentColor">
          <circle cx="2" cy="2" r="1.4"/><circle cx="8" cy="2" r="1.4"/>
          <circle cx="2" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/>
          <circle cx="2" cy="14" r="1.4"/><circle cx="8" cy="14" r="1.4"/>
        </svg>
      </span>`;

    function conditionLabel(alert) {
      const t = parseFloat(alert.threshold);
      switch (alert.condition_type) {
        case 'percent_drop': return `Drops ${t}% in a day`;
        case 'percent_gain': return `Rises ${t}% in a day`;
        case 'price_above': return `Price reaches $${t.toFixed(2)}`;
        case 'price_below': return `Price falls to $${t.toFixed(2)}`;
        default: return 'Alert';
      }
    }

    function alertsPanelHtml(ticker) {
      const alerts = alertsByTicker[ticker] || [];

      const rowsHtml = alerts.length
        ? alerts.map(a => `
            <div class="alert-row">
              <span class="alert-label">${esc(conditionLabel(a))}</span>
              ${!a.active ? '<span class="alert-fired">fired \u2014 off</span>' : ''}
              <button class="btn-alert-remove" data-id="${a.id}" title="Delete alert">\u00d7</button>
            </div>
          `).join('')
        : '<div class="alert-empty">No alerts set for this ticker yet</div>';

      return `
        <div class="alerts-panel">
          ${rowsHtml}
          <div class="alert-form">
            <select class="alert-type-select">
              <option value="percent_drop">Drops by %</option>
              <option value="percent_gain">Rises by %</option>
              <option value="price_above">Price reaches $</option>
              <option value="price_below">Price falls to $</option>
            </select>
            <input type="number" class="alert-threshold-input" placeholder="5" min="0" step="0.01" />
            <button class="btn-alert-add" data-ticker="${esc(ticker)}">Set alert</button>
          </div>
        </div>
      `;
    }

    function bellButtonHtml(ticker) {
      const activeCount = (alertsByTicker[ticker] || []).filter(a => a.active).length;
      return `
        <button class="btn-bell ${activeCount ? 'has-alerts' : ''}" data-ticker="${esc(ticker)}" title="Manage alerts">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          ${activeCount ? `<span class="bell-count">${activeCount}</span>` : ''}
        </button>
      `;
    }

    function cardHtml(item) {
      const q = quotesByTicker[item.ticker];
      const nameHtml = item.name ? `<div class="company-name">${esc(item.name)}</div>` : '';
      const dirClass = q && !q.error ? (q.changePercent > 0 ? 'dir-up' : q.changePercent < 0 ? 'dir-down' : '') : '';

      if (!q) {
        return `
          <div class="card" draggable="true" data-ticker="${esc(item.ticker)}">
            ${DRAG_HANDLE}
            ${avatarHtml(item)}
            <div class="card-body">
              <div class="card-top">
                <div class="card-id">
                  <div class="ticker-row"><span class="ticker"><a href="/stock.html?t=${encodeURIComponent(item.ticker)}" class="ticker-link">${esc(item.ticker)}</a></span></div>
                  ${nameHtml}
                </div>
                <div class="card-price">
                  <div class="skeleton skel-price"></div>
                  <div class="skeleton skel-change"></div>
                </div>
              </div>
              <div class="range-row">
                <span class="range-label left"></span>
                <div class="range-track"><div class="skeleton skel-range"></div></div>
                <span class="range-label"></span>
              </div>
            </div>
          </div>
        `;
      }

      if (q.error) {
        return `
          <div class="card" draggable="true" data-ticker="${esc(item.ticker)}">
            ${DRAG_HANDLE}
            ${avatarHtml(item)}
            <div class="card-body">
              <div class="card-top">
                <div class="card-id">
                  <div class="ticker-row"><span class="ticker"><a href="/stock.html?t=${encodeURIComponent(item.ticker)}" class="ticker-link">${esc(item.ticker)}</a></span></div>
                  ${nameHtml}
                </div>
                <button class="btn-remove" data-ticker="${esc(item.ticker)}">Remove</button>
              </div>
              <div class="card-footer-msg">${esc(q.error)}</div>
            </div>
          </div>
        `;
      }

      const dir = q.changePercent > 0 ? 'up' : q.changePercent < 0 ? 'down' : 'flat';

      return `
        <div class="card ${dirClass}" draggable="true" data-ticker="${esc(item.ticker)}">
          ${DRAG_HANDLE}
          ${avatarHtml(item)}
          <div class="card-body">
            <div class="card-top">
              <div class="card-id">
                <div class="ticker-row">
                  <span class="ticker"><a href="/stock.html?t=${encodeURIComponent(item.ticker)}" class="ticker-link">${esc(item.ticker)}</a></span>
                  ${bellButtonHtml(item.ticker)}
                  <button class="btn-remove" data-ticker="${esc(item.ticker)}">Remove</button>
                </div>
                ${nameHtml}
              </div>
              <div class="card-price">
                <div class="price">$${q.price.toFixed(2)}</div>
                <div class="change ${dir}">${fmtPct(q.changePercent)}</div>
              </div>
            </div>
            <div class="sparkline-wrap">${sparklineHtml(item.ticker)}</div>
            ${rangeBarHtml(q)}
            ${openAlertTicker === item.ticker ? alertsPanelHtml(item.ticker) : ''}
          </div>
        </div>
      `;
    }

    function render() {
      if (items.length === 0) {
        summaryEl.style.display = 'none';
        listEl.innerHTML = `<div class="empty">
          <div style="font-size:16px;font-family:var(--font-display);margin-bottom:12px">Your watchlist is empty</div>
          <div style="margin-bottom:16px">Start by adding a few stocks to track. Here are some popular ones:</div>
          <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center">
            <button class="btn-onboard" onclick="quickAdd('AAPL','Apple Inc')">AAPL</button>
            <button class="btn-onboard" onclick="quickAdd('MSFT','Microsoft Corp')">MSFT</button>
            <button class="btn-onboard" onclick="quickAdd('GOOGL','Alphabet Inc')">GOOGL</button>
            <button class="btn-onboard" onclick="quickAdd('AMZN','Amazon.com Inc')">AMZN</button>
            <button class="btn-onboard" onclick="quickAdd('TSLA','Tesla Inc')">TSLA</button>
            <button class="btn-onboard" onclick="quickAdd('NVDA','NVIDIA Corp')">NVDA</button>
          </div>
          <div style="margin-top:14px;font-size:12px;color:var(--ink-faint)">Or search for any company above</div>
        </div>`;
        return;
      }

      let up = 0, down = 0;
      items.forEach(item => {
        const q = quotesByTicker[item.ticker];
        if (q && !q.error) {
          if (q.changePercent > 0) up++;
          else if (q.changePercent < 0) down++;
        }
      });
      watchCountEl.textContent = items.length;
      upCountEl.textContent = up;
      downCountEl.textContent = down;
      summaryEl.style.display = 'flex';

      // Update the browser tab: "3↑ 2↓ — Trade Track"
      if (up + down > 0) {
        document.title = `${up}↑ ${down}↓ · ${items.length} stocks — Trade Track`;
      } else {
        document.title = `${items.length} stocks — Trade Track`;
      }

      listEl.innerHTML = items.map(cardHtml).join('');
    }

    function updateLastUpdatedLabel() {
      if (!lastUpdatedAt) return;
      const secs = Math.floor((Date.now() - lastUpdatedAt) / 1000);
      lastUpdatedEl.textContent = secs < 5 ? 'Updated just now' : `Updated ${secs}s ago`;
    }
    setInterval(updateLastUpdatedLabel, 1000);

    async function loadWatchlist() {
      const res = await AuthGuard.fetch('/api/watchlist');
      const data = await res.json();
      if (!res.ok) {
        serverErrorEl.textContent = data.error || 'Could not load watchlist';
        return;
      }
      items = data.items;
      render();
      loadPrices();
      loadHistory();
    }

    async function loadPrices() {
      serverErrorEl.textContent = '';
      try {
        const res = await AuthGuard.fetch('/api/prices');
        const data = await res.json();
        if (!res.ok) {
          serverErrorEl.textContent = data.error || 'Could not load prices';
          return;
        }
        quotesByTicker = {};
        data.quotes.forEach(q => { quotesByTicker[q.ticker] = q; });
        lastUpdatedAt = Date.now();
        updateLastUpdatedLabel();
        render();
      } catch (err) {
        serverErrorEl.textContent = 'Could not reach the server';
      }
    }

    // New history points only appear every 15 minutes (that's how
    // often the server snapshots), so there's no need to re-fetch
    // this as often as prices. Every 2 minutes is plenty responsive
    // without doing pointless extra work.
    async function loadHistory() {
      try {
        const res = await AuthGuard.fetch('/api/history');
        const data = await res.json();
        if (res.ok) {
          historyByTicker = data.history;
          render();
        }
      } catch (err) {
        // Silent on purpose — the sparkline just shows its
        // "collecting history" placeholder until this succeeds.
      }
    }

    function groupAlertsByTicker(alerts) {
      const grouped = {};
      alerts.forEach(a => {
        if (!grouped[a.ticker]) grouped[a.ticker] = [];
        grouped[a.ticker].push(a);
      });
      return grouped;
    }

    async function loadAlerts() {
      try {
        const res = await AuthGuard.fetch('/api/alerts');
        const data = await res.json();
        if (res.ok) {
          alertsByTicker = groupAlertsByTicker(data.alerts);
          render();
        }
      } catch (err) {
        // Silent — alert badges just won't show counts until this succeeds.
      }
    }

    async function addAlert(ticker, conditionType, threshold) {
      const res = await AuthGuard.fetch('/api/alerts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ticker, conditionType, threshold }),
      });
      const data = await res.json();
      if (res.ok) {
        alertsByTicker = groupAlertsByTicker(data.alerts);
        render();
      }
    }

    async function removeAlert(id) {
      const res = await AuthGuard.fetch('/api/alerts/' + id, { method: 'DELETE' });
      const data = await res.json();
      if (res.ok) {
        alertsByTicker = groupAlertsByTicker(data.alerts);
        render();
      }
    }

    // Adds ONE already-resolved ticker+name pair (used both by the
    // suggestion-dropdown click, and internally by the multi-ticker
    // flow below). Returns the server's response data so callers
    // can tell success from failure without duplicating logic.
    async function addOneTicker(ticker, name) {
      const res = await AuthGuard.fetch('/api/watchlist', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ticker, name: name || '' })
      });
      const data = await res.json();
      return { ok: res.ok, data };
    }

    async function quickAdd(ticker, name) {
      const btn = event.target;
      btn.disabled = true;
      btn.textContent = '...';
      await addOneTicker(ticker, name);
      await loadWatchlist();
      loadPrices();
      loadHistory();
    }

    async function addTickerDirect(ticker, name) {
      const { ok, data } = await addOneTicker(ticker, name);

      if (!ok) {
        msgEl.textContent = data.error;
        msgEl.className = 'msg error';
        return;
      }

      msgEl.textContent = '';
      input.value = '';
      suggestionsEl.innerHTML = '';
      items = data.items;
      render();
      loadPrices();
    }

    // Resolves a single typed name/ticker (e.g. "amazon" or "MSFT")
    // into an actual ticker symbol + company name via search,
    // falling back to treating it as a literal ticker if search
    // finds nothing.
    async function resolveQuery(query) {
      const searchRes = await AuthGuard.fetch('/api/search?q=' + encodeURIComponent(query));
      const searchData = await searchRes.json();
      if (searchData.results && searchData.results[0]) {
        return { ticker: searchData.results[0].symbol, name: searchData.results[0].name };
      }
      return { ticker: query.toUpperCase(), name: null };
    }

    // Handles the Add button / Enter key. Splits on commas so
    // "amazon, microsoft, tesla" adds all three in one go — a
    // single ticker with no comma is just a list of one, so the
    // normal single-add case flows through the exact same code.
    async function addTicker() {
      const raw = input.value.trim();
      if (!raw) return;

      const queries = raw.split(',').map(s => s.trim()).filter(Boolean);
      if (queries.length === 0) return;

      const isBatch = queries.length > 1;
      msgEl.textContent = isBatch ? `Adding ${queries.length} tickers…` : 'Searching…';
      msgEl.className = 'msg';
      suggestionsEl.innerHTML = '';

      const added = [];
      const failed = [];

      // Sequential, not Promise.all: each add depends on knowing the
      // watchlist's current state (for the "already on your list"
      // check and for sort_order), so doing these one at a time
      // avoids two simultaneous inserts racing each other.
      for (const q of queries) {
        const { ticker, name } = await resolveQuery(q);
        const { ok, data } = await addOneTicker(ticker, name);
        if (ok) {
          added.push(ticker);
          items = data.items;
        } else {
          failed.push(`${ticker} (${data.error})`);
        }
      }

      input.value = '';
      render();
      loadPrices();

      if (failed.length === 0) {
        msgEl.textContent = isBatch ? `Added ${added.join(', ')}` : '';
        msgEl.className = 'msg';
      } else if (added.length === 0) {
        msgEl.textContent = `Couldn't add: ${failed.join(', ')}`;
        msgEl.className = 'msg error';
      } else {
        msgEl.textContent = `Added ${added.join(', ')}. Skipped: ${failed.join(', ')}`;
        msgEl.className = 'msg error';
      }
    }

    async function removeTicker(ticker) {
      const res = await AuthGuard.fetch('/api/watchlist/' + ticker, { method: 'DELETE' });
      const data = await res.json();
      items = data.items;
      delete quotesByTicker[ticker];
      render();
    }

    let searchTimer = null;

    input.addEventListener('input', () => {
      clearTimeout(searchTimer);

      // If the person has typed "amazon, micr", the useful thing to
      // suggest against is "micr" — the segment they're currently
      // typing — not the whole string including the finished ones.
      const segments = input.value.split(',');
      const query = segments[segments.length - 1].trim();

      if (query.length < 2) {
        suggestionsEl.innerHTML = '';
        return;
      }
      searchTimer = setTimeout(() => runSearch(query), 300);
    });

    async function runSearch(query) {
      const res = await AuthGuard.fetch('/api/search?q=' + encodeURIComponent(query));
      const data = await res.json();
      renderSuggestions(data.results || []);
    }

    function renderSuggestions(results) {
      if (results.length === 0) {
        suggestionsEl.innerHTML = '';
        return;
      }
      suggestionsEl.innerHTML = results.map(r => `
        <div class="suggestion" data-symbol="${esc(r.symbol)}" data-name="${esc(r.name)}">
          <a href="/stock.html?t=${encodeURIComponent(r.symbol)}" class="s-link">
            <span class="s-symbol">${esc(r.symbol)}</span>
            <span class="s-name">${esc(r.name)}</span>
          </a>
          <button class="s-add" data-symbol="${esc(r.symbol)}" data-name="${esc(r.name)}" title="Add to watchlist">+</button>
        </div>
      `).join('');
    }

    suggestionsEl.addEventListener('click', e => {
      // If they clicked the "+" quick-add button
      const addBtn = e.target.closest('.s-add');
      if (addBtn) {
        e.preventDefault();
        const segments = input.value.split(',');
        if (segments.length === 1) {
          addTickerDirect(addBtn.dataset.symbol, addBtn.dataset.name);
        } else {
          segments[segments.length - 1] = ' ' + addBtn.dataset.symbol;
          input.value = segments.join(',') + ', ';
          suggestionsEl.innerHTML = '';
          input.focus();
        }
        return;
      }

      // If they clicked anywhere else on the suggestion row (but not
      // the link itself — let that navigate naturally), treat it like
      // clicking the link.
      const item = e.target.closest('.suggestion');
      if (!item) return;
      const link = item.querySelector('.s-link');
      if (link && !e.target.closest('.s-link')) {
        window.location.href = link.href;
      }
    });

    document.addEventListener('click', e => {
      if (!e.target.closest('.add-wrap')) suggestionsEl.innerHTML = '';
    });

    addBtn.addEventListener('click', addTicker);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') addTicker(); });

    listEl.addEventListener('click', e => {
      const removeBtn = e.target.closest('.btn-remove');
      if (removeBtn) { removeTicker(removeBtn.dataset.ticker); return; }

      const bellBtn = e.target.closest('.btn-bell');
      if (bellBtn) {
        const t = bellBtn.dataset.ticker;
        openAlertTicker = (openAlertTicker === t) ? null : t;
        render();
        return;
      }

      const addAlertBtn = e.target.closest('.btn-alert-add');
      if (addAlertBtn) {
        const panel = addAlertBtn.closest('.alerts-panel');
        const conditionType = panel.querySelector('.alert-type-select').value;
        const thresholdInput = panel.querySelector('.alert-threshold-input');
        const threshold = parseFloat(thresholdInput.value);

        if (!Number.isFinite(threshold) || threshold <= 0) {
          thresholdInput.focus();
          return;
        }
        addAlert(addAlertBtn.dataset.ticker, conditionType, threshold);
        return;
      }

      const removeAlertBtn = e.target.closest('.btn-alert-remove');
      if (removeAlertBtn) { removeAlert(removeAlertBtn.dataset.id); return; }
    });

    // ---- DRAG-AND-DROP REORDERING ----
    // Uses the browser's native drag-and-drop, not a library. Key
    // design choice: we only touch the DOM (via render()) on 'drop',
    // never during 'dragover'. Re-rendering mid-drag would destroy
    // the very element the browser is tracking as "being dragged"
    // and silently cancel the whole gesture — a classic native-DnD
    // gotcha. During 'dragover' we only toggle CSS classes for the
    // visual indicator line, which is safe to do repeatedly.
    let draggedTicker = null;

    listEl.addEventListener('dragstart', e => {
      // If the user clicked a link (the ticker symbol), let the
      // browser navigate instead of starting a card drag.
      if (e.target.closest('a')) {
        e.preventDefault();
        return;
      }
      const card = e.target.closest('.card');
      if (!card) return;
      draggedTicker = card.dataset.ticker;
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', draggedTicker);   // required by Firefox
    });

    listEl.addEventListener('dragend', e => {
      const card = e.target.closest('.card');
      if (card) card.classList.remove('dragging');
      listEl.querySelectorAll('.card').forEach(c =>
        c.classList.remove('drag-over-top', 'drag-over-bottom')
      );
      draggedTicker = null;
    });

    listEl.addEventListener('dragover', e => {
      const card = e.target.closest('.card');
      if (!card || !draggedTicker || card.dataset.ticker === draggedTicker) return;
      e.preventDefault();   // required — tells the browser "yes, a drop is allowed here"

      // Which half of the target card is the cursor over? That decides
      // whether the dragged card would land above or below it.
      const rect = card.getBoundingClientRect();
      const isAfter = e.clientY > rect.top + rect.height / 2;

      listEl.querySelectorAll('.card').forEach(c =>
        c.classList.remove('drag-over-top', 'drag-over-bottom')
      );
      card.classList.add(isAfter ? 'drag-over-bottom' : 'drag-over-top');
    });

    listEl.addEventListener('drop', e => {
      const card = e.target.closest('.card');
      listEl.querySelectorAll('.card').forEach(c =>
        c.classList.remove('drag-over-top', 'drag-over-bottom')
      );
      if (!card || !draggedTicker) return;
      e.preventDefault();

      const targetTicker = card.dataset.ticker;
      if (targetTicker === draggedTicker) return;

      const draggedIndex = items.findIndex(i => i.ticker === draggedTicker);
      if (draggedIndex === -1) return;

      const [moved] = items.splice(draggedIndex, 1);

      const rect = card.getBoundingClientRect();
      const isAfter = e.clientY > rect.top + rect.height / 2;
      const targetIndex = items.findIndex(i => i.ticker === targetTicker);
      items.splice(isAfter ? targetIndex + 1 : targetIndex, 0, moved);

      render();       // safe now — the drag gesture has already ended
      saveOrder();    // persist the new order to the database
    });

    async function saveOrder() {
      try {
        await AuthGuard.fetch('/api/watchlist/reorder', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ order: items.map(i => i.ticker) })
        });
      } catch (err) {
        // If this fails, the on-screen order and the saved order
        // briefly disagree. loadWatchlist() on the next refresh
        // corrects it, so we don't need to handle this loudly.
      }
    }

    // Called once, right after we know someone is logged in — either
    // immediately (existing session found) or right after they submit
    // the login/signup form.
    let appInitialized = false;
    function initApp() {
      if (appInitialized) return;   // never double-start the intervals
      appInitialized = true;
      loadWatchlist();
      loadAlerts();
      setInterval(loadPrices, 30000);
      setInterval(loadHistory, 120000);
      setInterval(loadAlerts, 120000);
    }
  </script>
